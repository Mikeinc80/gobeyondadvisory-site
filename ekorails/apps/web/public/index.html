<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EKORails — Settlement Orchestration</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b3d2e'/><path d='M8 11h16M8 16h16M8 21h16' stroke='%2364d8a3' stroke-width='2.5' stroke-linecap='round'/></svg>">
</head>
<body>

<!--
  The environment banner is the first thing in the document and is never conditional.
  It states, on every screen, that this deployment moves no real money. The API also
  returns it in a header and in every response envelope, and the client verifies that the
  two agree — see verifyBannerIntegrity() in app.js.
-->
<div id="environment-banner" class="banner" role="status" aria-live="polite">
  <span class="banner-dot" aria-hidden="true"></span>
  <strong>SANDBOX ENVIRONMENT. NO LIVE FUNDS.</strong>
  <span class="banner-detail">Every partner, rate and settlement below is simulated. Balances are not real.</span>
</div>

<div id="root">
  <noscript>
    <div class="notice notice-warning" style="margin:2rem">
      <h2>JavaScript is required</h2>
      <p>
        This console is an authenticated application. It cannot render without JavaScript,
        and it deliberately does not fall back to an unauthenticated view.
      </p>
    </div>
  </noscript>
  <div class="boot" aria-busy="true">
    <div class="boot-mark">EKORails</div>
    <p class="boot-text">Loading console…</p>
  </div>
</div>

<script type="module" src="/assets/app.js" nonce="__CSP_NONCE__"></script>
</body>
</html>
