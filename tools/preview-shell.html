<meta charset="utf-8">
<title>EKORails &amp; Eko Infrastructure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ------------------------------------------------------------------ tokens
   The chrome stays EKORails navy in both themes — it is a viewer frame, and a
   constant frame keeps the eye on the two sites being reviewed. The stage
   behind the page adapts, so the artifact never fights the host ground. */
:root{
  --chrome:#08151F; --chrome-2:#0D2233; --chrome-line:rgba(243,241,236,.14);
  --chrome-ink:#F3F1EC; --chrome-ink-2:#93A3AD; --accent:#6FC3A2; --accent-dim:rgba(111,195,162,.14);
  --stage:#E6E2DA; --stage-ink:#3B474F; --stage-line:#C9C3B8; --page-shadow:rgba(8,21,31,.18);
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:260px; --bar:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#0E1418; --stage-ink:#8D9AA3; --stage-line:#243038; --page-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --stage:#0E1418; --stage-ink:#8D9AA3; --stage-line:#243038; --page-shadow:rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--stage); color:var(--stage-ink);
  font-family:var(--ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
:where(a,button,select,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ------------------------------------------------------------------ toolbar */
.bar{
  height:var(--bar); background:var(--chrome); color:var(--chrome-ink);
  border-bottom:1px solid var(--chrome-line);
  display:flex; align-items:center; gap:16px; padding:0 16px; position:relative; z-index:5;
}
.mark{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mark svg{display:block}
.mark b{font-weight:700;font-size:13px;letter-spacing:.2px}
.mark span{font-weight:400;color:var(--chrome-ink-2);font-size:13px}
.seg{display:flex;gap:2px;background:rgba(243,241,236,.07);padding:3px;border-radius:5px}
.seg button{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--chrome-ink-2);
  font:600 12px/1 var(--ui);padding:7px 12px;border-radius:3px;white-space:nowrap;
}
.seg button:hover{color:var(--chrome-ink)}
.seg button[aria-pressed="true"]{background:var(--accent-dim);color:var(--accent)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.widths{display:flex;gap:2px;background:rgba(243,241,236,.07);padding:3px;border-radius:5px}
.widths button{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--chrome-ink-2);
  font:500 11px/1 var(--mono);letter-spacing:.4px;padding:7px 10px;border-radius:3px;
}
.widths button:hover{color:var(--chrome-ink)}
.widths button[aria-pressed="true"]{background:var(--accent-dim);color:var(--accent)}
.pagepick{display:none}

/* ------------------------------------------------------------------ layout */
.wrap{display:flex;height:calc(100% - var(--bar))}

/* ------------------------------------------------------------------ page rail */
.rail{
  flex:0 0 var(--rail); background:var(--chrome-2); color:var(--chrome-ink-2);
  border-right:1px solid var(--chrome-line); overflow-y:auto; padding:14px 0 40px;
}
.rail h2{
  margin:0; padding:12px 18px 8px;
  font:600 10px/1 var(--mono); letter-spacing:1.4px; text-transform:uppercase; color:#6C7C87;
}
.rail ol{list-style:none;margin:0;padding:0}
.rail a{
  display:grid; grid-template-columns:26px 1fr; gap:8px; align-items:baseline;
  padding:8px 18px; text-decoration:none; color:var(--chrome-ink-2); font-size:13px;
  border-left:2px solid transparent;
}
.rail a:hover{color:var(--chrome-ink);background:rgba(243,241,236,.04)}
.rail a[aria-current="true"]{color:var(--chrome-ink);border-left-color:var(--accent);background:rgba(111,195,162,.08)}
.rail a i{font:500 10px/1.6 var(--mono);color:#5C6B75;font-style:normal}
.rail a[aria-current="true"] i{color:var(--accent)}
.rail .util{opacity:.62}

/* ------------------------------------------------------------------ stage */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.urlbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--stage-line);
  font:500 12px/1 var(--mono);color:var(--stage-ink);
}
.urlbar .lock{color:var(--stage-ink);opacity:.6}
.urlbar .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlbar .u b{font-weight:600;color:inherit}
.urlbar .meta{margin-left:auto;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urlbar .todo{
  flex:0 0 auto;font:600 11px/1 var(--mono);letter-spacing:.4px;
  color:#7A5F22;background:rgba(168,134,63,.14);border:1px dashed rgba(122,95,34,.5);
  border-radius:3px;padding:5px 7px;white-space:nowrap;
}
.urlbar .todo[hidden]{display:none}
.copyref{
  flex:0 0 auto;appearance:none;cursor:pointer;white-space:nowrap;
  background:none;border:1px solid var(--stage-line);color:var(--stage-ink);
  border-radius:3px;padding:5px 9px;font:500 11px/1 var(--ui);
}
.copyref:hover{border-color:var(--stage-ink)}
.holder{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:0}
.holder.framed{padding:22px 22px 40px}
#frame{
  width:100%;height:100%;border:0;background:#fff;display:block;
}
.holder.framed #frame{
  height:calc(100% - 0px);border:1px solid var(--stage-line);border-radius:4px;
  box-shadow:0 10px 34px var(--page-shadow);
}
.note{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  background:var(--chrome);color:var(--chrome-ink);border:1px solid var(--chrome-line);
  padding:10px 14px;border-radius:5px;font-size:13px;box-shadow:0 8px 24px rgba(8,21,31,.35);
  opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:20;max-width:min(560px,90vw);
}
.note.on{opacity:1}
.note code{font-family:var(--mono);font-size:12px;color:var(--accent)}

@media (max-width:900px){
  :root{--bar:auto}
  .bar{flex-wrap:wrap;gap:10px;padding:10px 12px;height:auto}
  .bar-right{width:100%;margin-left:0}
  .widths{flex:1}
  .widths button{flex:1}
  .rail{display:none}
  .wrap{height:auto;flex:1}
  body{display:flex;flex-direction:column;overflow:hidden}
  .pagepick{
    display:block;flex:1;min-width:0;appearance:none;
    background:rgba(243,241,236,.07);color:var(--chrome-ink);border:1px solid var(--chrome-line);
    border-radius:5px;padding:8px 10px;font:500 12px/1.2 var(--ui);
  }
  .holder.framed{padding:12px 12px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar">
  <div class="mark" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 30 30" fill="none">
      <rect x="0.6" y="0.6" width="28.8" height="28.8" rx="3" fill="none" stroke="rgba(243,241,236,.3)"/>
      <path d="M7 21.5 L23 8.5" stroke="#6FC3A2" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M7 24.5 L23 11.5" stroke="#6FC3A2" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
      <circle cx="22.6" cy="8.2" r="2.6" fill="#A8863F"/>
    </svg>
    <span><b>EKORails</b> preview</span>
  </div>

  <div class="seg" role="group" aria-label="Choose site">
    <button type="button" data-site="eko" aria-pressed="true">EKORails.com</button>
    <button type="button" data-site="inf" aria-pressed="false">EkoInfrastructure.com</button>
  </div>

  <select class="pagepick" aria-label="Choose page"></select>

  <div class="bar-right">
    <div class="widths" role="group" aria-label="Viewport width">
      <button type="button" data-w="full" aria-pressed="true">FULL</button>
      <button type="button" data-w="1280" aria-pressed="false">1280</button>
      <button type="button" data-w="834" aria-pressed="false">834</button>
      <button type="button" data-w="390" aria-pressed="false">390</button>
    </div>
  </div>
</div>

<div class="wrap">
  <nav class="rail" aria-label="Pages">
    <h2 id="rail-title">EKORails.com</h2>
    <ol id="rail-list"></ol>
  </nav>

  <div class="stage">
    <div class="urlbar">
      <span class="lock" aria-hidden="true">&#128274;</span>
      <span class="u" id="url"></span>
      <span class="todo" id="todo" hidden></span>
      <span class="meta" id="meta"></span>
      <button class="copyref" type="button" id="copyref">Copy reference</button>
    </div>
    <div class="holder" id="holder">
      <iframe id="frame" title="Site preview"></iframe>
    </div>
  </div>
</div>

<div class="note" id="note" role="status" aria-live="polite"></div>

<script>
var PAGES = /*__PAGES__*/null;
var CSS   = /*__CSS__*/null;
var HOSTS = { "ekorails.com": "eko", "www.ekorails.com": "eko",
              "ekoinfrastructure.com": "inf", "www.ekoinfrastructure.com": "inf" };
var LABEL = { eko: "EKORails.com", inf: "EkoInfrastructure.com" };
var UTIL  = { "/thank-you": 1, "/search": 1 };

var state = { site: "eko", path: "/", width: "full" };
var frame = document.getElementById("frame");
var holder = document.getElementById("holder");
var note = document.getElementById("note"), noteTimer;

function flash(html) {
  note.innerHTML = html;
  note.classList.add("on");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(function () { note.classList.remove("on"); }, 3200);
}

function buildRail() {
  var site = PAGES[state.site];
  document.getElementById("rail-title").textContent = LABEL[state.site];
  var list = document.getElementById("rail-list");
  var pick = document.querySelector(".pagepick");
  list.innerHTML = ""; pick.innerHTML = "";
  var n = 0;
  site.order.forEach(function (p) {
    var doc = site.docs[p];
    var name = p === "/" ? "Home" : doc.t.split(" | ")[0];
    var util = UTIL[p] ? " util" : "";
    if (!UTIL[p]) n++;
    var li = document.createElement("li");
    li.innerHTML = '<a class="' + util.trim() + '" href="#" data-path="' + p + '"' +
      (p === state.path ? ' aria-current="true"' : "") + '><i>' +
      (UTIL[p] ? "\u2014" : (n < 10 ? "0" + n : n)) + "</i><span></span></a>";
    li.querySelector("span").textContent = name;
    list.appendChild(li);
    var o = document.createElement("option");
    o.value = p; o.textContent = name; o.selected = (p === state.path);
    pick.appendChild(o);
  });
}

function show(site, path, hash) {
  if (!PAGES[site] || !PAGES[site].docs[path]) {
    flash('That page is not in this build: <code>' + path + '</code>');
    return;
  }
  var changedSite = site !== state.site;
  state.site = site; state.path = path;
  document.querySelectorAll("[data-site]").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.site === site));
  });
  buildRail();

  var doc = PAGES[site].docs[path];
  var host = site === "eko" ? "ekorails.com" : "ekoinfrastructure.com";
  document.getElementById("url").innerHTML =
    "https://<b>" + host + "</b>" + (path === "/" ? "/" : path) + (hash ? hash : "");
  document.getElementById("meta").textContent = doc.t;
  var todo = document.getElementById("todo");
  todo.hidden = !doc.p;
  todo.textContent = doc.p
    ? doc.p + (doc.p === 1 ? " ITEM NEEDS YOUR INPUT" : " ITEMS NEED YOUR INPUT")
    : "";
  window.__ekoRef = "https://" + host + (path === "/" ? "/" : path) + " — " + doc.t;

  frame.srcdoc = doc.h.replace("__CSS__", "<style>" + CSS[site] + "</style>");
  frame.onload = function () {
    try {
      var d = frame.contentDocument;
      d.documentElement.scrollTop = 0;
      if (hash) {
        var el = d.getElementById(hash.slice(1));
        if (el) el.scrollIntoView();
      }
    } catch (e) { /* cross-origin srcdoc — nothing to do */ }
  };
  if (changedSite) flash("Now viewing <code>" + host + "</code>");
}

function setWidth(w) {
  state.width = w;
  document.querySelectorAll("[data-w]").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.w === w));
  });
  if (w === "full") {
    holder.classList.remove("framed");
    frame.style.width = "100%"; frame.style.maxWidth = "none"; frame.style.height = "100%";
  } else {
    holder.classList.add("framed");
    frame.style.width = w + "px"; frame.style.maxWidth = "100%"; frame.style.height = "100%";
  }
}

document.querySelector(".bar").addEventListener("click", function (e) {
  var s = e.target.closest("[data-site]");
  if (s) { show(s.dataset.site, "/"); return; }
  var w = e.target.closest("[data-w]");
  if (w) setWidth(w.dataset.w);
});
document.querySelector(".pagepick").addEventListener("change", function (e) {
  show(state.site, e.target.value);
});
document.getElementById("rail-list").addEventListener("click", function (e) {
  var a = e.target.closest("[data-path]");
  if (!a) return;
  e.preventDefault();
  show(state.site, a.dataset.path);
});

/* Links clicked inside the previewed page. */
window.addEventListener("message", function (e) {
  var m = e.data;
  if (!m || m.eko !== "nav") return;
  var href = m.href || "";
  if (/^mailto:/i.test(href)) {
    flash("Email link: <code>" + href.replace(/^mailto:/i, "") + "</code>");
    return;
  }
  if (/^https?:/i.test(href)) {
    var u = href.replace(/^https?:\/\//i, "");
    var host = u.split("/")[0];
    var rest = "/" + u.split("/").slice(1).join("/");
    var target = HOSTS[host];
    if (target) {
      var parts = rest.split("#");
      var p = parts[0].replace(/\/$/, "") || "/";
      show(target, p, parts[1] ? "#" + parts[1] : "");
    } else {
      flash("External link: <code>" + href + "</code>");
    }
    return;
  }
  var bits = href.split("#");
  var path = bits[0].split("?")[0].replace(/\/$/, "") || "/";
  show(state.site, path, bits[1] ? "#" + bits[1] : "");
});

document.getElementById("copyref").addEventListener("click", function () {
  var text = window.__ekoRef || "";
  var done = function () { flash("Copied: <code>" + text + "</code>"); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { flash("Copy this reference: <code>" + text + "</code>"); }
    document.body.removeChild(ta);
  }
});

setWidth("full");
show("eko", "/");
</script>
