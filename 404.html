<!DOCTYPE html>

<head>

<title>Page Not Found — GoBeyond Advisory</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FAFAF8;--ink:#1A1714;--gold:#9A7A32;--muted:#7A756D;--border:#D8D3CB;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:'Syne',sans-serif;-webkit-font-smoothing:antialiased;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;}
main{max-width:560px;text-align:center;}
.code{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.28em;
      text-transform:uppercase;color:var(--gold);}
.rule{width:52px;height:1px;background:var(--gold);margin:22px auto;}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.15;letter-spacing:-0.01em;}
p{margin-top:18px;color:var(--muted);font-size:15px;line-height:1.65;}
.links{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.links a{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.15em;
         text-transform:uppercase;text-decoration:none;padding:13px 22px;border:1px solid var(--border);
         color:var(--ink);transition:border-color .2s,color .2s;}
.links a:hover{border-color:var(--gold);color:var(--gold);}
.links a.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.links a.primary:hover{background:var(--gold);border-color:var(--gold);color:var(--bg);}
</style>
</head>
<body>
<main>
  <div class="code">Error 404</div>
  <div class="rule"></div>
  <h1>This page could not be found.</h1>
  <p>The link may be outdated, or the page may have moved. The sections below cover everything currently published.</p>
  <div class="links">
    <a class="primary" href="/">Return to GoBeyond Advisory</a>
    <a href="/briefs">Intelligence Briefs</a>
    <a href="mailto:info@gobeyondadvisory.com">Contact</a>
  </div>
</main>
</body>
</html>
