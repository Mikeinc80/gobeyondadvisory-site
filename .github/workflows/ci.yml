name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly external link sweep — off-site links rot without any commit here.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Site checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Structural checks: links, anchors, head metadata, Netlify form wiring,
      # article index integrity, sitemap coverage, committed secrets.
      - run: node scripts/check-site.mjs

      # The committed sitemap must match what the generator produces.
      - run: node scripts/build-sitemap.mjs --check

      # Mutation tests proving the checks above actually reject broken input.
      - run: node scripts/test-checks.mjs

  html:
    name: HTML validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes html-validate@8.24.2 '*.html'

  links:
    name: External links
    # Off-site links depend on third parties, so this runs on a schedule rather
    # than gating every push on someone else's uptime.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6 # v2.3.0
        with:
          args: --no-progress --max-retries 3 --exclude-path ./node_modules '*.html'
          fail: true
