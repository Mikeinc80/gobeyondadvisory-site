{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
    {{- if .Values.serviceAccount.workloadIdentityClientId }}
    # The mutating webhook only injects the projected token for pods whose
    # service account carries this label.
    azure.workload.identity/use: "true"
    {{- end }}
  annotations:
    {{- if .Values.serviceAccount.workloadIdentityClientId }}
    azure.workload.identity/client-id: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    {{- end }}
# The workload never calls the Kubernetes API, so no API token is mounted.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
