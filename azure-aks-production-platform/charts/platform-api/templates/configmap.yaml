apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-api.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
data:
  APP_ENVIRONMENT: {{ .Values.config.environment | quote }}
  APP_REGION: {{ .Values.config.region | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  DRAIN_SECONDS: {{ .Values.config.drainSeconds | quote }}
