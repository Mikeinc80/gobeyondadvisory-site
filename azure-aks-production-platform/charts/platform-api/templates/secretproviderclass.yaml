{{- if .Values.keyVault.enabled }}
# Secrets Store CSI driver + Azure Key Vault provider.
#
# The pod authenticates to Key Vault with its workload identity, so the only
# thing in this manifest is a *reference*: secret names, never secret values.
# Rotating a secret in the vault propagates without a redeploy (the AKS add-on
# is configured with a 5-minute rotation poll).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "platform-api.fullname" . }}-kv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
spec:
  provider: azure
  {{- if .Values.keyVault.syncAsKubernetesSecret }}
  # Projects the mounted files into a Kubernetes Secret so they can be consumed
  # as environment variables. The Secret is created only while a pod mounts the
  # volume, and is removed when the last one goes away.
  secretObjects:
    - secretName: {{ include "platform-api.fullname" . }}-secrets
      type: Opaque
      data:
        {{- range .Values.keyVault.secrets }}
        - objectName: {{ .name }}
          key: {{ .envVar }}
        {{- end }}
  {{- end }}
  parameters:
    usePodIdentity: "false"
    # Workload identity: the token is bound to this namespace's service account,
    # not to the node, so another namespace cannot borrow it.
    useVMManagedIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .name }}
          objectType: secret
        {{- end }}
{{- end }}
