# Scrape configuration for Azure Monitor managed Prometheus.
#
# The managed add-on does not watch ServiceMonitor/PodMonitor CRDs by default;
# it reads this ConfigMap in kube-system. Self-hosted Prometheus users should
# use the chart's ServiceMonitor instead (serviceMonitor.enabled=true).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system
data:
  prometheus-config: |-
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: platform-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [dev, staging, production]
        relabel_configs:
          # Scrape only pods belonging to this application, by its standard label.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: platform-api
          # Only the named container port, so a sidecar port is never scraped.
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: service
            replacement: platform-api
        metrics_path: /metrics
