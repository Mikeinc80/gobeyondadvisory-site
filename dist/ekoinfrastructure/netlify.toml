# Generated by build.py — deploy-ready copy of src/ekoinfrastructure/netlify.toml.
# The [build] block is omitted because this folder is itself the publish root.

# ==========================================================================
# EkoInfrastructure.com — Netlify site configuration
# Netlify UI: Base directory = "" (repo root), Build command = "python3 build.py",
# Publish directory = "dist/ekoinfrastructure".
# ==========================================================================

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
# Content-Security-Policy is emitted per page into dist/<site>/_headers by build.py,
# because each page carries inline JSON-LD that must be allowed by SHA-256 hash.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --------------------------------------------------------------- redirects
# eco-settlement.com is redirected to the settlement explainer, per the SEO plan.
[[redirects]]
  from = "https://eco-settlement.com/"
  to = "https://ekoinfrastructure.com/settlement-explained"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eco-settlement.com/"
  to = "https://ekoinfrastructure.com/settlement-explained"
  status = 301
  force = true

[[redirects]]
  from = "https://eco-settlement.com/*"
