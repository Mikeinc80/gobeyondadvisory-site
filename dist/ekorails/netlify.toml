# ==========================================================================
# EKORails.com — Netlify site configuration
# Netlify UI: Base directory = "" (repo root), Build command = "python3 build.py",
# Publish directory = "dist/ekorails".
# ==========================================================================

[build]
  command = "python3 build.py ekorails"
  publish = "dist/ekorails"

[build.environment]
  PYTHON_VERSION = "3.11"

# --------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
# Content-Security-Policy is emitted per page into dist/<site>/_headers by build.py,
# because each page carries inline JSON-LD that must be allowed by SHA-256 hash
# rather than by weakening the policy with 'unsafe-inline'.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------------- redirects
# Legacy domains (configure eco-rails.com and eco-rail.com as domain aliases,
# or point them at this site and let these rules canonicalise the path).
[[redirects]]
  from = "https://eco-rails.com/*"
  to = "https://ekorails.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eco-rails.com/*"
  to = "https://ekorails.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://eco-rail.com/*"
  to = "https://ekorails.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.eco-rail.com/*"
  to = "https://ekorails.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ekorails.com/*"
  to = "https://ekorails.com/:splat"
  status = 301
  force = true

