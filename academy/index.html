<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="description" content="A 24-week accelerated training programme taking you from zero technical experience to an employable entry-level Cloud, DevOps and AI Infrastructure Engineer."/>
<meta name="theme-color" content="#1A1714"/>
<meta name="color-scheme" content="light dark"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Cloud Program"/>
<title>AI Cloud Infrastructure Program</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="iconbtn menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="#/">CLOUD<span>·</span>PROGRAM</a>
  <div class="topbar-right">
    <span class="netstate" id="netState" data-state="online" title="Network status">ONLINE</span>
    <button class="iconbtn" id="themeToggle" type="button" aria-label="Switch colour theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6 4.5 4.5M19.5 19.5 18 18M6 18l-1.5 1.5M19.5 4.5 18 6"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Programme sections">
    <div class="progress-card">
      <div class="progress-ring" id="progressRing" role="img" aria-label="Overall programme progress">
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-meta">
        <strong id="progressWeek">Week 1 of 24</strong>
        <span id="progressPhase">Phase 1 — Foundations</span>
      </div>
    </div>
    <ul class="navlist" id="navList"></ul>
    <div class="sidebar-foot">
      <button class="ghost" id="installBtn" type="button" hidden>Install app</button>
      <p class="tiny">Progress is stored in this browser only. Export a backup from <a href="#/settings">Settings</a>.</p>
    </div>
  </nav>

  <main id="main" tabindex="-1">
    <div id="view" class="view"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>

<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
