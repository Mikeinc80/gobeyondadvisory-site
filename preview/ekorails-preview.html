\n  /* Accents */\n  --emerald:     #0E6B4E;   /* 6.05:1 on ivory \u2014 body-text safe */\n  --emerald-600: #12855F;\n  --emerald-300: #6FC3A2;   /* 8.9:1 on navy-900 \u2014 dark-surface text safe */\n  --emerald-100: #D7EBE1;\n  --gold:        #A8863F;   /* decorative / large display only (3.18:1) */\n  --gold-ink:    #7A5F22;   /* 5.6:1 on ivory \u2014 safe for small text */\n  --gold-200:    #E4D6B4;\n\n  /* Text */\n  --text:       #14191E;\n  --text-2:     #3B474F;\n  --muted:      #5C6B75;    /* 5.1:1 on ivory */\n  --on-dark:    #F3F1EC;\n  --on-dark-2:  #C2CDD5;    /* 9.6:1 on navy-900 */\n\n  /* Lines & shadow */\n  --line:      #D9D3C7;\n  --line-2:    #C6BEAE;\n  --line-dark: rgba(243, 241, 236, 0.16);\n  --shadow-sm: 0 1px 2px rgba(8, 21, 31, .06), 0 2px 8px rgba(8, 21, 31, .04);\n  --shadow-md: 0 2px 4px rgba(8, 21, 31, .05), 0 12px 32px rgba(8, 21, 31, .08);\n\n  /* Status palette (regulatory tracker, capability state) */\n  --state-done:    #0E6B4E;\n  --state-active:  #7A5F22;\n  --state-planned: #5C6B75;\n\n  /* Type */\n  --font-display: \"Source Serif 4\", \"Iowan Old Style\", Georgia, \"Times New Roman\", serif;\n  --font-ui: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  --step--1: clamp(.8125rem, .79rem + .11vw, .875rem);\n  --step-0:  clamp(1rem, .97rem + .16vw, 1.0625rem);\n  --step-1:  clamp(1.1875rem, 1.13rem + .28vw, 1.375rem);\n  --step-2:  clamp(1.4375rem, 1.33rem + .52vw, 1.75rem);\n  --step-3:  clamp(1.75rem, 1.56rem + .93vw, 2.375rem);\n  --step-4:  clamp(2.125rem, 1.79rem + 1.65vw, 3.25rem);\n  --step-5:  clamp(2.5rem, 1.93rem + 2.85vw, 4.25rem);\n\n  /* Space & layout */\n  --shell: 1200px;\n  --shell-narrow: 760px;\n  --gutter: clamp(1.25rem, 1rem + 2vw, 3rem);\n  --s-1: .5rem; --s-2: .75rem; --s-3: 1rem; --s-4: 1.5rem;\n  --s-5: 2rem; --s-6: 3rem; --s-7: 4rem; --s-8: 6rem;\n  --section-y: clamp(3.5rem, 2.5rem + 4vw, 6.5rem);\n  --radius: 3px;\n  --radius-lg: 6px;\n  --header-h: 72px;\n}\n\n/* ---------------------------------------------------------------- 2. Reset */\n*, *::before, *::after { box-sizing: border-box; }\n* { margin: 0; }\nhtml { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 1rem); }\n@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }\nbody {\n  background: var(--ivory);\n  color: var(--text);\n  font-family: var(--font-ui);\n  font-size: var(--step-0);\n  line-height: 1.65;\n  font-synthesis-weight: none;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\nimg, svg, video { display: block; max-width: 100%; height: auto; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nh1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.14; letter-spacing: -.011em; text-wrap: balance; }\np, li { text-wrap: pretty; }\na { color: var(--emerald); text-underline-offset: .18em; text-decoration-thickness: from-font; }\na:hover { color: var(--emerald-600); }\n:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {\n  outline: 3px solid var(--emerald-600); outline-offset: 2px; border-radius: 2px;\n}\n::selection { background: var(--emerald-100); color: var(--navy-900); }\n:target { scroll-margin-top: calc(var(--header-h) + 2rem); }\n\n/* ---------------------------------------------------------------- 3. Utility */\n.shell { width: 100%; max-width: var(--shell); margin-inline: auto; padding-inline: var(--gutter); }\n.shell-narrow { max-width: var(--shell-narrow); }\n.sr-only {\n  position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;\n  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;\n}\n.skip-link {\n  position: absolute; left: var(--gutter); top: -100px; z-index: 300;\n  background: var(--navy-900); color: var(--on-dark); padding: .75rem 1.25rem;\n  font: 600 var(--step--1)/1 var(--font-ui); text-decoration: none; border-radius: var(--radius);\n  transition: top .15s ease;\n}\n.skip-link:focus { top: .75rem; color: var(--on-dark); }\nmain:focus { outline: none; }\n.stack > * + * { margin-top: var(--s-3); }\n.text-center { text-align: center; }\n.lede { font-size: var(--step-1); line-height: 1.55; color: var(--text-2); max-width: 62ch; }\n.small { font-size: var(--step--1); }\n.muted { color: var(--muted); }\n.nowrap { white-space: nowrap; }\n.mono { font-family: var(--font-mono); }\n\n/* ---------------------------------------------------------------- 4. Header */\n.site-header {\n  position: sticky; top: 0; z-index: 200;\n  background: rgba(248, 246, 241, .93);\n  backdrop-filter: saturate(140%) blur(12px);\n  border-bottom: 1px solid var(--line);\n}\n.header-inner { display: flex; align-items: center; gap: var(--s-4); min-height: var(--header-h); }\n.wordmark { display: flex; align-items: center; flex: 0 0 auto; text-decoration: none; }\n.wordmark svg { height: 30px; width: auto; }\n.primary-nav { margin-left: auto; display: none; }\n.primary-nav ul { display: flex; gap: clamp(.75rem, .2rem + 1vw, 1.5rem); list-style: none; padding: 0; }\n.primary-nav a {\n  font-size: .8125rem; font-weight: 500; letter-spacing: .005em;\n  color: var(--text-2); text-decoration: none; padding: .35rem 0;\n  border-bottom: 2px solid transparent;\n}\n.primary-nav a:hover { color: var(--navy-900); border-bottom-color: var(--line-2); }\n.primary-nav a.is-active { color: var(--navy-900); font-weight: 600; border-bottom-color: var(--emerald); }\n.header-actions { margin-left: auto; display: flex; align-items: center; gap: var(--s-2); }\n.nav-toggle {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 44px; height: 44px; background: none; border: 1px solid var(--line-2);\n  border-radius: var(--radius); cursor: pointer;\n}\n.nav-toggle-bars, .nav-toggle-bars::before, .nav-toggle-bars::after {\n  display: block; width: 18px; height: 1.5px; background: var(--navy-900); content: \"\";\n  transition: transform .18s ease, opacity .18s ease;\n}\n.nav-toggle-bars::before { transform: translateY(-6px); }\n.nav-toggle-bars::after { transform: translateY(4.5px); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars { background: transparent; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars::before { transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars::after { transform: translateY(-1.5px) rotate(-45deg); }\n.mobile-nav { border-top: 1px solid var(--line); background: var(--ivory); padding: var(--s-3) var(--gutter) var(--s-5); }\n.mobile-nav[hidden] { display: none; }\n.mobile-nav ul { list-style: none; padding: 0; margin: 0 0 var(--s-4); }\n.mobile-nav li + li { border-top: 1px solid var(--line); }\n.mobile-nav a { display: block; padding: .85rem 0; font-weight: 500; color: var(--navy-900); text-decoration: none; }\n.mobile-nav-note { margin-top: var(--s-3); font-size: var(--step--1); color: var(--muted); }\n@media (min-width: 1000px) {\n  .primary-nav { display: block; }\n  .nav-toggle, .mobile-nav { display: none !important; }\n  .header-actions { margin-left: var(--s-4); }\n}\n\n/* ---------------------------------------------------------------- 5. Buttons */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;\n  padding: .8rem 1.4rem; min-height: 44px;\n  font: 600 .875rem/1.2 var(--font-ui); letter-spacing: .005em;\n  text-decoration: none; border: 1px solid transparent; border-radius: var(--radius);\n  cursor: pointer; transition: background-color .15s ease, color .15s ease, border-color .15s ease;\n}\n.btn-solid { background: var(--navy-900); color: var(--ivory); }\n.btn-solid:hover { background: var(--navy-700); color: var(--white); }\n.btn-emerald { background: var(--emerald); color: var(--white); }\n.btn-emerald:hover { background: var(--emerald-600); color: var(--white); }\n.btn-ghost { border-color: var(--line-2); color: var(--navy-900); background: transparent; }\n.btn-ghost:hover { border-color: var(--navy-900); background: var(--white); color: var(--navy-900); }\n.btn-on-dark { border-color: rgba(243,241,236,.4); color: var(--on-dark); background: transparent; }\n.btn-on-dark:hover { background: rgba(243,241,236,.1); color: var(--white); border-color: var(--on-dark); }\n.btn-sm { padding: .55rem 1rem; min-height: 40px; font-size: .8125rem; }\n.btn-block { width: 100%; }\n.link-arrow {\n  display: inline-flex; align-items: center; gap: .4rem; font-weight: 600;\n  font-size: var(--step--1); text-decoration: none; color: var(--emerald);\n}\n.link-arrow::after { content: \"\u2192\"; transition: transform .15s ease; }\n.link-arrow:hover::after { transform: translateX(3px); }\n.btn-row { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-3); align-items: center; }\n\n/* ---------------------------------------------------------------- 6. Sections */\n.section { padding-block: var(--section-y); }\n.section--tight { padding-block: clamp(2.5rem, 2rem + 2vw, 4rem); }\n.section--ivory2 { background: var(--ivory-2); }\n.section--white { background: var(--white); }\n.section--dark { background: var(--navy-900); color: var(--on-dark); }\n.section--dark h1, .section--dark h2, .section--dark h3, .section--dark h4 { color: var(--white); }\n.section--dark .lede, .section--dark p { color: var(--on-dark-2); }\n.section--dark a:not(.btn) { color: var(--emerald-300); }\n.section--dark .eyebrow { color: var(--emerald-300); }\n.section--dark .eyebrow::before { background: var(--emerald-300); }\n.section--rule { border-top: 1px solid var(--line); }\n.eyebrow {\n  display: inline-flex; align-items: center; gap: .6rem;\n  font: 600 .6875rem/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase;\n  color: var(--emerald); margin-bottom: var(--s-3);\n}\n.eyebrow::before { content: \"\"; width: 24px; height: 1px; background: var(--emerald); }\n.section-head { max-width: 68ch; margin-bottom: var(--s-6); }\n.section-head h2 { font-size: var(--step-3); margin-bottom: var(--s-3); }\n.section-head p { color: var(--text-2); font-size: var(--step-1); line-height: 1.55; }\n.section--dark .section-head p { color: var(--on-dark-2); }\n\n/* ---------------------------------------------------------------- 7. Hero */\n.hero {\n  position: relative; overflow: hidden;\n  background: var(--navy-900); color: var(--on-dark);\n  padding-block: clamp(3.5rem, 2rem + 8vw, 7rem);\n  border-bottom: 1px solid var(--navy-700);\n}\n.hero::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background:\n    radial-gradient(120% 90% at 88% 10%, rgba(18,133,95,.18), transparent 60%),\n    linear-gradient(180deg, rgba(8,21,31,0) 40%, rgba(8,21,31,.55) 100%);\n}\n.hero .shell { position: relative; z-index: 2; }\n.hero-grid { display: grid; gap: var(--s-6); align-items: center; }\n.hero h1 { font-size: var(--step-5); color: var(--white); letter-spacing: -.02em; max-width: 16ch; }\n.hero-lede { font-size: var(--step-1); color: var(--on-dark-2); max-width: 56ch; margin-top: var(--s-4); }\n.hero-status {\n  display: flex; gap: .65rem; align-items: flex-start;\n  margin-top: var(--s-5); padding: .85rem 1.1rem;\n  border: 1px solid var(--line-dark); border-left: 3px solid var(--gold-200);\n  background: rgba(243,241,236,.05); border-radius: var(--radius);\n  font-size: var(--step--1); color: var(--on-dark-2); max-width: 56ch;\n}\n.hero-actions { margin-top: var(--s-5); }\n.hero-note { margin-top: var(--s-4); font-size: var(--step--1); }\n@media (min-width: 900px) { .hero-grid { grid-template-columns: 1.05fr .95fr; gap: var(--s-7); } }\n\n/* ---------------------------------------------------------------- 8. Corridor figure */\n.corridor-fig {\n  border: 1px solid var(--line-dark); border-radius: var(--radius-lg);\n  background: linear-gradient(180deg, rgba(243,241,236,.06), rgba(243,241,236,.02));\n  padding: var(--s-4);\n}\n.corridor-fig figcaption {\n  margin-top: var(--s-3); padding-top: var(--s-3); border-top: 1px solid var(--line-dark);\n  font-size: .8125rem; color: var(--on-dark-2);\n}\n.route-line { stroke-dasharray: 5 5; }\n@media (prefers-reduced-motion: no-preference) {\n  .route-line { animation: dash 5s linear infinite; }\n  @keyframes dash { to { stroke-dashoffset: -100; } }\n}\n.node-pulse { transform-box: fill-box; transform-origin: center; }\n@media (prefers-reduced-motion: no-preference) {\n  .node-pulse { animation: pulse 3.4s ease-in-out infinite; }\n  @keyframes pulse { 0%,100% { opacity:.25; r:11 } 50% { opacity:.5; r:15 } }\n}\n\n/* ---------------------------------------------------------------- 9. Cards & grids */\n.grid { display: grid; gap: var(--s-4); }\n.grid-2 { grid-template-columns: 1fr; }\n.grid-3 { grid-template-columns: 1fr; }\n.grid-4 { grid-template-columns: 1fr; }\n@media (min-width: 640px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 980px) {\n  .grid-3 { grid-template-columns: repeat(3, 1fr); }\n  .grid-4 { grid-template-columns: repeat(4, 1fr); }\n}\n.card {\n  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);\n  padding: var(--s-4); display: flex; flex-direction: column; gap: .6rem;\n  box-shadow: var(--shadow-sm);\n}\n.card :is(h2, h3) { font-size: var(--step-1); }\n.card p { font-size: var(--step--1); color: var(--text-2); }\n.card--flat { box-shadow: none; background: transparent; }\n.card--dark { background: rgba(243,241,236,.04); border-color: var(--line-dark); box-shadow: none; }\n.card-icon { color: var(--emerald); }\n.card-index {\n  font: 500 .6875rem/1 var(--font-mono); letter-spacing: .12em;\n  color: var(--muted); text-transform: uppercase;\n}\n.card-list { list-style: none; padding: 0; margin-top: .35rem; display: grid; gap: .35rem; }\n.card-list li { position: relative; padding-left: 1.1rem; font-size: var(--step--1); color: var(--text-2); }\n.card-list li::before {\n  content: \"\"; position: absolute; left: 0; top: .62em; width: 6px; height: 1.5px; background: var(--emerald);\n}\n\n/* ---------------------------------------------------------------- 10. Status chips */\n.chip {\n  display: inline-flex; align-items: center; gap: .4rem; align-self: flex-start;\n  font: 600 .6875rem/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase;\n  padding: .3rem .55rem; border-radius: 2px; border: 1px solid;\n}\n.chip::before { content: \"\"; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }\n.chip-live      { color: var(--state-done);    border-color: rgba(14,107,78,.35);  background: rgba(14,107,78,.07); }\n.chip-progress  { color: var(--state-active);  border-color: rgba(122,95,34,.35);  background: rgba(122,95,34,.07); }\n.chip-planned   { color: var(--state-planned); border-color: rgba(92,107,117,.35); background: rgba(92,107,117,.07); }\n.chip-dark      { color: var(--emerald-300);   border-color: rgba(111,195,162,.4); background: rgba(111,195,162,.08); }\n\n/* ---------------------------------------------------------------- 11. Steps / flow */\n.flow { counter-reset: step; display: grid; gap: 0; }\n.flow-step {\n  display: grid; grid-template-columns: auto 1fr; gap: var(--s-3) var(--s-4);\n  padding: var(--s-4) 0; border-top: 1px solid var(--line); position: relative;\n}\n.flow-step:last-child { border-bottom: 1px solid var(--line); }\n.flow-num {\n  counter-increment: step; width: 40px; height: 40px; border-radius: 50%;\n  border: 1px solid var(--emerald); color: var(--emerald);\n  display: grid; place-items: center; font: 600 .8125rem/1 var(--font-mono);\n}\n.flow-num::before { content: counter(step, decimal-leading-zero); }\n.flow-body h3 { font-size: var(--step-1); margin-bottom: .3rem; }\n.flow-body p { color: var(--text-2); font-size: var(--step--1); }\n.flow-meta {\n  display: flex; flex-wrap: wrap; gap: .4rem .75rem; margin-top: .6rem;\n  font: 500 .6875rem/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;\n}\n.flow-owner { color: var(--emerald); }\n.flow-dep { color: var(--gold-ink); }\n\n/* ---------------------------------------------------------------- 12. Tracker */\n.tracker { display: grid; gap: 0; margin-top: var(--s-5); }\n.tracker-row {\n  display: grid; grid-template-columns: 1fr; gap: .5rem;\n  padding: var(--s-4) 0; border-top: 1px solid var(--line-dark);\n}\n.tracker-row:last-child { border-bottom: 1px solid var(--line-dark); }\n.tracker-stage { font-family: var(--font-display); font-size: var(--step-1); color: var(--white); }\n.tracker-note { font-size: var(--step--1); color: var(--on-dark-2); max-width: 60ch; }\n@media (min-width: 780px) {\n  .tracker-row { grid-template-columns: 200px 1fr 150px; align-items: baseline; gap: var(--s-4); }\n  .tracker-row .chip { justify-self: end; }\n}\n\n/* ---------------------------------------------------------------- 13. Tables */\n.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }\ntable { border-collapse: collapse; width: 100%; min-width: 560px; font-size: var(--step--1); }\ncaption { text-align: left; padding: var(--s-3) var(--s-4); color: var(--muted); font-size: var(--step--1); border-bottom: 1px solid var(--line); }\nth, td { text-align: left; padding: .8rem 1rem; border-bottom: 1px solid var(--line); vertical-align: top; }\nthead th {\n  font: 600 .6875rem/1.3 var(--font-mono); letter-spacing: .1em; text-transform: uppercase;\n  color: var(--muted); background: var(--ivory-2);\n}\ntbody tr:last-child td { border-bottom: none; }\n\n/* ---------------------------------------------------------------- 14. Callouts */\n.callout {\n  border: 1px solid var(--line); border-left: 3px solid var(--emerald);\n  background: var(--white); padding: var(--s-4); border-radius: var(--radius);\n}\n.callout :is(h2, h3) { font-size: var(--step-1); margin-bottom: .4rem; }\n.callout p { font-size: var(--step--1); color: var(--text-2); }\n.callout--gold { border-left-color: var(--gold); }\n.callout--dark { background: rgba(243,241,236,.05); border-color: var(--line-dark); border-left-color: var(--gold-200); }\n.placeholder {\n  font-family: var(--font-mono); font-size: .8125rem; font-weight: 500;\n  background: rgba(122,95,34,.1); color: var(--gold-ink);\n  border: 1px dashed rgba(122,95,34,.45); border-radius: 2px; padding: .05em .4em;\n  overflow-wrap: anywhere;\n}\n.section--dark .placeholder { background: rgba(228,214,180,.12); color: var(--gold-200); border-color: rgba(228,214,180,.45); }\n\n/* ---------------------------------------------------------------- 15. Definition rows */\n.deflist { display: grid; gap: 0; margin: 0; }\n.deflist > div { padding: var(--s-4) 0; border-top: 1px solid var(--line); display: grid; gap: .4rem; }\n.deflist > div:last-child { border-bottom: 1px solid var(--line); }\n.deflist dt { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; }\n.deflist dd { margin: 0; color: var(--text-2); font-size: var(--step--1); }\n@media (min-width: 780px) { .deflist > div { grid-template-columns: 260px 1fr; gap: var(--s-4); } }\n\n/* ---------------------------------------------------------------- 16. People */\n.person { display: grid; gap: var(--s-3); }\n.person-photo {\n  width: 100%; aspect-ratio: 4 / 5; object-fit: cover;\n  background: var(--ivory-3); border: 1px solid var(--line); border-radius: var(--radius);\n}\n.person :is(h2, h3) { font-size: var(--step-1); }\n.person-role { font: 600 .6875rem/1.4 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--emerald); }\n.person p { font-size: var(--step--1); color: var(--text-2); }\n\n/* ---------------------------------------------------------------- 17. Forms */\n.form { display: grid; gap: var(--s-4); }\n.form-grid { display: grid; gap: var(--s-4); }\n@media (min-width: 720px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .span-2 { grid-column: 1 / -1; } }\n.field { display: grid; gap: .4rem; }\n.field label { font-weight: 600; font-size: var(--step--1); }\n.field .hint { font-size: .8125rem; color: var(--muted); }\n.field input, .field select, .field textarea {\n  width: 100%; padding: .75rem .9rem; min-height: 46px;\n  background: var(--white); border: 1px solid var(--line-2); border-radius: var(--radius);\n  color: var(--text);\n}\n.field textarea { min-height: 150px; resize: vertical; }\n.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--muted); }\n.field :is(input, select, textarea):focus-visible { border-color: var(--emerald); }\n.field :is(input, textarea):user-invalid { border-color: #A3341F; }\n.field :is(input, textarea):user-invalid + .error { display: block; }\n.error { display: none; color: #8A2B19; font-size: .8125rem; font-weight: 500; }\n.req { color: #8A2B19; }\n.checkbox { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; }\n.checkbox input { width: 20px; height: 20px; min-height: 0; margin-top: .2rem; accent-color: var(--emerald); }\n.checkbox label { font-weight: 400; font-size: var(--step--1); color: var(--text-2); }\n.hp { position: absolute !important; left: -9999px; opacity: 0; height: 0; overflow: hidden; }\nfieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s-4); }\nlegend { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; padding-inline: .5rem; }\n\n/* ---------------------------------------------------------------- 18. Tabs */\n.tablist { display: flex; flex-wrap: wrap; gap: .35rem; border-bottom: 1px solid var(--line); margin-bottom: var(--s-5); }\n.tablist button {\n  background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer;\n  padding: .7rem .9rem; font-weight: 600; font-size: var(--step--1); color: var(--muted);\n}\n.tablist button[aria-selected=\"true\"] { color: var(--navy-900); border-bottom-color: var(--emerald); }\n.tabpanel[hidden] { display: none; }\n\n/* ---------------------------------------------------------------- 19. Accordion */\ndetails.acc { border-top: 1px solid var(--line); }\ndetails.acc:last-of-type { border-bottom: 1px solid var(--line); }\ndetails.acc > summary {\n  list-style: none; cursor: pointer; padding: var(--s-4) 2.5rem var(--s-4) 0; position: relative;\n  font-family: var(--font-display); font-size: var(--step-1); font-weight: 600;\n}\ndetails.acc > summary::-webkit-details-marker { display: none; }\ndetails.acc > summary::after {\n  content: \"+\"; position: absolute; right: .5rem; top: 50%; transform: translateY(-50%);\n  font-family: var(--font-mono); font-size: 1.25rem; color: var(--emerald); line-height: 1;\n}\ndetails.acc[open] > summary::after { content: \"\u2013\"; }\ndetails.acc > div { padding-bottom: var(--s-4); color: var(--text-2); font-size: var(--step--1); max-width: 74ch; }\ndetails.acc > div > * + * { margin-top: var(--s-2); }\n\n/* ---------------------------------------------------------------- 20. Prose */\n.prose { max-width: 68ch; }\n.prose > * + * { margin-top: var(--s-3); }\n.prose h2 { font-size: var(--step-2); margin-top: var(--s-6); }\n.prose h3 { font-size: var(--step-1); margin-top: var(--s-5); }\n.prose ul, .prose ol { padding-left: 1.3rem; display: grid; gap: .45rem; }\n.prose li { color: var(--text-2); }\n.prose blockquote {\n  border-left: 3px solid var(--gold); padding-left: var(--s-4); margin-left: 0;\n  font-family: var(--font-display); font-size: var(--step-1); color: var(--text);\n}\n.prose hr { border: 0; border-top: 1px solid var(--line); margin-block: var(--s-6); }\n.footnotes { font-size: .8125rem; color: var(--muted); }\n.footnotes ol { padding-left: 1.2rem; }\n\n/* ---------------------------------------------------------------- 21. CTA band */\n.cta-band { background: var(--navy-900); color: var(--on-dark); padding-block: var(--section-y); text-align: center; }\n.cta-band h2 { font-size: var(--step-4); color: var(--white); max-width: 20ch; margin-inline: auto; }\n.cta-band p { color: var(--on-dark-2); max-width: 60ch; margin: var(--s-3) auto 0; }\n.cta-band .btn-row { justify-content: center; margin-top: var(--s-5); }\n\n/* ---------------------------------------------------------------- 22. Footer */\n.site-footer { background: var(--navy-900); color: var(--on-dark-2); padding-block: var(--s-7) var(--s-5); font-size: var(--step--1); }\n.site-footer a { color: var(--on-dark-2); text-decoration: none; }\n.site-footer a:hover { color: var(--emerald-300); text-decoration: underline; }\n.footer-top { display: grid; gap: var(--s-6); padding-bottom: var(--s-6); border-bottom: 1px solid var(--line-dark); }\n.footer-brand svg { height: 30px; width: auto; margin-bottom: var(--s-3); }\n.footer-tag { font-family: var(--font-display); font-size: var(--step-1); color: var(--white); max-width: 24ch; }\n.footer-sub { margin-top: .5rem; max-width: 42ch; }\n.footer-cols { display: grid; gap: var(--s-5); grid-template-columns: repeat(2, 1fr); }\n.footer-h { font: 600 .6875rem/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--white); margin-bottom: var(--s-3); }\n.footer-col ul { list-style: none; padding: 0; display: grid; gap: .5rem; }\n.footer-status { padding-block: var(--s-5); border-bottom: 1px solid var(--line-dark); }\n.footer-status p { max-width: 100ch; }\n.footer-status strong { color: var(--white); }\n.footer-legal { padding-top: var(--s-5); display: grid; gap: var(--s-3); }\n.disclaimer { max-width: 110ch; color: var(--on-dark-2); }\n.colophon { color: #93A3AD; font-size: .8125rem; }\n@media (min-width: 900px) {\n  .footer-top { grid-template-columns: 1fr 1.6fr; }\n  .footer-cols { grid-template-columns: repeat(4, 1fr); }\n}\n\n/* ---------------------------------------------------------------- 23. Misc */\n.badge-row { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-4); }\n.stat { display: grid; gap: .25rem; }\n.stat-value { font-family: var(--font-display); font-size: var(--step-3); color: var(--navy-900); line-height: 1; }\n.section--dark .stat-value { color: var(--white); }\n.stat-label { font: 500 .6875rem/1.4 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }\n.section--dark .stat-label { color: var(--on-dark-2); }\n.rule { border: 0; border-top: 1px solid var(--line); margin-block: var(--s-6); }\n.toc { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s-4); background: var(--white); }\n.toc h2 { font: 600 .6875rem/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: var(--s-3); }\n.toc ol { list-style: none; padding: 0; counter-reset: toc; display: grid; gap: .5rem; }\n.toc li { counter-increment: toc; display: grid; grid-template-columns: 2rem 1fr; font-size: var(--step--1); }\n.toc li::before { content: counter(toc, decimal-leading-zero); font-family: var(--font-mono); color: var(--muted); }\n.split { display: grid; gap: var(--s-6); }\n@media (min-width: 900px) { .split { grid-template-columns: 1fr 1fr; align-items: start; } .split--sidebar { grid-template-columns: 1fr 340px; gap: var(--s-7); } }\n.sticky-side { position: sticky; top: calc(var(--header-h) + var(--s-4)); }\n@media print {\n  .site-header, .cta-band, .nav-toggle, .mobile-nav { display: none !important; }\n  body { background: #fff; }\n  .section--dark, .hero, .site-footer { background: #fff !important; color: #000 !important; }\n}\n\n/* ---------------------------------------------------------------- 24. Consent */\n.consent {\n  position: fixed; inset-inline: 0; bottom: 0; z-index: 250;\n  background: var(--navy-800); color: var(--on-dark-2);\n  border-top: 1px solid var(--line-dark); padding-block: var(--s-4);\n  font-size: var(--step--1); box-shadow: 0 -8px 32px rgba(8,21,31,.2);\n}\n.consent[hidden] { display: none; }\n.consent a { color: var(--emerald-300); }\n.consent-inner { display: grid; gap: var(--s-3); align-items: center; }\n.consent p { max-width: 78ch; margin: 0; }\n.consent-actions { display: flex; flex-wrap: wrap; gap: var(--s-2); }\n.consent .btn-ghost { border-color: rgba(243,241,236,.4); color: var(--on-dark); }\n.consent .btn-ghost:hover { background: rgba(243,241,236,.1); color: var(--white); }\n.consent .btn-solid { background: var(--ivory); color: var(--navy-900); }\n.consent .btn-solid:hover { background: var(--white); color: var(--navy-900); }\n@media (min-width: 860px) { .consent-inner { grid-template-columns: 1fr auto; gap: var(--s-5); } }\n\n/* ---------------------------------------------------------------- 25. Small-screen chrome */\n@media (max-width: 420px) {\n  .wordmark svg { height: 24px; }\n  .header-inner { gap: var(--s-2); }\n  .header-actions .btn-sm { padding: .5rem .7rem; font-size: .75rem; }\n}\n\n/* Grid children must be allowed to shrink below their intrinsic content width,\n   otherwise wide SVG figures force horizontal overflow on small screens. */\n.hero-grid > *, .grid > *, .split > *, .form-grid > *, .bridge > *, .footer-top > * { min-width: 0; }\n.corridor-fig svg, .boundary svg { max-width: 100%; height: auto; }\n\n/* ==========================================================================\n   EkoInfrastructure.com \u2014 research & knowledge platform skin\n   Same token system as EKORails (one family), different emphasis:\n   ivory-dominant, editorial serif reading column, navy rules, gold reserved\n   for source/citation furniture. Deliberately quieter than the corporate site.\n   ========================================================================== */\n\n:root {\n  --shell: 1160px;\n  --shell-narrow: 720px;\n  --header-h: 68px;\n}\n\n/* Editorial masthead treatment */\n.site-header { background: rgba(255, 255, 255, .95); border-bottom: 1px solid var(--navy-900); }\n.primary-nav a { font-size: .8125rem; }\n.primary-nav a.is-active { border-bottom-color: var(--navy-700); }\nbody { background: var(--white); }\n.section--ivory2 { background: var(--ivory); }\n\n/* Research hero \u2014 light, typographic, no dark slab */\n.hero--research {\n  background: var(--ivory); color: var(--text);\n  border-bottom: 1px solid var(--line); padding-block: clamp(3rem, 2rem + 5vw, 5.5rem);\n}\n.hero--research::after { display: none; }\n.hero--research h1 { color: var(--navy-900); font-size: var(--step-4); max-width: 20ch; }\n.hero--research .hero-lede { color: var(--text-2); }\n.hero--research .eyebrow { color: var(--navy-700); }\n.hero--research .eyebrow::before { background: var(--navy-700); }\n\n/* Article cards */\n.article-card {\n  display: grid; gap: .55rem; padding: var(--s-5) 0; border-top: 1px solid var(--line);\n}\n.article-card:last-of-type { border-bottom: 1px solid var(--line); }\n.article-card h3 { font-size: var(--step-2); }\n.article-card h3 a { color: var(--navy-900); text-decoration: none; }\n.article-card h3 a:hover { color: var(--emerald); text-decoration: underline; }\n.article-meta {\n  display: flex; flex-wrap: wrap; gap: .35rem .9rem;\n  font: 500 .6875rem/1.5 var(--font-mono); letter-spacing: .09em;\n  text-transform: uppercase; color: var(--muted);\n}\n.article-meta .topic { color: var(--emerald); }\n.article-card p { color: var(--text-2); font-size: var(--step--1); max-width: 72ch; }\n@media (min-width: 900px) { .article-card { grid-template-columns: 190px 1fr; gap: var(--s-5); } .article-card .article-meta { flex-direction: column; gap: .3rem; } }\n\n/* Long-form reading column */\n.article-body { font-family: var(--font-display); font-size: clamp(1.0625rem, 1rem + .3vw, 1.1875rem); line-height: 1.72; }\n.article-body p { color: var(--text); }\n.article-body h2 { font-size: var(--step-2); margin-top: var(--s-6); }\n.article-body h3 { font-size: var(--step-1); margin-top: var(--s-5); }\n.article-body ul, .article-body ol { padding-left: 1.4rem; display: grid; gap: .5rem; }\n.article-body li { color: var(--text); }\n.article-body .callout, .article-body .table-wrap { font-family: var(--font-ui); font-size: var(--step--1); }\n.article-header { border-bottom: 1px solid var(--navy-900); padding-bottom: var(--s-5); margin-bottom: var(--s-5); }\n.article-header h1 { font-size: var(--step-4); max-width: 22ch; color: var(--navy-900); }\n.article-header .lede { margin-top: var(--s-3); }\n.byline {\n  display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin-top: var(--s-4);\n  font: 500 .6875rem/1.5 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted);\n}\n.byline strong { color: var(--text-2); font-weight: 600; }\n\n/* Sources & footnotes furniture */\n.sources { border-top: 2px solid var(--gold); padding-top: var(--s-4); margin-top: var(--s-6); }\n.sources h2 { font: 600 .6875rem/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: var(--s-3); }\n.sources ol { padding-left: 1.3rem; display: grid; gap: .6rem; font-family: var(--font-ui); font-size: .8125rem; color: var(--text-2); }\n.sources a { word-break: break-word; }\n.source-date { color: var(--muted); }\nsup.fn a { font-family: var(--font-ui); font-size: .7em; font-weight: 600; text-decoration: none; padding-inline: .1em; }\n\n/* Search */\n.search-form { display: grid; gap: var(--s-3); grid-template-columns: 1fr auto; align-items: end; }\n.search-form .field { grid-column: 1; }\n#search-status { font-size: var(--step--1); color: var(--muted); margin-top: var(--s-4); }\n.search-hit { padding: var(--s-4) 0; border-top: 1px solid var(--line); }\n.search-hit :is(h2, h3) { font-size: var(--step-1); }\n.search-hit h3 a { color: var(--navy-900); text-decoration: none; }\n.search-hit h3 a:hover { text-decoration: underline; }\n.search-hit p { font-size: var(--step--1); color: var(--text-2); }\nmark { background: rgba(228,214,180,.55); color: inherit; padding: 0 .1em; }\n\n/* Glossary */\n.glossary-nav { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: var(--s-5); }\n.glossary-nav a {\n  display: grid; place-items: center; min-width: 36px; min-height: 36px; padding: 0 .4rem;\n  border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none;\n  font: 600 .8125rem/1 var(--font-mono); color: var(--navy-900); background: var(--white);\n}\n.glossary-nav a:hover { border-color: var(--navy-900); background: var(--ivory); }\n.glossary-group { margin-top: var(--s-6); }\n.glossary-group h2 { font-family: var(--font-mono); font-size: var(--step-1); color: var(--gold-ink); border-bottom: 1px solid var(--line); padding-bottom: .4rem; }\n\n/* Neutral-comparison table emphasis (PAPSS / SWIFT / switches) */\n.compare th:first-child { width: 22%; }\n.compare td strong { color: var(--navy-900); }\n\n/* Cross-site bridge to EKORails */\n.bridge-eko {\n  background: var(--navy-900); color: var(--on-dark); border-radius: var(--radius-lg);\n  padding: var(--s-5); display: grid; gap: var(--s-4); align-items: center;\n}\n.bridge-eko h2 { color: var(--white); font-size: var(--step-2); }\n.bridge-eko p { color: var(--on-dark-2); font-size: var(--step--1); max-width: 62ch; }\n@media (min-width: 860px) { .bridge-eko { grid-template-columns: 1fr auto; gap: var(--s-6); } }\n\n/* Editorial status / review workflow badges */\n.review-badge {\n  display: inline-flex; align-items: center; gap: .4rem;\n  font: 500 .6875rem/1 var(--font-mono); letter-spacing: .09em; text-transform: uppercase;\n  color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: .3rem .5rem;\n}\n"};
var HOSTS = { "ekorails.com": "eko", "www.ekorails.com": "eko",
              "ekoinfrastructure.com": "inf", "www.ekoinfrastructure.com": "inf" };
var LABEL = { eko: "EKORails.com", inf: "EkoInfrastructure.com" };
var UTIL  = { "/thank-you": 1, "/search": 1 };

var state = { site: "eko", path: "/", width: "full" };
var frame = document.getElementById("frame");
var holder = document.getElementById("holder");
var note = document.getElementById("note"), noteTimer;

function flash(html) {
  note.innerHTML = html;
  note.classList.add("on");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(function () { note.classList.remove("on"); }, 3200);
}

function buildRail() {
  var site = PAGES[state.site];
  document.getElementById("rail-title").textContent = LABEL[state.site];
  var list = document.getElementById("rail-list");
  var pick = document.querySelector(".pagepick");
  list.innerHTML = ""; pick.innerHTML = "";
  var n = 0;
  site.order.forEach(function (p) {
    var doc = site.docs[p];
    var name = p === "/" ? "Home" : doc.t.split(" | ")[0];
    var util = UTIL[p] ? " util" : "";
    if (!UTIL[p]) n++;
    var li = document.createElement("li");
    li.innerHTML = '<a class="' + util.trim() + '" href="#" data-path="' + p + '"' +
      (p === state.path ? ' aria-current="true"' : "") + '><i>' +
      (UTIL[p] ? "\u2014" : (n < 10 ? "0" + n : n)) + "</i><span></span></a>";
    li.querySelector("span").textContent = name;
    list.appendChild(li);
    var o = document.createElement("option");
    o.value = p; o.textContent = name; o.selected = (p === state.path);
    pick.appendChild(o);
  });
}

function show(site, path, hash) {
  if (!PAGES[site] || !PAGES[site].docs[path]) {
    flash('That page is not in this build: <code>' + path + '</code>');
    return;
  }
  var changedSite = site !== state.site;
  state.site = site; state.path = path;
  document.querySelectorAll("[data-site]").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.site === site));
  });
  buildRail();

  var doc = PAGES[site].docs[path];
  var host = site === "eko" ? "ekorails.com" : "ekoinfrastructure.com";
  document.getElementById("url").innerHTML =
    "https://<b>" + host + "</b>" + (path === "/" ? "/" : path) + (hash ? hash : "");
  document.getElementById("meta").textContent = doc.t;

  frame.srcdoc = doc.h.replace("__CSS__", "<style>" + CSS[site] + "</style>");
  frame.onload = function () {
    try {
      var d = frame.contentDocument;
      d.documentElement.scrollTop = 0;
      if (hash) {
        var el = d.getElementById(hash.slice(1));
        if (el) el.scrollIntoView();
      }
    } catch (e) { /* cross-origin srcdoc — nothing to do */ }
  };
  if (changedSite) flash("Now viewing <code>" + host + "</code>");
}

function setWidth(w) {
  state.width = w;
  document.querySelectorAll("[data-w]").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.w === w));
  });
  if (w === "full") {
    holder.classList.remove("framed");
    frame.style.width = "100%"; frame.style.maxWidth = "none"; frame.style.height = "100%";
  } else {
    holder.classList.add("framed");
    frame.style.width = w + "px"; frame.style.maxWidth = "100%"; frame.style.height = "100%";
  }
}

document.querySelector(".bar").addEventListener("click", function (e) {
  var s = e.target.closest("[data-site]");
  if (s) { show(s.dataset.site, "/"); return; }
  var w = e.target.closest("[data-w]");
  if (w) setWidth(w.dataset.w);
});
document.querySelector(".pagepick").addEventListener("change", function (e) {
  show(state.site, e.target.value);
});
document.getElementById("rail-list").addEventListener("click", function (e) {
  var a = e.target.closest("[data-path]");
  if (!a) return;
  e.preventDefault();
  show(state.site, a.dataset.path);
});

/* Links clicked inside the previewed page. */
window.addEventListener("message", function (e) {
  var m = e.data;
  if (!m || m.eko !== "nav") return;
  var href = m.href || "";
  if (/^mailto:/i.test(href)) {
    flash("Email link: <code>" + href.replace(/^mailto:/i, "") + "</code>");
    return;
  }
  if (/^https?:/i.test(href)) {
    var u = href.replace(/^https?:\/\//i, "");
    var host = u.split("/")[0];
    var rest = "/" + u.split("/").slice(1).join("/");
    var target = HOSTS[host];
    if (target) {
      var parts = rest.split("#");
      var p = parts[0].replace(/\/$/, "") || "/";
      show(target, p, parts[1] ? "#" + parts[1] : "");
    } else {
      flash("External link: <code>" + href + "</code>");
    }
    return;
  }
  var bits = href.split("#");
  var path = bits[0].split("?")[0].replace(/\/$/, "") || "/";
  show(state.site, path, bits[1] ? "#" + bits[1] : "");
});

setWidth("full");
show("eko", "/");
</script>
