<style>
/* ------------------------------------------------------------------ tokens
   The chrome stays EKORails navy in both themes — it is a viewer frame, and a
   constant frame keeps the eye on the two sites being reviewed. The stage
   behind the page adapts, so the artifact never fights the host ground. */
:root{
  --chrome:#08151F; --chrome-2:#0D2233; --chrome-line:rgba(243,241,236,.14);
  --chrome-ink:#F3F1EC; --chrome-ink-2:#93A3AD; --accent:#6FC3A2; --accent-dim:rgba(111,195,162,.14);
  --stage:#E6E2DA; --stage-ink:#3B474F; --stage-line:#C9C3B8; --page-shadow:rgba(8,21,31,.18);
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:260px; --bar:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#0E1418; --stage-ink:#8D9AA3; --stage-line:#243038; --page-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --stage:#0E1418; --stage-ink:#8D9AA3; --stage-line:#243038; --page-shadow:rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--stage); color:var(--stage-ink);
  font-family:var(--ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
:where(a,button,select,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ------------------------------------------------------------------ toolbar */
.bar{
  height:var(--bar); background:var(--chrome); color:var(--chrome-ink);
  border-bottom:1px solid var(--chrome-line);
  display:flex; align-items:center; gap:16px; padding:0 16px; position:relative; z-index:5;
}
.mark{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mark svg{display:block}
.mark b{font-weight:700;font-size:13px;letter-spacing:.2px}
.mark span{font-weight:400;color:var(--chrome-ink-2);font-size:13px}
.seg{display:flex;gap:2px;background:rgba(243,241,236,.07);padding:3px;border-radius:5px}
.seg button{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--chrome-ink-2);
  font:600 12px/1 var(--ui);padding:7px 12px;border-radius:3px;white-space:nowrap;
}
.seg button:hover{color:var(--chrome-ink)}
.seg button[aria-pressed="true"]{background:var(--accent-dim);color:var(--accent)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.widths{display:flex;gap:2px;background:rgba(243,241,236,.07);padding:3px;border-radius:5px}
.widths button{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--chrome-ink-2);
  font:500 11px/1 var(--mono);letter-spacing:.4px;padding:7px 10px;border-radius:3px;
}
.widths button:hover{color:var(--chrome-ink)}
.widths button[aria-pressed="true"]{background:var(--accent-dim);color:var(--accent)}
.pagepick{display:none}

/* ------------------------------------------------------------------ layout */
.wrap{display:flex;height:calc(100% - var(--bar))}

/* ------------------------------------------------------------------ page rail */
.rail{
  flex:0 0 var(--rail); background:var(--chrome-2); color:var(--chrome-ink-2);
  border-right:1px solid var(--chrome-line); overflow-y:auto; padding:14px 0 40px;
}
.rail h2{
  margin:0; padding:12px 18px 8px;
  font:600 10px/1 var(--mono); letter-spacing:1.4px; text-transform:uppercase; color:#6C7C87;
}
.rail ol{list-style:none;margin:0;padding:0}
.rail a{
  display:grid; grid-template-columns:26px 1fr; gap:8px; align-items:baseline;
  padding:8px 18px; text-decoration:none; color:var(--chrome-ink-2); font-size:13px;
  border-left:2px solid transparent;
}
.rail a:hover{color:var(--chrome-ink);background:rgba(243,241,236,.04)}
.rail a[aria-current="true"]{color:var(--chrome-ink);border-left-color:var(--accent);background:rgba(111,195,162,.08)}
.rail a i{font:500 10px/1.6 var(--mono);color:#5C6B75;font-style:normal}
.rail a[aria-current="true"] i{color:var(--accent)}
.rail .util{opacity:.62}

/* ------------------------------------------------------------------ stage */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.urlbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--stage-line);
  font:500 12px/1 var(--mono);color:var(--stage-ink);
}
.urlbar .lock{color:var(--stage-ink);opacity:.6}
.urlbar .u{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlbar .u b{font-weight:600;color:inherit}
.urlbar .meta{margin-left:auto;opacity:.65;white-space:nowrap}
.holder{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:0}
.holder.framed{padding:22px 22px 40px}
#frame{
  width:100%;height:100%;border:0;background:#fff;display:block;
}
.holder.framed #frame{
  height:calc(100% - 0px);border:1px solid var(--stage-line);border-radius:4px;
  box-shadow:0 10px 34px var(--page-shadow);
}
.note{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  background:var(--chrome);color:var(--chrome-ink);border:1px solid var(--chrome-line);
  padding:10px 14px;border-radius:5px;font-size:13px;box-shadow:0 8px 24px rgba(8,21,31,.35);
  opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:20;max-width:min(560px,90vw);
}
.note.on{opacity:1}
.note code{font-family:var(--mono);font-size:12px;color:var(--accent)}

@media (max-width:900px){
  :root{--bar:auto}
  .bar{flex-wrap:wrap;gap:10px;padding:10px 12px;height:auto}
  .bar-right{width:100%;margin-left:0}
  .widths{flex:1}
  .widths button{flex:1}
  .rail{display:none}
  .wrap{height:auto;flex:1}
  body{display:flex;flex-direction:column;overflow:hidden}
  .pagepick{
    display:block;flex:1;min-width:0;appearance:none;
    background:rgba(243,241,236,.07);color:var(--chrome-ink);border:1px solid var(--chrome-line);
    border-radius:5px;padding:8px 10px;font:500 12px/1.2 var(--ui);
  }
  .holder.framed{padding:12px 12px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

ontrol framework: governance, AML and CFT, KYC and KYB, sanctions, monitoring, fraud, data protection, cybersecurity, resilience and complaints.\">\n<meta name=\"twitter:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"EKORails \u2014 home\">\n      <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"#08151F\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#08151F\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#14344B\">Rails<\/tspan><\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"compliance_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Compliance and risk<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:24ch\">The control framework, written for the people who will test it.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">This page describes the\n      framework EKORails LTD is building and would operate under an approved pilot. It is written to be\n      read by supervisors, bank second-line functions and enterprise risk teams, and to be checked\n      against what we actually do.<\/p>\n    <p class=\"hero-status\" style=\"max-width:74ch\">\n      <span aria-hidden=\"true\">\u25b2<\/span>\n      <span>EKORails LTD holds no compliance, security or quality certification and claims none.\n        No statement on this page should be read as certification, accreditation or regulatory approval.\n        Where an independent audit or certification is completed, it will be named, dated and scoped.<\/span>\n    <\/p>\n    <p style=\"margin-top:var(--s-5)\"><a class=\"btn btn-emerald\" href=\"mailto:compliance@ekorails.com\" data-cta=\"compliance_email\">For compliance and regulatory inquiries: compliance@ekorails.com<\/a><\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"compliance_framework\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div>\n        <details class=\"acc\" open>\n          <summary>Governance<\/summary>\n          <div>\n            <p>Accountability for compliance sits with a named compliance officer who reports to the\n              board of EKORails LTD and has the authority to stop a transaction, a participant or a\n              release. Name, qualifications and appointment date:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n            <p>The board reviews the risk register, incidents, open regulatory matters and control\n              exceptions on a defined cycle. Committee structure and cadence:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n            <p>Policies are written, versioned, approved and reviewed at least annually. Every policy has\n              a named owner. Where a policy has not yet been approved, it is treated as draft and the\n              control it describes is not claimed as operating.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Regulatory engagement<\/summary>\n          <div>\n            <p>EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox.\n              Participation and all proposed pilot activities remain subject to regulatory review and\n              approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by any\n              financial services regulator.<\/p>\n            <p>Engagement is conducted through the named compliance officer, with a single record of\n              correspondence, commitments given and information provided, so that what we told a\n              regulator and what we tell the market cannot drift apart.<\/p>\n            <p>Public statements about regulatory status are subject to pre-publication review. See\n              <a href=\"/pilot-and-regulatory-pathway\">the regulatory pathway<\/a>.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>AML and CFT programme<\/summary>\n          <div>\n            <p>A written anti-money-laundering and counter-financing-of-terrorism programme covering:\n              a documented business-wide risk assessment; policies and procedures proportionate to that\n              assessment; a named responsible officer; training for all staff with role-specific training\n              for those in control functions; and independent testing of the programme.<\/p>\n            <p>The programme is designed against Nigerian requirements and the FATF Recommendations, and\n              against the requirements applying to partners in the receiving market. Where a licensed\n              partner owns the regulated decision, EKORails supports it with complete data and evidence\n              rather than substituting its own judgement.<\/p>\n            <p>Independent testing schedule and last review date:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>KYC and KYB<\/summary>\n          <div>\n            <p>Every participating institution and business is verified before it can transact:\n              legal identity, registration, regulatory status where applicable, beneficial ownership,\n              directors and authorised signatories, and the nature and expected pattern of its corridor\n              activity.<\/p>\n            <p>Individuals acting for a participant are identity-verified and their authority evidenced.\n              Verification is refreshed on a risk-based cycle, and material changes \u2014 ownership, control,\n              banking details \u2014 trigger re-verification rather than a note on file.<\/p>\n            <p>Evidence is retained in a form that a partner or supervisor can inspect.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Sanctions<\/summary>\n          <div>\n            <p>Parties and payment data are screened at onboarding and at transaction time against\n              applicable sanctions and watchlists for both markets in the corridor, including lists that\n              partners are separately obliged to apply.<\/p>\n            <p>Matches are not auto-cleared. A potential match holds the instruction, creates a case with\n              an owner and a service level, and is dispositioned by a person whose decision is recorded\n              with its rationale. List coverage and final disposition responsibility sit with the licensed\n              partner of record.<\/p>\n            <p>Screening provider and list coverage:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Transaction monitoring<\/summary>\n          <div>\n            <p>Corridor activity is monitored against rules and thresholds calibrated to the expected\n              pattern for each participant: value, frequency, counterparties, timing, structuring\n              indicators and deviation from a participant&rsquo;s own baseline.<\/p>\n            <p>Alerts route to a case-managed queue with ownership and timelines. Rules are tuned on\n              evidence, and every change to a rule is versioned so that a supervisor can see what was\n              being monitored on any given date.<\/p>\n            <p>EKORails does not claim that monitoring detects all illicit activity. No monitoring\n              programme can, and any statement to the contrary would be false.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Fraud prevention<\/summary>\n          <div>\n            <p>Controls target the fraud types that actually affect corridor payments: invoice\n              redirection and beneficiary-detail changes, business email compromise, account takeover of\n              a participant&rsquo;s portal user, and mule beneficiary accounts.<\/p>\n            <p>Measures include change-of-detail verification through a separate channel, beneficiary\n              whitelisting, dual approval above defined thresholds, device and session controls, and\n              anomaly detection on instruction patterns.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Suspicious activity escalation<\/summary>\n          <div>\n            <p>Defined escalation paths and timelines from the analyst to the named compliance officer,\n              and from the compliance officer to the relevant authority through the licensed partner of\n              record where the reporting obligation sits with that partner.<\/p>\n            <p>Tipping-off restrictions are respected: escalation procedures are designed so that a\n              participant is not told anything that would prejudice an investigation.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Data protection<\/summary>\n          <div>\n            <p>Processing is carried out on a defined lawful basis, minimised to what the transaction and\n              applicable rules require, and retained to a published schedule. Data subject rights \u2014\n              access, rectification, erasure where applicable, objection and portability \u2014 are handled\n              through a documented process with a response deadline.<\/p>\n            <p>Cross-border transfers within a corridor are assessed against the regimes of both markets,\n              including the Nigeria Data Protection Act 2023 where applicable, and the UK and EU regimes\n              where relevant to the entity or its processors.<\/p>\n            <p>Data protection officer and registration status:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span>. See the\n              <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Cybersecurity<\/summary>\n          <div>\n            <p>The security programme is built on least-privilege access with multi-factor\n              authentication, encryption in transit and at rest, environment segregation, centralised\n              logging and alerting, dependency and vulnerability management, secrets management, and\n              secure development practices including peer review and automated testing.<\/p>\n            <p>Independent penetration testing is performed before any pilot and on a defined cycle\n              thereafter; findings are tracked to closure. Testing provider, scope and last test date:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n            <p>Specific configuration details are not published, because publishing them would weaken the\n              controls they describe. They are made available to partners and reviewers under NDA.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Operational resilience<\/summary>\n          <div>\n            <p>Resilience is planned around the assumption that partners and networks will be\n              unavailable at some point. Recovery objectives are defined per component; degraded-mode\n              behaviour stops acceptance on an affected route rather than accepting instructions that\n              cannot complete; recovery begins with reconciliation against each partner.<\/p>\n            <p>Continuity plans are tested, not merely written, and the test results are recorded.\n              RTO and RPO targets and last test date:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Third-party and partner risk<\/summary>\n          <div>\n            <p>Every partner and vendor is assessed before engagement \u2014 licensing and regulatory\n              standing, financial condition, security posture, data protection, subcontracting and\n              concentration risk \u2014 and reassessed on a risk-based cycle.<\/p>\n            <p>Contracts set out responsibilities, service levels, audit and information rights, incident\n              notification timelines, data protection terms and exit provisions. Concentration on any\n              single partner for a critical function is treated as a risk in its own right.<\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Record retention<\/summary>\n          <div>\n            <p>Transaction records, verification evidence, screening and monitoring outcomes, case\n              records and communications are retained for the longest applicable period across the\n              markets in the corridor, and are recoverable in a readable form for the whole of that\n              period.<\/p>\n            <p>Retention schedule: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n          <\/div>\n        <\/details>\n        <details class=\"acc\">\n          <summary>Complaints and dispute handling<\/summary>\n          <div>\n            <p>Where a participant&rsquo;s customer has a complaint, the regulated complaints process\n              belongs to the licensed institution that holds that customer relationship. EKORails\n              supports it with transaction evidence, status and timelines, to an agreed service level.<\/p>\n            <p>Complaints made directly to EKORails by participants are logged, acknowledged, owned and\n              resolved against published timelines, with root causes fed back into controls.\n              Complaints contact and target response time:\n              <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n          <\/div>\n        <\/details>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <div class=\"callout\">\n          <h2>Compliance and regulatory inquiries<\/h2>\n          <p>For supervisory correspondence, due diligence questionnaires, control documentation requests\n            and security reviews:<\/p>\n          <p style=\"margin-top:var(--s-3)\"><a class=\"btn btn-emerald btn-block\" href=\"mailto:compliance@ekorails.com\" data-cta=\"compliance_sidebar_email\">compliance@ekorails.com<\/a><\/p>\n          <p class=\"small muted\" style=\"margin-top:var(--s-3)\">Enquiries are handled by the named\n            compliance officer. Documentation is shared under NDA where appropriate.<\/p>\n        <\/div>\n        <div class=\"callout callout--gold\" style=\"margin-top:var(--s-4)\">\n          <h3>What we do not claim<\/h3>\n          <ul class=\"card-list\" style=\"margin-top:.6rem\">\n            <li>No certification (ISO, SOC, PCI or otherwise) is held or claimed.<\/li>\n            <li>No regulator has approved, endorsed or supervised these controls.<\/li>\n            <li>No statement that every transaction is or will be compliant.<\/li>\n            <li>No claim that monitoring detects all illicit activity.<\/li>\n            <li>No guarantee of uptime, timing or outcome.<\/li>\n          <\/ul>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"compliance_cta\">\n  <div class=\"shell\">\n    <h2>Reviewing us as a third party?<\/h2>\n    <p>Send the questionnaire. We would rather answer a hard due-diligence pack early than a\n      complaint late.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"mailto:compliance@ekorails.com\" data-cta=\"compliance_cta_email\">compliance@ekorails.com<\/a>\n      <a class=\"btn btn-on-dark\" href=\"/platform#boundary\" data-cta=\"compliance_cta_boundary\">System boundary<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/use-cases\">Use cases<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Governance<\/h2><ul><li><a href=\"/pilot-and-regulatory-pathway\">Pilot &amp; regulatory pathway<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance &amp; risk<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Engage<\/h2><ul><li><a href=\"/partners\">Institutional partnerships<\/a><\/li><li><a href=\"/contact\">Contact<\/a><\/li><li><a href=\"/news\">News &amp; updates<\/a><\/li><li><a href=\"https://ekoinfrastructure.com\" rel=\"noopener\">Eko Infrastructure research<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Legal<\/h2><ul><li><a href=\"/privacy-policy\">Privacy policy<\/a><\/li><li><a href=\"/terms-of-use\">Terms of use<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/li><\/ul><\/div><\/div>\n    <\/div>\n    <div class=\"footer-status\" role=\"note\">\n      <p><strong>Regulatory status.<\/strong> EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central Bank of Nigeria or by any other financial services regulator, and does not hold a payment services, banking or money transmission licence in any jurisdiction. See the <a href=\"/regulatory-disclaimer\">Regulatory Disclaimer<\/a>.<\/p>\n    <\/div>\n    <div class=\"footer-legal\">\n      <p class=\"disclaimer\">EKORails LTD is developing financial infrastructure for institutional and enterprise use. Information on this website is provided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \ 55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#08151F\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#14344B\">Rails<\/tspan><\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"contact_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Contact<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:20ch\">Reach the right person first time.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">Four addresses, four different\n      teams. Regulatory and compliance correspondence goes directly to the named compliance officer and\n      is not handled by a general inbox.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"contact_routes\">\n  <div class=\"shell\">\n    <div class=\"grid grid-2\">\n      <article class=\"card\">\n        <p class=\"card-index\">General<\/p>\n        <h2>General and company enquiries<\/h2>\n        <p>Anything that does not fit the categories below, including press-adjacent company questions.<\/p>\n        <p><a class=\"link-arrow\" href=\"mailto:info@ekorails.com\">info@ekorails.com<\/a><\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">Partnerships<\/p>\n        <h3>Institutional partnerships<\/h3>\n        <p>Banks, payment institutions, enterprises, FX and liquidity providers, technology and\n          compliance providers, research partners.<\/p>\n        <p><a class=\"link-arrow\" href=\"mailto:partnerships@ekorails.com\">partnerships@ekorails.com<\/a><\/p>\n        <p class=\"small muted\">Or use the <a href=\"/partners#enquiry\">partnership enquiry form<\/a>.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">Compliance<\/p>\n        <h3>Compliance and regulatory<\/h3>\n        <p>Supervisory correspondence, due diligence questionnaires, control documentation, security\n          reviews, data protection requests and complaints.<\/p>\n        <p><a class=\"link-arrow\" href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">Research and media<\/p>\n        <h3>Research and media<\/h3>\n        <p>Eko Infrastructure research, data and source questions, corrections, and media enquiries.<\/p>\n        <p><a class=\"link-arrow\" href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a><\/p>\n      <\/article>\n    <\/div>\n\n    <div class=\"split\" style=\"margin-top:var(--s-7)\">\n      <div>\n        <h2 style=\"font-size:var(--step-2)\">Registered details<\/h2>\n        <dl class=\"deflist\" style=\"margin-top:var(--s-4)\">\n          <div><dt>Legal entity<\/dt><dd>EKORails LTD<\/dd><\/div>\n          <div><dt>Company number<\/dt><dd><span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/dd><\/div>\n          <div><dt>Registered office<\/dt><dd><span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/dd><\/div>\n          <div><dt>Operating locations<\/dt><dd><span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/dd><\/div>\n          <div><dt>Data protection contact<\/dt><dd><a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/dd><\/div>\n        <\/dl>\n      <\/div>\n      <div>\n        <div class=\"callout\">\n          <h3>What we cannot help with<\/h3>\n          <ul class=\"card-list\" style=\"margin-top:.6rem\">\n            <li>Investment enquiries. EKORails does not solicit investment through this website.<\/li>\n            <li>Retail payments, remittance or account queries \u2014 EKORails has no retail customers.<\/li>\n            <li>Requests to confirm a regulatory status we do not hold.<\/li>\n            <li>Requests to name partners who have not consented in writing to be named.<\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"callout callout--gold\" style=\"margin-top:var(--s-4)\">\n          <h3>Reporting a security issue<\/h3>\n          <p>If you believe you have found a security vulnerability affecting EKORails, please email\n            <a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a> with the detail needed\n            to reproduce it. Please do not test against production systems or access data that is not\n            yours. Coordinated disclosure policy:\n            <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/use-cases\">Use cases<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Governance<\/h2><ul><li><a href=\"/pilot-and-regulatory-pathway\">Pilot &amp; regulatory pathway<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance &amp; risk<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Engage<\/h2><ul><li><a href=\"/partners\">Institutional partnerships<\/a><\/li><li><a href=\"/contact\">Contact<\/a><\/li><li><a href=\"/news\">News &amp; updates<\/a><\/li><li><a href=\"https://ekoinfrastructure.com\" rel=\"noopener\">Eko Infrastructure research<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Legal<\/h2><ul><li><a href=\"/privacy-policy\">Privacy policy<\/a><\/li><li><a href=\"/terms-of-use\">Terms of use<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/li><\/ul><\/div><\/div>\n    <\/div>\n    <div class=\"footer-status\" role=\"note\">\n      <p><strong>Regulatory status.<\/strong> EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central Bank of Nigeria or by any other financial services regulator, and does not hold a payment services, banking or money transmission licence in any jurisdiction. See the <a href=\"/regulatory-disclaimer\">Regulatory Disclaimer<\/a>.<\/p>\n    <\/div>\n    <div class=\"footer-legal\">\n      <p class=\"disclaimer\">EKORails LTD is developing financial infrastructure for institutional and enterprise use. Information on this website is provided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \u00b7 Registered office [CONFIRM WITH EKORAILS].<\/p>\n    <\/div>\n  <\/div>\n<\/footer>\n\n\n\n<script>\n(function(){\n  var t=document.querySelector('[data-nav-toggle]'),p=document.querySelector('[data-mobile-nav]');\n  if(t&&p){t.addEventListener('click',function(){var o=t.getAttribute('aria-expanded')==='true';\n    t.setAttribute('aria-expanded',String(!o));p.hidden=o;});}\n  var c=document.querySelector('[data-consent]');\n  if(c){c.hidden=false;c.addEventListener('click',function(e){\n    if(e.target.closest('[data-consent-choice]')) c.hidden=true;});}\n  document.addEventListener('click',function(e){\n    var a=e.target.closest('a'); if(!a) return;\n    var h=a.getAttribute('href')||'';\n    if(h.charAt(0)==='#') return;\n    e.preventDefault();\n    parent.postMessage({eko:'nav',href:h,host:a.hostname||''},'*');\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"},"/corridors":{"t":"Corridors | The initial proposed corridor | EKORails","h":"<!DOCTYPE html>\n<html lang=\"en\" class=\"site-ekorails\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Corridors | The initial proposed corridor | EKORails<\/title>\n<meta name=\"description\" content=\"One proposed pilot corridor originating in Nigeria: why it was selected, the institutional users, required partners, dependencies and success measures.\">\n<meta name=\"robots\" content=\"index,follow,max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://ekorails.com/corridors\">\n<meta name=\"theme-color\" content=\"#08151F\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"EKORails\">\n<meta property=\"og:title\" content=\"Corridors | The initial proposed corridor | EKORails\">\n<meta property=\"og:description\" content=\"One proposed pilot corridor originating in Nigeria: why it was selected, the institutional users, required partners, dependencies and success measures.\">\n<meta property=\"og:url\" content=\"https://ekorails.com/corridors\">\n<meta property=\"og:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n<meta property=\"og:image:alt\" content=\"EKORails \u2014 settlement infrastructure for African trade.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Corridors | The initial proposed corridor | EKORails\">\n<meta name=\"twitter:description\" content=\"One proposed pilot corridor originating in Nigeria: why it was selected, the institutional users, required partners, dependencies and success measures.\">\n<meta name=\"twitter:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"EKORails \u2014 home\">\n      <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"#08151F\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#08151F\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#14344B\">Rails<\/tspan><\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"corridor_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Corridors<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:22ch\">One corridor. Proven, or not proven.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">EKORails is not building a\n      network map. The proposed pilot addresses a single corridor with a defined institutional user\n      group, so that the compliance model, the partner model and the settlement model can be tested and\n      evidenced before anything else is contemplated.<\/p>\n    <p class=\"hero-status\" style=\"max-width:70ch\">\n      <span aria-hidden=\"true\">\u25b2<\/span>\n      <span>No corridor described on this page is operating. There is no live transaction activity,\n        no active corridor and no launched service.<\/span>\n    <\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"corridor_initial\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Initial proposed corridor<\/p>\n      <h2>Nigeria as the origination market, with one counterparty market.<\/h2>\n      <p>The counterparty market, currency pair and value bands are those set out in EKORails LTD&rsquo;s\n        regulatory filing. They will be published on this page once the filing status permits, and not\n        before.<\/p>\n    <\/div>\n    <dl class=\"deflist\">\n      <div>\n        <dt>The corridor<\/dt>\n        <dd>Origination: Nigeria. Counterparty market:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 counterparty market as filed]<\/span>.\n          Currency pair: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span>.\n          Direction and value bands: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/dd>\n      <\/div>\n      <div>\n        <dt>Why this corridor was selected<\/dt>\n        <dd>Four criteria, documented in the filing: existing documented trade volume between the two\n          markets; the availability of licensed partners on both sides who can perform the conversion,\n          settlement and payout legs; a regulatory pathway that is clear enough to plan against; and a\n          concentration of business payments where the reconciliation problem is acute rather than\n          theoretical. <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 selection rationale as filed]<\/span><\/dd>\n      <\/div>\n      <div>\n        <dt>Intended institutional users<\/dt>\n        <dd>Licensed banks and payment institutions with corridor obligations; enterprises with\n          recurring, documented trade payments on the corridor; and approved trade counterparties. In a\n          pilot, this is limited to the named participant set agreed with the regulator and partners.<\/dd>\n      <\/div>\n      <div>\n        <dt>The market friction identified<\/dt>\n        <dd>Payments that arrive without the reference data needed to reconcile them; conversion that\n          depends on currency availability rather than only on price; duplicated compliance checks at\n          each intermediary; and no single participant holding a complete, evidenced record of the\n          transaction. Corridor-specific measurements of these frictions:\n          <span class=\"placeholder\">[INSERT VERIFIED FIGURE \u2014 corridor baseline study]<\/span><\/dd>\n      <\/div>\n      <div>\n        <dt>Required partners<\/dt>\n        <dd>At minimum an originating institution, a licensed conversion or liquidity counterparty, a\n          settlement partner and a licensed payout institution in the receiving market \u2014 plus identity,\n          screening and monitoring providers. Partner names are published only with written consent, and\n          no partner is described as engaged before an agreement is executed.<\/dd>\n      <\/div>\n      <div>\n        <dt>Proposed settlement flow<\/dt>\n        <dd>Initiation, identity and compliance validation, transaction authorisation, FX or value\n          conversion by a licensed counterparty, settlement by the responsible licensed institution, then\n          confirmation and audit reporting. See <a href=\"/platform#lifecycle\">the transaction lifecycle<\/a>\n          and <a href=\"/platform#boundary\">the system boundary<\/a>.<\/dd>\n      <\/div>\n      <div>\n        <dt>Regulatory dependencies<\/dt>\n        <dd>Sandbox participation and its scope; partner authorisations in both markets; data protection\n          obligations in both markets; and any conditions attached to an approval.\n          <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/dd>\n      <\/div>\n      <div>\n        <dt>Pilot success measurements<\/dt>\n        <dd>Completeness of the audit record; screening accuracy and false-positive rate; exception and\n          repair rate; reconciliation match rate; adherence to agreed reporting; and time-to-resolution\n          for held transactions. Target thresholds:\n          <span class=\"placeholder\">[INSERT VERIFIED FIGURE \u2014 success thresholds as filed]<\/span>.\n          Volume is explicitly not a success measure for the pilot.<\/dd>\n      <\/div>\n    <\/dl>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"corridor_expansion\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Expansion<\/p>\n      <h2>What would have to be true before a second corridor.<\/h2>\n      <p>EKORails does not publish a corridor roadmap, because publishing one would imply commitments\n        that depend on regulators and partners rather than on us. What we can publish is the test a\n        second corridor would have to pass.<\/p>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card\"><p class=\"card-index\">Condition 01<\/p><h3>The first corridor is evidenced<\/h3><p>The pilot has completed, its success measures have been met and the results have been reported to the regulator.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Condition 02<\/p><h3>Authorisation exists<\/h3><p>The appropriate authorisation or licence is held in each market of the new corridor before any activity begins.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Condition 03<\/p><h3>Licensed partners are contracted<\/h3><p>Conversion, settlement and payout partners are executed on both sides, not merely in discussion.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Condition 04<\/p><h3>Controls transfer<\/h3><p>Screening, monitoring and reporting obligations for the new markets are implemented and tested, not assumed.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Condition 05<\/p><h3>Demand is documented<\/h3><p>Named institutional users with documented corridor obligations, not projected market size.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Condition 06<\/p><h3>Operations can carry it<\/h3><p>Support, case management and resilience capacity exist for two corridors, not one corridor stretched.<\/p><\/article>\n    <\/div>\n    <div class=\"callout\" style=\"margin-top:var(--s-6)\">\n      <h3>Africa\u2013GCC trade settlement<\/h3>\n      <p>Trade between African markets and the Gulf is a corridor family EKORails follows closely\n        through <a href=\"https://ekoinfrastructure.com/corridor-intelligence\">Eko Infrastructure corridor\n        intelligence<\/a>. It is research interest, not a product commitment: no Africa\u2013GCC corridor is\n        proposed, filed or in development.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"corridor_complement\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Where we sit<\/p>\n      <h2>Complementary to existing infrastructure, by design.<\/h2>\n      <p>A corridor already has participants. Any credible new entrant has to explain what it adds to\n        them rather than what it replaces.<\/p>\n    <\/div>\n    <div class=\"table-wrap\">\n      <table class=\"compare\">\n        <caption>How EKORails is intended to relate to existing systems. Descriptive, not comparative marketing.<\/caption>\n        <thead><tr><th scope=\"col\">System<\/th><th scope=\"col\">What it does<\/th><th scope=\"col\">Intended relationship to EKORails<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td><strong>PAPSS<\/strong><\/td><td>A pan-African payment and settlement system developed with Afreximbank and African central banks, enabling payments in local currencies between participating institutions.<\/td><td>Potentially complementary. Where a corridor is served by PAPSS and a participant is connected, that route may be the right one. EKORails is designed as an orchestration and reconciliation layer, not an alternative settlement system.<\/td><\/tr>\n          <tr><td><strong>SWIFT<\/strong><\/td><td>Primarily a financial messaging network used by banks to exchange payment instructions. It is not itself clearing, conversion or settlement.<\/td><td>Complementary. Messaging remains the way many institutions communicate. EKORails aligns to ISO 20022 semantics so partner banks receive data in a form their systems expect.<\/td><\/tr>\n          <tr><td><strong>Domestic payment switches<\/strong><\/td><td>National infrastructure for domestic clearing and payout, with local reach and local cut-offs.<\/td><td>Depended upon. The last mile of any corridor runs through domestic rails, reached by a licensed partner in that market.<\/td><\/tr>\n          <tr><td><strong>Central bank settlement systems<\/strong><\/td><td>Real-time gross settlement and related systems providing settlement in central bank money.<\/td><td>Depended upon, through licensed participants. EKORails does not provide settlement finality.<\/td><\/tr>\n          <tr><td><strong>Correspondent banking<\/strong><\/td><td>Bilateral bank relationships used to reach markets where a bank has no direct presence.<\/td><td>Coexists. Where a correspondent route is the appropriate route, the value EKORails adds is the record and the controls around it.<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n    <p class=\"small muted\" style=\"margin-top:var(--s-4);max-width:80ch\">Neutral explanations of each of\n      these systems, with sources, are published on\n      <a href=\"https://ekoinfrastructure.com/settlement-explained\">Eko Infrastructure<\/a>.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"corridor_cta\">\n  <div class=\"shell\">\n    <h2>Operating on this corridor already?<\/h2>\n    <p>Banks, payment institutions and enterprises with corridor obligations are the people we most need\n      to hear from \u2014 including when they disagree with our reading of the problem.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"/partners\" data-cta=\"corridor_partner\">Discuss a Partnership<\/a>\n      <a class=\"btn btn-on-dark\" href=\"https://ekoinfrastructure.com/corridor-intelligence\" data-cta=\"corridor_research\">Corridor research<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/use-cases\">Use cases<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Governance<\/h2><ul><li><a href=\"/pilot-and-regulatory-pathway\">Pilot &amp; regulatory pathway<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance &amp; risk<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Engage<\/h2><ul><li><a href=\"/partners\">Institutional partnerships<\/a><\/li><li><a href=\"/contact\">Contact<\/a><\/li><li><a href=\"/news\">News &amp; updates<\/a><\/li><li><a href=\"https://ekoinfrastructure.com\" rel=\"noopener\">Eko Infrastructure research<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Legal<\/h2><ul><li><a href=\"/privacy-policy\">Privacy policy<\/a><\/li><li><a href=\"/terms-of-use\">Terms of use<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/li><\/ul><\/div><\/div>\n    <\/div>\n    <div class=\"footer-status\" role=\"note\">\n      <p><strong>Regulatory status.<\/strong> EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central Bank of Nigeria or by any other financial services regulator, and does not hold a payment services, banking or money transmission licence in any jurisdiction. See the <a href=\"/regulatory-disclaimer\">Regulatory Disclaimer<\/a>.<\/p>\n    <\/div>\n    <div class=\"footer-legal\">\n      <p class=\"disclaimer\">EKORails LTD is developing financial infrastructure for institutional and enterprise use. Information on this website is provided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \u00b7 Registered office [CONFIRM WITH EKORAILS].<\/p>\n    <\/div>\n  <\/div>\n<\/footer>\n\n\n\n<script>\n(function(){\n  var t=document.querySelector('[data-nav-toggle]'),p=document.querySelector('[data-mobile-nav]');\n  if(t&&p){t.addEventListener('click',function(){var o=t.getAttribute('aria-expanded')==='true';\n    t.setAttribute('aria-expanded',String(!o));p.hidden=o;});}\n  var c=document.querySelector('[data-consent]');\n  if(c){c.hidden=false;c.addEventListener('click',function(e){\n    if(e.target.closest('[data-consent-choice]')) c.hidden=true;});}\n  document.addEventListener('click',function(e){\n    var a=e.target.closest('a'); if(!a) return;\n    var h=a.getAttribute('href')||'';\n    if(h.charAt(0)==='#') return;\n    e.preventDefault();\n    parent.postMessage({eko:'nav',href:h,host:a.hostname||''},'*');\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"},"/":{"t":"EKORails | Settlement infrastructure for African trade","h":"<!DOCTYPE html>\n<html lang=\"en\" class=\"site-ekorails\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>EKORails | Settlement infrastructure for African trade<\/title>\n<meta name=\"description\" content=\"EKORails LTD is developing a compliance-first settlement and interoperability platform for regulated institutions across selected African trade corridors.\">\n<meta name=\"robots\" content=\"index,follow,max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://ekorails.com/\">\n<meta name=\"theme-color\" content=\"#08151F\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"EKORails\">\n<meta property=\"og:title\" content=\"EKORails \u2014 settlement infrastructure for African trade\">\n<meta property=\"og:description\" content=\"EKORails LTD is developing a compliance-first settlement and interoperability platform for regulated institutions across selected African trade corridors.\">\n<meta property=\"og:url\" content=\"https://ekorails.com/\">\n<meta property=\"og:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n<meta property=\"og:image:alt\" content=\"EKORails \u2014 settlement infrastructure for African trade.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"EKORails \u2014 settlement infrastructure for African trade\">\n<meta name=\"twitter:description\" content=\"EKORails LTD is developing a compliance-first settlement and interoperability platform for regulated institutions across selected African trade corridors.\">\n<meta name=\"twitter:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"EKORails \u2014 home\">\n      <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"#08151F\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#08151F\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#14344B\">Rails<\/tspan><\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--home\" data-section=\"hero\">\n  <div class=\"shell\">\n    <div class=\"hero-grid\">\n      <div>\n        <p class=\"eyebrow\">EKORails LTD<\/p>\n        <h1>Settlement infrastructure for African trade.<\/h1>\n        <p class=\"hero-lede\">EKORails is developing a compliance-first settlement and interoperability\n          platform designed to help regulated institutions and businesses move value across selected\n          African and global trade corridors.<\/p>\n        <p class=\"hero-status\">\n          <span aria-hidden=\"true\">\u25b2<\/span>\n          <span>Proposed pilot activities remain subject to regulatory and partner approval.\n            EKORails LTD is not licensed or supervised by any financial services regulator.<\/span>\n        <\/p>\n        <div class=\"btn-row hero-actions\">\n          <a class=\"btn btn-emerald\" href=\"/partners\" data-cta=\"hero_partnerships\">Explore Institutional Partnerships<\/a>\n          <a class=\"btn btn-on-dark\" href=\"/platform\" data-cta=\"hero_platform\">Review the Platform<\/a>\n        <\/div>\n        <p class=\"hero-note\"><a class=\"link-arrow\" href=\"https://ekoinfrastructure.com\" data-cta=\"hero_research\">Visit Eko Infrastructure Research<\/a><\/p>\n      <\/div>\n\n      <figure class=\"corridor-fig\">\n        <svg viewBox=\"0 0 520 300\" role=\"img\" aria-labelledby=\"corridor-title corridor-desc\" style=\"width:100%;height:auto\">\n          <title id=\"corridor-title\">Proposed initial settlement corridor<\/title>\n          <desc id=\"corridor-desc\">A schematic of one proposed corridor: value originates in the\n            Nigeria market, passes through compliance validation, value conversion and licensed partner\n            settlement, and is confirmed in a counterparty market that is yet to be published.\n            No other corridor is shown and no corridor is operating.<\/desc>\n          <defs>\n            <pattern id=\"grid\" width=\"26\" height=\"26\" patternUnits=\"userSpaceOnUse\">\n              <path d=\"M26 0H0V26\" fill=\"none\" stroke=\"rgba(243,241,236,.07)\" stroke-width=\"1\"/>\n            <\/pattern>\n          <\/defs>\n          <rect width=\"520\" height=\"300\" fill=\"url(#grid)\"/>\n          <path d=\"M70 214 C 170 214, 200 96, 300 96 S 400 96, 450 96\" fill=\"none\"\n                stroke=\"#12855F\" stroke-width=\"1.6\" class=\"route-line\"/>\n          <circle cx=\"70\" cy=\"214\" r=\"13\" fill=\"#12855F\" opacity=\".25\" class=\"node-pulse\"/>\n          <circle cx=\"70\" cy=\"214\" r=\"6\" fill=\"#6FC3A2\"/>\n          <circle cx=\"450\" cy=\"96\" r=\"6\" fill=\"none\" stroke=\"#E4D6B4\" stroke-width=\"1.6\" stroke-dasharray=\"3 3\"/>\n          <g fill=\"#C2CDD5\" font-family=\"IBM Plex Mono, monospace\" font-size=\"10\" letter-spacing=\"1\">\n            <text x=\"70\" y=\"246\" text-anchor=\"middle\">ORIGINATION<\/text>\n            <text x=\"70\" y=\"262\" text-anchor=\"middle\" fill=\"#93A3AD\">NIGERIA MARKET<\/text>\n            <text x=\"452\" y=\"60\" text-anchor=\"end\">COUNTERPARTY<\/text>\n            <text x=\"452\" y=\"76\" text-anchor=\"end\" fill=\"#93A3AD\">TO BE PUBLISHED<\/text>\n          <\/g>\n          <g font-family=\"IBM Plex Mono, monospace\" font-size=\"9\" letter-spacing=\".6\" fill=\"#93A3AD\">\n            <rect x=\"120\" y=\"176\" width=\"7\" height=\"7\" fill=\"none\" stroke=\"#6FC3A2\"/>\n            <text x=\"134\" y=\"183\">COMPLIANCE VALIDATION<\/text>\n            <rect x=\"196\" y=\"128\" width=\"7\" height=\"7\" fill=\"none\" stroke=\"#6FC3A2\"/>\n            <text x=\"210\" y=\"135\">FX / VALUE CONVERSION<\/text>\n            <rect x=\"300\" y=\"118\" width=\"7\" height=\"7\" fill=\"none\" stroke=\"#E4D6B4\"/>\n            <text x=\"314\" y=\"125\">PARTNER SETTLEMENT<\/text>\n          <\/g>\n        <\/svg>\n        <figcaption><strong>One proposed corridor.<\/strong> This schematic shows the single initial\n          corridor described in EKORails LTD&rsquo;s regulatory filing. It is not a network map, and no\n          corridor shown is operating. Counterparty market:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/figcaption>\n      <\/figure>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" id=\"problem\" data-section=\"problem\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">The problem<\/p>\n      <h2>Moving value across African trade corridors is still slower, costlier and harder to reconcile than it should be.<\/h2>\n      <p>Existing infrastructure is improving. Regional systems, domestic switches and bank networks\n        have all advanced in the last decade. What remains difficult is the specific, corridor-level\n        work of getting a business payment validated, converted, settled and evidenced end to end.<\/p>\n    <\/div>\n    <div class=\"grid grid-2\">\n      <article class=\"card\">\n        <p class=\"card-index\">01 \u2014 Cost<\/p>\n        <h3>Costs remain high in many Sub-Saharan corridors<\/h3>\n        <p>The average cost of sending money to and within Sub-Saharan Africa remains among the highest\n          of any region measured by the World Bank&rsquo;s Remittance Prices Worldwide database, and\n          business payments carry their own layered bank, correspondent and conversion charges.\n          Corridor-level costs vary widely, and any figure EKORails publishes will be cited and dated.\n          <span class=\"placeholder\">[INSERT VERIFIED FIGURE \u2014 corridor cost baseline]<\/span><\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">02 \u2014 FX availability<\/p>\n        <h3>Currency access, not just currency price<\/h3>\n        <p>For many businesses the binding constraint is not the quoted rate but whether the currency is\n          available at the size and time required. Queuing for allocation, splitting orders across\n          providers and holding balances defensively all impose real working-capital costs that do not\n          appear in a headline spread.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">03 \u2014 Reconciliation<\/p>\n        <h3>Payments arrive without the data that explains them<\/h3>\n        <p>When a payment crosses several intermediaries, the invoice reference, the purchase order and\n          the remittance detail frequently do not survive the journey. Finance teams then reconstruct by\n          hand what the payment was for, which delays release of goods and inflates the true cost of the\n          transaction well beyond the fee charged.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">04 \u2014 Compliance load<\/p>\n        <h3>Duplicated checks at every hop<\/h3>\n        <p>Each institution in a chain runs its own screening and due diligence, often on partial\n          information. The result is repeated work, avoidable false positives, payments held for review\n          and a support burden that falls on the customer rather than the chain.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">05 \u2014 Last mile<\/p>\n        <h3>Final payout depends on local reach<\/h3>\n        <p>Settlement between institutions is only part of the problem. Reaching the counterparty&rsquo;s\n          account at a domestic bank, on a domestic switch, within domestic cut-off times, requires a\n          licensed local partner in every market. Reach is earned market by market.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">06 \u2014 Fragmentation<\/p>\n        <h3>Systems that do not yet speak to one another<\/h3>\n        <p>Regional and domestic systems each solve part of the problem well. The gap that persists is\n          interoperability: conne
