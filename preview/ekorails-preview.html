ink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"sources_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">Reference<\/p>\n    <h1>Data and sources.<\/h1>\n    <p class=\"hero-lede\">Every statistic published across Eko Infrastructure and EKORails is listed here\n      with its source, its date and its limitations. If a figure is not in this register, we do not\n      publish it.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"sources_rules\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Sourcing rules<\/p>\n      <h2>Six rules we hold ourselves to.<\/h2>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card\"><p class=\"card-index\">Rule 01<\/p><h3>Primary source or nothing<\/h3><p>We cite the body that produced the data, not an article about it. Where only a secondary source exists, we say so.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Rule 02<\/p><h3>Date everything<\/h3><p>Every figure carries the period it covers and the date we retrieved it. Payment data ages quickly.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Rule 03<\/p><h3>Definitions travel with numbers<\/h3><p>What was counted, and how, is published alongside the figure. Most disagreements are definitional.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Rule 04<\/p><h3>Estimates are labelled<\/h3><p>Where we model, we show the inputs, assumptions and arithmetic, and call the output an estimate.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Rule 05<\/p><h3>No superlatives without a dataset<\/h3><p>&ldquo;Largest&rdquo;, &ldquo;fastest growing&rdquo; and multiples require a named dataset, a year and a definition.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Rule 06<\/p><h3>Placeholders, not guesses<\/h3><p>Where a figure is required but unverified, we publish a visible placeholder rather than an approximation.<\/p><\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"sources_register\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Source register<\/p>\n      <h2>The register.<\/h2>\n      <p>This register is the controlled list. Any figure appearing on either website must have an entry\n        here, and the entry is checked on the review cycle set out in our editorial standards.<\/p>\n    <\/div>\n    <div class=\"table-wrap\">\n      <table>\n        <caption>Source register. Status &ldquo;pending verification&rdquo; means the figure is not published anywhere on either site until an editor has confirmed it against the primary source.<\/caption>\n        <thead>\n          <tr><th scope=\"col\">ID<\/th><th scope=\"col\">Claim or figure<\/th><th scope=\"col\">Primary source<\/th><th scope=\"col\">Period<\/th><th scope=\"col\">Retrieved<\/th><th scope=\"col\">Used on<\/th><th scope=\"col\">Status<\/th><\/tr>\n        <\/thead>\n        <tbody>\n          <tr><td>S-001<\/td><td>Cost of sending remittances to Sub-Saharan Africa, by corridor<\/td><td>World Bank, Remittance Prices Worldwide<\/td><td><span class=\"placeholder\">[QUARTER]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>ekorails.com/ (problem), settlement-explained<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-002<\/td><td>Decline in active correspondent banking relationships<\/td><td>Financial Stability Board / BIS CPMI<\/td><td><span class=\"placeholder\">[YEAR]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>settlement-explained<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-003<\/td><td>Recorded bilateral merchandise trade, Nigeria and counterparty market<\/td><td>UN Comtrade / national statistics office<\/td><td><span class=\"placeholder\">[YEAR]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>corridor-intelligence, ekorails.com/corridors<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-004<\/td><td>Definition and scope of PAPSS participation<\/td><td>PAPSS / Afreximbank official material<\/td><td><span class=\"placeholder\">[YEAR]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>research/what-papss-does, ekorails.com/corridors<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-005<\/td><td>Function and scope of the SWIFT network<\/td><td>SWIFT official documentation<\/td><td><span class=\"placeholder\">[YEAR]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>research/swift-is-a-messaging-network<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-006<\/td><td>ISO 20022 migration status by market<\/td><td>ISO 20022 / market infrastructure operators<\/td><td><span class=\"placeholder\">[YEAR]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>technology<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-007<\/td><td>Central Bank of Nigeria Regulatory Sandbox framework<\/td><td>Central Bank of Nigeria<\/td><td><span class=\"placeholder\">[YEAR]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>policy-and-regulation, ekorails.com/pilot-and-regulatory-pathway<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-008<\/td><td>Nigeria Data Protection Act 2023 obligations<\/td><td>Nigeria Data Protection Commission<\/td><td>2023<\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>policy-and-regulation, ekorails.com/privacy-policy<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-009<\/td><td>FATF Recommendations, including wire transfer information requirements<\/td><td>Financial Action Task Force<\/td><td><span class=\"placeholder\">[EDITION]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>policy-and-regulation, technology, ekorails.com/compliance-and-risk<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-010<\/td><td>Settlement finality definitions<\/td><td>CPMI\u2013IOSCO, Principles for Financial Market Infrastructures<\/td><td><span class=\"placeholder\">[EDITION]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>settlement-explained, glossary<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-011<\/td><td>Intra-African trade values and AfCFTA context<\/td><td>Afreximbank, African Trade Report / AfCFTA Secretariat<\/td><td><span class=\"placeholder\">[YEAR]<\/span><\/td><td><span class=\"placeholder\">[DATE]<\/span><\/td><td>corridor-intelligence, policy-and-regulation<\/td><td><span class=\"chip chip-progress\">Pending verification<\/span><\/td><\/tr>\n          <tr><td>S-012<\/td><td>Corridor cost stack baseline for the proposed pilot corridor<\/td><td>EKORails LTD internal modelling, method published<\/td><td><span class=\"placeholder\">[PERIOD]<\/span><\/td><td>\u2014<\/td><td>ekorails.com/corridors<\/td><td><span class=\"chip chip-planned\">Estimate \u2014 method not yet published<\/span><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n\n    <div class=\"callout callout--gold\" style=\"margin-top:var(--s-5)\">\n      <h3>Claims we do not make<\/h3>\n      <p>The following statements are not published on either website because they are unsupported,\n        misleading, or comparative attacks rather than analysis: that PAPSS has near-zero adoption; that\n        any product is a &ldquo;PAPSS replacement&rdquo;; that SWIFT universally takes three to five\n        business days; that stablecoin settlement eliminates FX spread loss entirely; that costs are\n        &ldquo;cents on the dollar&rdquo; without published modelling; that every revenue dollar stays in\n        Africa; that every transaction is compliant; that architecture is complete; that any corridor is\n        active; or that any corridor is the largest of its kind or carries a multiple of another, absent\n        a cited dataset. Where an earlier EKORails or ECO-branded publication made such a claim, it is\n        withdrawn.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"sources_corrections\">\n  <div class=\"shell shell-narrow\">\n    <h2 id=\"corrections\" style=\"font-size:var(--step-2)\">Corrections<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>If you believe something published here is wrong, tell us. Corrections are made promptly, the\n        article&rsquo;s &ldquo;last updated&rdquo; date changes, and material corrections are noted at\n        the foot of the piece so the change is visible rather than silent.<\/p>\n      <p>Email <a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a> with the page,\n        the statement and, where possible, the source you believe is authoritative.<\/p>\n      <p>Corrections that touch the regulatory status of EKORails LTD are additionally reviewed by the\n        named compliance officer before the change is published.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" he der>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"ekorails_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">Disclosure<\/p>\n    <h1>EKORails LTD.<\/h1>\n    <p class=\"hero-lede\">The company that operates this research platform, what it is building, and\n      exactly what its regulatory status is \u2014 stated here rather than left for a reader to discover.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"ekorails_body\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div class=\"prose article-body\">\n        <h2 id=\"what\">What EKORails is building<\/h2>\n        <p>EKORails LTD is developing a compliance-first settlement and interoperability platform\n          designed to help regulated institutions and businesses move value across selected African and\n          global trade corridors.<\/p>\n        <p>In the terms used elsewhere on this site, it is being designed as an orchestration and record\n          layer: it coordinates the sequence of a cross-border transaction, enforces agreed controls\n          before an instruction is routed, and holds an append-only record of what happened. It is not\n          designed to hold customer funds, act as principal in currency conversion, provide settlement\n          finality or operate a payout licence \u2014 those functions remain with licensed institutions.<\/p>\n        <p>The platform is in development. No capability is operating in production and no corridor is\n          operating.<\/p>\n\n        <h2 id=\"status\">Regulatory status<\/h2>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <p>EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox.\n            Participation and all proposed pilot activities remain subject to regulatory review and\n            approval.<\/p>\n          <p style=\"margin-top:var(--s-3)\">EKORails LTD is not licensed, authorised, approved, endorsed\n            or supervised by the Central Bank of Nigeria or by any other financial services regulator,\n            and holds no payment services, banking, e-money or money transmission licence in any\n            jurisdiction.<\/p>\n        <\/div>\n        <p>The current stage-by-stage status is published on\n          <a href=\"https://ekorails.com/pilot-and-regulatory-pathway\">the EKORails regulatory pathway\n          page<\/a> and is only advanced when documentary evidence supports it.<\/p>\n\n        <h2 id=\"relationship\">The relationship between the two platforms<\/h2>\n        <p>EKORails.com is the corporate and platform website: what the company is building, its\n          regulatory pathway, its compliance framework and how to partner with it.<\/p>\n        <p>EkoInfrastructure.com is the research, policy and market-intelligence platform. It explains\n          the market rather than selling into it, and it is where the company&rsquo;s claims about the\n          market can be checked against sources.<\/p>\n        <p>The separation is editorial, not legal: both are operated by EKORails LTD. What the separation\n          buys a reader is that research pages are held to the editorial standards published here, and\n          are not written to support commercial announcements.<\/p>\n\n        <h2 id=\"conflict\">How we handle the conflict<\/h2>\n        <p>An operator with a commercial interest publishing research about its own market has a\n          conflict. Three practices manage it, and they are checkable.<\/p>\n        <ul>\n          <li><strong>Disclosure on every page.<\/strong> The footer of every page on this site states who\n            operates it and what their regulatory status is.<\/li>\n          <li><strong>Fair treatment of alternatives.<\/strong> Where an existing system serves a corridor\n            well, we say so \u2014 including where that makes the commercial case for EKORails weaker.<\/li>\n          <li><strong>Separate claim standards.<\/strong> Statements about EKORails&rsquo; own status and\n            capability are held to a documentary evidence standard, reviewed by the named compliance\n            officer before publication.<\/li>\n        <\/ul>\n        <p>If you think a piece here reads as advocacy rather than analysis, tell us at\n          <a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a>. That feedback is\n          treated as a correction request.<\/p>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <div class=\"bridge-eko\">\n          <div>\n            <h2 style=\"font-size:var(--step-1)\">EKORails.com<\/h2>\n            <p>Platform, corridors, compliance framework and partnership.<\/p>\n            <p style=\"margin-top:var(--s-3)\"><a class=\"btn btn-solid\" style=\"background:var(--ivory);color:var(--navy-900)\" href=\"https://ekorails.com\" data-cta=\"sidebar_ekorails\">Visit EKORails<\/a><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>Key pages<\/h3>\n          <ul class=\"card-list\" style=\"margin-top:.6rem\">\n            <li><a href=\"https://ekorails.com/platform\">Platform architecture<\/a><\/li>\n            <li><a href=\"https://ekorails.com/platform#boundary\">System boundary<\/a><\/li>\n            <li><a href=\"https://ekorails.com/pilot-and-regulatory-pathway\">Regulatory pathway<\/a><\/li>\n            <li><a href=\"https://ekorails.com/compliance-and-risk\">Compliance and risk<\/a><\/li>\n            <li><a href=\"https://ekorails.com/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li>\n          <\/ul>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages ins and vostro, RTGS, switch, corridor, stablecoin and more.\">\n<meta name=\"robots\" content=\"index,follow,max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://ekoinfrastructure.com/glossary\">\n<meta name=\"theme-color\" content=\"#F8F6F1\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"Eko Infrastructure\">\n<meta property=\"og:title\" content=\"Glossary | Payments and settlement terms | Eko Infrastructure\">\n<meta property=\"og:description\" content=\"Plain definitions of settlement and payments terminology: clearing, settlement, finality, nostro and vostro, RTGS, switch, corridor, stablecoin and more.\">\n<meta property=\"og:url\" content=\"https://ekoinfrastructure.com/glossary\">\n<meta property=\"og:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n<meta property=\"og:image:alt\" content=\"Eko Infrastructure \u2014 research and intelligence for African settlement infrastructure.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Glossary | Payments and settlement terms | Eko Infrastructure\">\n<meta name=\"twitter:description\" content=\"Plain definitions of settlement and payments terminology: clearing, settlement, finality, nostro and vostro, RTGS, switch, corridor, stablecoin and more.\">\n<meta name=\"twitter:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"glossary_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">Reference<\/p>\n    <h1>Glossary.<\/h1>\n    <p class=\"hero-lede\">Terms that get used loosely, defined precisely. Where a term is contested or\n      used differently across jurisdictions, we say so rather than picking the convenient meaning.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"glossary_body\">\n  <div class=\"shell\">\n    <nav class=\"glossary-nav\" aria-label=\"Jump to letter\">\n      <a href=\"#a\">A<\/a><a href=\"#c\">C<\/a><a href=\"#d\">D<\/a><a href=\"#f\">F<\/a><a href=\"#i\">I<\/a>\n      <a href=\"#k\">K<\/a><a href=\"#l\">L<\/a><a href=\"#n\">N<\/a><a href=\"#o\">O<\/a><a href=\"#p\">P<\/a>\n      <a href=\"#r\">R<\/a><a href=\"#s\">S<\/a><a href=\"#t\">T<\/a><a href=\"#v\">V<\/a>\n    <\/nav>\n\n    <div class=\"glossary-group\" id=\"a\"><h2>A<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>AML<\/dt><dd>Anti-money laundering. The body of law, regulation and controls intended to prevent the financial system being used to launder the proceeds of crime.<\/dd><\/div>\n        <div><dt>Authorised dealer<\/dt><dd>An institution permitted by a central bank to deal in foreign exchange. The term and its scope vary by jurisdiction.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"c\"><h2>C<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>CFT<\/dt><dd>Counter-financing of terrorism. Usually paired with AML in regulation and in a firm&rsquo;s programme.<\/dd><\/div>\n        <div><dt>Clearing<\/dt><dd>The transmission, reconciliation and confirmation of payment instructions between institutions, and the calculation of the resulting obligations. Distinct from settlement.<\/dd><\/div>\n        <div><dt>Correspondent banking<\/dt><dd>An arrangement in which one bank holds an account for another so the second can reach a market where it has no presence.<\/dd><\/div>\n        <div><dt>Corridor<\/dt><dd>A directional pair of markets between which value moves \u2014 for example payments from market A to market B. A corridor has its own participants, rules, costs and frictions, and behaves differently in each direction.<\/dd><\/div>\n        <div><dt>Cut-off time<\/dt><dd>The time after which an instruction will be processed on the following business day in a given system or market. Cut-offs across time zones are a common and under-appreciated source of delay.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"d\"><h2>D<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>De-risking<\/dt><dd>The withdrawal of correspondent or customer relationships by institutions judging the compliance cost or risk to be too high, rather than in response to a specific finding.<\/dd><\/div>\n        <div><dt>Due diligence<\/dt><dd>The verification and risk assessment a regulated institution performs on a customer or counterparty, at onboarding and on an ongoing basis.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"f\"><h2>F<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Finality<\/dt><dd>The point at which a transfer of value becomes irrevocable and unconditional. Defined by system rules and by governing law, not by how quickly a balance updates on a screen.<\/dd><\/div>\n        <div><dt>FX spread<\/dt><dd>The difference between the rate at which a party will buy a currency and the rate at which it will sell, or between the rate given to a customer and a reference rate. Compensation for holding and pricing currency risk. It can be moved or made visible; it cannot be conjured away.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"i\"><h2>I<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Idempotency<\/dt><dd>A property of an operation such that repeating it produces no additional effect. Essential in payments, where a retried instruction must never create a second payment.<\/dd><\/div>\n        <div><dt>Interoperability<\/dt><dd>The ability of separate systems to work together to complete a transaction end to end, including the data, rules and legal arrangements that make that possible \u2014 not only a technical connection.<\/dd><\/div>\n        <div><dt>ISO 20022<\/dt><dd>An international standard for financial messaging that carries structured party, purpose and remittance data. Widely adopted, with staged migration across markets.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"k\"><h2>K<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>KYB<\/dt><dd>Know your business. Verification of a business counterparty: legal existence, ownership, control and the nature of its activity.<\/dd><\/div>\n        <div><dt>KYC<\/dt><dd>Know your customer. Verification of a customer&rsquo;s identity and risk profile.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"l\"><h2>L<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Last mile<\/dt><dd>The final leg of a cross-border payment, in which a licensed institution credits the beneficiary through domestic rails. Frequently where corridor propositions fail.<\/dd><\/div>\n        <div><dt>Liquidity provider<\/dt><dd>A party willing to hold and exchange currencies at a quoted price and size, taking a position in return for compensation.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"n\"><h2>N<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Netting<\/dt><dd>Offsetting obligations between parties so that only the net amount is settled. Reduces the value that must move, at the cost of concentrating exposure until settlement occurs.<\/dd><\/div>\n        <div><dt>Nostro / vostro<\/dt><dd>Two views of the same correspondent account. Nostro is &ldquo;our account with you&rdquo;; vostro is &ldquo;your account with us&rdquo;.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"o\"><h2>O<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Orchestration<\/dt><dd>Coordinating the sequence of dependent actions performed by different parties in a transaction, and holding its state until every leg completes or is unwound. Orchestration is not settlement.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"p\"><h2>P<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>PAPSS<\/dt><dd>The Pan-African Payment and Settlement System, developed with Afreximbank and African central banks to enable payments between participating institutions in local currencies. <a href=\"/research/what-papss-does\">Full explainer<\/a>.<\/dd><\/div>\n        <div><dt>Payout institution<\/dt><dd>The licensed institution in the receiving market that credits the beneficiary.<\/dd><\/div>\n        <div><dt>PSP<\/dt><dd>Payment service provider. A licensing category whose exact scope varies by jurisdiction.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"r\"><h2>R<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Regulatory sandbox<\/dt><dd>A supervised arrangement permitting a defined test with defined participants, within limits and subject to reporting. Not a licence, and not an endorsement.<\/dd><\/div>\n        <div><dt>RTGS<\/dt><dd>Real-time gross settlement. A system in which each instruction settles individually and immediately, typically in central bank money, removing netting risk at the cost of higher liquidity requirements.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"s\"><h2>S<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Sanctions screening<\/dt><dd>Checking parties and payment data against applicable sanctions and watchlists at onboarding and at transaction time.<\/dd><\/div>\n        <div><dt>Settlement<\/dt><dd>The transfer of value that discharges an obligation between parties. Distinct from messaging, clearing, conversion and payout.<\/dd><\/div>\n        <div><dt>Settlement asset<\/dt><dd>The instrument in which settlement occurs \u2014 central bank money, commercial bank money, or another asset agreed by the parties and permitted by the applicable rules.<\/dd><\/div>\n        <div><dt>Stablecoin<\/dt><dd>A token intended to hold a constant value against a reference asset, usually a currency. Regulatory treatment differs sharply by jurisdiction and continues to change. A stablecoin does not remove the need for currency conversion at either end of a corridor.<\/dd><\/div>\n        <div><dt>Switch<\/dt><dd>Domestic infrastructure routing transactions between institutions within a market, often operating the domestic card and transfer schemes.<\/dd><\/div>\n        <div><dt>SWIFT<\/dt><dd>A financial messaging network used by institutions to exchange standardised instructions. It is not itself clearing, conversion or settlement. <a href=\"/research/swift-is-a-messaging-network\">Full explainer<\/a>.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"t\"><h2>T<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Transaction monitoring<\/dt><dd>Ongoing analysis of activity against expected patterns and rules, raising alerts for review. No monitoring programme detects all illicit activity.<\/dd><\/div>\n        <div><dt>Travel rule<\/dt><dd>The requirement that specified originator and beneficiary information accompanies a transfer, so that each institution in the chain receives complete data.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <div class=\"glossary-group\" id=\"v\"><h2>V<\/h2>\n      <dl class=\"deflist\">\n        <div><dt>Velocity limit<\/dt><dd>A cap on the frequency or cumulative value of transactions over a period, applied per customer, beneficiary or corridor as a control.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n\n    <p class=\"small muted\" style=\"margin-top:var(--s-6)\">Suggest a definition or a correction:\n      <a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a>. Definitions are\n      reviewed on the cycle described in our <a href=\"/about#editorial\">editorial standards<\/a>.<\/p>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allo esearch<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"research_hero\">\n  <div class=\"shell\">\n    <div class=\"hero-grid\">\n      <div>\n        <p class=\"eyebrow\">Eko Infrastructure<\/p>\n        <h1>Research and intelligence for African settlement infrastructure.<\/h1>\n        <p class=\"hero-lede\">Clearing, settlement, corridors, compliance and payment policy \u2014 explained\n          carefully, with sources, dates and named authors. Including, often, the finding that an\n          existing system already does the job well.<\/p>\n        <div class=\"btn-row\" style=\"margin-top:var(--s-5)\">\n          <a class=\"btn btn-solid\" href=\"/settlement-explained\" data-cta=\"hero_settlement\">Start with settlement<\/a>\n          <a class=\"btn btn-ghost\" href=\"/data-and-sources\" data-cta=\"hero_sources\">See our sources<\/a>\n        <\/div>\n      <\/div>\n      <div>\n        <div class=\"callout\">\n          <h2>Who publishes this<\/h2>\n          <p>Eko Infrastructure is operated by EKORails LTD, a company developing settlement\n            infrastructure. It is a commercially operated knowledge platform, not an independent\n            academic or standards body, and it should be read with that interest in mind.<\/p>\n          <p style=\"margin-top:var(--s-3)\">Our response to that is method: every claim is sourced, every\n            piece is dated and revision-tracked, and where a competing system performs better than ours\n            would, we say so. <a href=\"/about#editorial\">Editorial standards<\/a>.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"research_topics\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Topics<\/p>\n      <h2>Five areas we cover.<\/h2>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card\">\n        <p class=\"card-index\">01<\/p>\n        <h3><a href=\"/settlement-explained\">Settlement explained<\/a><\/h3>\n        <p>What settlement actually means, how it differs from clearing, and the mechanics of\n          correspondent banking, FX liquidity, settlement finality and stable-value settlement models.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">02<\/p>\n        <h3><a href=\"/corridor-intelligence\">Corridor intelligence<\/a><\/h3>\n        <p>How to read a trade corridor: participants, flows, costs, frictions, the last mile, and the\n          data you can and cannot get about any of them.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">03<\/p>\n        <h3><a href=\"/policy-and-regulation\">Policy and regulation<\/a><\/h3>\n        <p>Regulatory sandboxes, licensing categories, AML and CFT expectations, data protection and the\n          policy architecture around African payment systems.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">04<\/p>\n        <h3><a href=\"/technology\">Technology<\/a><\/h3>\n        <p>Messaging standards, compliance architecture, transaction monitoring, auditability and data\n          sovereignty \u2014 the engineering behind the policy.<\/p>\n      <\/article>\n      <article class=\"card\">\n        <p class=\"card-index\">05<\/p>\n        <h3><a href=\"/glossary\">Glossary and reference<\/a><\/h3>\n        <p>Plain definitions of the terms that get used loosely: clearing, settlement, finality,\n          nostro and vostro, RTGS, switch, corridor, stablecoin, orchestration.<\/p>\n      <\/article>\n      <article class=\"card card--flat\" style=\"justify-content:center\">\n        <h3>Search the archive<\/h3>\n        <p>Full-text search across every article, explainer and definition on this site.<\/p>\n        <p><a class=\"btn btn-solid\" href=\"/search\" data-cta=\"topics_search\">Search<\/a><\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"research_latest\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Latest research<\/p>\n      <h2>Recent pieces.<\/h2>\n    <\/div>\n\n    <article class=\"article-card\">\n      <div class=\"article-meta\">\n        <span class=\"topic\">Settlement<\/span>\n        <span>Explainer<\/span>\n        <span>12 min read<\/span>\n        <span>Published <span class=\"placeholder\">[DATE]<\/span><\/span>\n      <\/div>\n      <div>\n        <h3><a href=\"/research/clearing-versus-settlement\">Clearing versus settlement: the distinction that explains most cross-border confusion<\/a><\/h3>\n        <p>Messaging, clearing, conversion, settlement and payout are five different things performed by\n          different parties under different rules. Most disagreements about what a payment system\n          &ldquo;does&rdquo; dissolve once the five are separated.<\/p>\n      <\/div>\n    <\/article>\n\n    <article class=\"article-card\">\n      <div class=\"article-meta\">\n        <span class=\"topic\">Policy<\/span>\n        <span>Explainer<\/span>\n        <span>10 min read<\/span>\n        <span>Published <span class=\"placeholder\">[DATE]<\/span><\/span>\n      <\/div>\n      <div>\n        <h3><a href=\"/research/what-papss-does\">What PAPSS does, where it operates, and where private platforms may complement it<\/a><\/h3>\n        <p>A factual account of the Pan-African Payment and Settlement System: what it was built to do,\n          who participates, how it settles, and the honest limits of what any single system can solve\n          for a specific corridor.<\/p>\n      <\/div>\n    <\/article>\n\n    <article class=\"article-card\">\n      <div class=\"article-meta\">\n        <span class=\"topic\">Technology<\/span>\n        <span>Explainer<\/span>\n        <span>9 min read<\/span>\n        <span>Published <span class=\"placeholder\">[DATE]<\/span><\/span>\n      <\/div>\n      <div>\n        <h3><a href=\"/research/swift-is-a-messaging-network\">SWIFT is a messaging network: what that means for anyone comparing payment systems<\/a><\/h3>\n        <p>SWIFT is frequently described as though it moves money. It does not. Understanding what it\n          carries \u2014 and what banks do with what it carries \u2014 is a prerequisite for any serious\n          comparison of settlement options.<\/p>\n      <\/div>\n    <\/article>\n\n    <article class=\"article-card\">\n      <div class=\"article-meta\">\n        <span class=\"topic\">Corridors<\/span>\n        <span>Method<\/span>\n        <span>11 min read<\/span>\n        <span>Published <span class=\"placeholder\">[DATE]<\/span><\/span>\n      <\/div>\n      <div>\n        <h3><a href=\"/research/reading-a-trade-corridor\">How to read a trade corridor: a method, and what the data will not tell you<\/a><\/h3>\n        <p>A repeatable way to assess a corridor \u2014 participants, flows, cost stack, friction points, last\n          mile and regulatory perimeter \u2014 with explicit notes on where reliable data ends and estimation\n          begins.<\/p>\n      <\/div>\n    <\/article>\n\n    <p class=\"small muted\" style=\"margin-top:var(--s-5)\">Publication dates are shown as placeholders\n      pending editorial sign-off. No article is published on this site without an author, a date and a\n      source list.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"research_bridge\">\n  <div class=\"shell\">\n    <div class=\"bridge-eko\">\n      <div>\n        <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Disclosure<\/p>\n        <h2>This platform is operated by EKORails LTD.<\/h2>\n        <p>EKORails LTD is developing a compliance-first settlement and interoperability platform. It has\n          applied to participate in the Central Bank of Nigeria Regulatory Sandbox; participation and all\n          proposed pilot activities remain subject to regulatory review and approval. It is not licensed\n          or supervised by any financial services regulator.<\/p>\n      <\/div>\n      <div class=\"btn-row\">\n        <a class=\"btn btn-solid\" style=\"background:var(--ivory);color:var(--navy-900)\" href=\"/ekorails\" data-cta=\"bridge_ekorails\">About EKORails<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\ "7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"policy_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">Policy and regulation<\/p>\n    <h1>Policy and regulation.<\/h1>\n    <p class=\"hero-lede\">The regulatory architecture around cross-border payments, described as it is\n      rather than as builders would prefer it to be. Regulation is the constraint that makes settlement\n      infrastructure trustworthy, not an obstacle to route around.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"policy_body\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div class=\"prose article-body\">\n        <h2 id=\"sandboxes\">Regulatory sandboxes<\/h2>\n        <p>A sandbox is a supervised testing arrangement. A regulator permits a firm to test a defined\n          proposition with a defined participant group, within limits \u2014 value caps, volume caps, a\n          duration \u2014 and subject to reporting. The regulator retains the power to stop the test.<\/p>\n        <p>Four things a sandbox is not, each of which is regularly misrepresented in market\n          communications:<\/p>\n        <ul>\n          <li>It is not a commercial operating licence.<\/li>\n          <li>It is not permission to serve the general public.<\/li>\n          <li>It is not an endorsement, approval or recommendation of the firm by the regulator.<\/li>\n          <li>It is not a guarantee that authorisation will follow.<\/li>\n        <\/ul>\n        <p>The distinction between applying to a sandbox, being admitted to one, and holding a licence is\n          the single most commonly blurred line in this sector. A firm that has applied has done exactly\n          that and nothing more.<\/p>\n        <p>The operator of this platform, EKORails LTD, has applied to participate in the Central Bank of\n          Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to\n          regulatory review and approval. Its current status is published at\n          <a href=\"https://ekorails.com/pilot-and-regulatory-pathway\">ekorails.com<\/a>.<\/p>\n\n        <h2 id=\"licensing\">Licensing categories<\/h2>\n        <p>Payment activity is not one licence. Different jurisdictions define different categories, and\n          an entity commonly needs several, or needs partners who hold them. Categories that recur across\n          African markets include payment service provider or payment solution service provider licences;\n          international money transfer operator authorisations; switching and processing licences;\n          e-money issuance; and banking licences.<\/p>\n        <p>Two practical consequences follow. First, the question &ldquo;are they licensed?&rdquo; is\n          incomplete without &ldquo;for what activity, in which market?&rdquo;. Second, an infrastructure\n          layer that does not itself hold funds or convert currency may sit outside some categories\n          entirely \u2014 but only if the boundary is genuinely maintained in the design, not merely in the\n          marketing.<\/p>\n        <p><span class=\"placeholder\">[CONFIRM \u2014 current licensing category table by market, with regulator source and date]<\/span><\/p>\n\n        <h2 id=\"aml\">AML and CFT expectations<\/h2>\n        <p>The baseline is set internationally by the FATF Recommendations and implemented by national\n          law and regulator guidance. In practice that means a documented risk assessment; customer and\n          business due diligence proportionate to risk; sanctions screening; ongoing transaction\n          monitoring; suspicious activity reporting; record keeping; a named responsible officer;\n          training; and independent testing.<\/p>\n        <p>For cross-border payments the requirement that most often bites is the transmission of complete\n          originator and beneficiary information with the payment. Chains that lose that data create\n          obligations for every downstream institution and produce the compliance holds that customers\n          experience as unexplained delay.<\/p>\n\n        <h2 id=\"data-protection\">Data protection<\/h2>\n        <p>Payment data is personal data. Nigeria&rsquo;s Data Protection Act 2023 established a\n          statutory regime and a commission with supervisory powers; other markets in the region have\n          their own regimes at varying stages of implementation, and European or UK rules may also apply\n          depending on where an entity or its processors are established.<\/p>\n        <p>For corridor design this affects lawful basis, minimisation, retention, cross-border transfer\n          mechanisms and the handling of data subject rights \u2014 and it affects them in both markets of the\n          corridor simultaneously, which is the part most often underestimated.<\/p>\n        <p><span class=\"placeholder\">[CONFIRM \u2014 current data protection regime status by market, with source and date]<\/span><\/p>\n\n        <h2 id=\"regional\">Regional and continental policy<\/h2>\n        <p>Continental initiatives shape what is possible at corridor level. The African Continental Free\n          Trade Area addresses trade rules; the Pan-African Payment and Settlement System addresses\n          payment and settlement between participating institutions in local currencies; regional\n          economic communities pursue their own integration programmes.<\/p>\n        <p>These are not marketing backdrops. They determine which routes exist, which currencies can be\n          settled in, and which institutions can reach each other \u2014 and a corridor proposition that does\n          not engage with them seriously is unlikely to survive contact with a supervisor.<\/p>\n        <p><a class=\"link-arrow\" href=\"/research/what-papss-does\">What PAPSS does, factually<\/a><\/p>\n\n        <h2 id=\"how-to-read\">How to read a firm&rsquo;s regulatory claims<\/h2>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>Five questions<\/h3>\n          <ol style=\"margin-top:.6rem;padding-left:1.3rem\">\n            <li>Which legal entity holds the status, and is it the entity you would contract with?<\/li>\n            <li>Is the status an application, an admission to a test, or an authorisation?<\/li>\n            <li>Which activities does it cover, in which market?<\/li>\n            <li>Which functions are performed by licensed partners rather than by the firm?<\/li>\n            <li>Can the firm show you the document, with a date?<\/li>\n          <\/ol>\n        <\/div>\n        <p>These questions apply to the operator of this platform exactly as they apply to anyone else.<\/p>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <nav class=\"toc\" aria-label=\"On this page\">\n          <h2>On this page<\/h2>\n          <ol>\n            <li><a href=\"#sandboxes\">Regulatory sandboxes<\/a><\/li>\n            <li><a href=\"#licensing\">Licensing categories<\/a><\/li>\n            <li><a href=\"#aml\">AML and CFT<\/a><\/li>\n            <li><a href=\"#data-protection\">Data protection<\/a><\/li>\n            <li><a href=\"#regional\">Regional policy<\/a><\/li>\n            <li><a href=\"#how-to-read\">Reading regulatory claims<\/a><\/li>\n          <\/ol>\n        <\/nav>\n      <\/aside>\n    <\/div>\n    <div class=\"sources\">\n      <h2>Sources<\/h2>\n      <ol>\n        <li>Financial Action Task Force, The FATF Recommendations. <span class=\"placeholder\">[CONFIRM \u2014 edition, year and URL]<\/span><\/li>\n        <li>Central Bank of Nigeria \u2014 regulatory sandbox framework and payment system guidelines. <span class=\"placeholder\">[CONFIRM \u2014 document, year and URL]<\/span><\/li>\n        <li>Nigeria Data Protection Act 2023 and Nigeria Data Protection Commission guidance. <span class=\"placeholder\">[CONFIRM \u2014 URL and date]<\/span><\/li>\n        <li>African Continental Free Trade Area Secretariat. <span class=\"placeholder\">[CONFIRM \u2014 publication and URL]<\/span><\/li>\n      <\/ol>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.35)\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#6FC3A2\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#6FC3A2\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#6FC3A2\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times ttlement and payout are five different functions performed by different parties. Separating them resolves most arguments.\">\n<meta name=\"twitter:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<article class=\"section\" data-section=\"article\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div>\n        <header class=\"article-header\">\n          <p class=\"eyebrow\">Settlement \u00b7 Explainer<\/p>\n          <h1>Clearing versus settlement: the distinction that explains most cross-border confusion<\/h1>\n          <p class=\"lede\">Messaging, clearing, conversion, settlement and payout are five different\n            things, performed by different parties, under different rules. Most disagreements about what\n            a payment system &ldquo;does&rdquo; dissolve once they are separated.<\/p>\n          <p class=\"byline\">\n            <span>By <strong>Eko Infrastructure editorial team<\/strong><\/span>\n            <span>Published <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>Last updated <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>12 min read<\/span>\n            <span class=\"review-badge\">Source-checked<\/span>\n          <\/p>\n        <\/header>\n\n        <div class=\"prose article-body\">\n          <p>Ask five people in a payments conversation what happens when money moves across a border and\n            you will get five answers that are each partly right. That is not carelessness. It is because\n            the phrase &ldquo;a payment&rdquo; bundles together at least five distinct functions, and\n            different specialists have different ones in mind.<\/p>\n          <p>Separating them is not pedantry. It determines which system is relevant to a given problem,\n            which institution bears which risk, and whether a proposed improvement addresses the actual\n            constraint or merely relocates it.<\/p>\n\n          <h2>The five functions<\/h2>\n          <p><strong>Messaging<\/strong> is the transmission of a standardised instruction between\n            institutions. It says who is paying whom, how much, in what currency, for what purpose, with\n            what references. Messaging moves information, not value.<\/p>\n          <p><strong>Clearing<\/strong> is the reconciliation and confirmation of those instructions and\n            the calculation of the resulting obligations. It establishes who owes what to whom. Clearing\n            may net many instructions into a single obligation per participant per cycle.<\/p>\n          <p><strong>Conversion<\/strong> is the exchange of one currency for another at a price, performed\n            by a party who holds both and takes a position. Conversion has a cost because holding and\n            pricing currency risk has a cost.<\/p>\n          <p><strong>Settlement<\/strong> is the transfer of value that discharges the obligation, in an\n            agreed settlement asset, between accounts the institutions recognise. Settlement is the\n            moment the obligation is extinguished.<\/p>\n          <p><strong>Payout<\/strong> is the domestic credit to the beneficiary&rsquo;s account, performed\n            by a licensed institution on domestic rails within domestic cut-off times.<\/p>\n\n          <h2>Why the distinction matters commercially<\/h2>\n          <p>Consider a common complaint: &ldquo;the payment took four days&rdquo;. Which of the five\n            functions consumed the four days? If it was messaging, the fix is a data or connectivity\n            problem. If it was clearing, the answer may be a netting cycle that runs once a day by design.\n            If it was compliance holds arising from incomplete party data in the message, the fix is\n            upstream data quality, not a faster network. If it was conversion waiting on currency\n            availability, no technology changes that. If it was payout arriving after a domestic cut-off,\n            the constraint is a local operating window.<\/p>\n          <p>Five different diagnoses, five different remedies, one symptom. A vendor who cannot say which\n            one they address is not offering a solution; they are offering a slogan.<\/p>\n\n          <h2>Netting versus gross settlement<\/h2>\n          <p>Clearing systems that net obligations reduce the value that must move. If a hundred\n            instructions in both directions collapse into one net figure, only that figure needs to be\n            settled. That is efficient in liquidity terms, and it is why netting is used widely.<\/p>\n          <p>The cost is exposure between cycles. Until settlement occurs, participants carry obligations\n            to one another. Real-time gross settlement takes the opposite trade: each instruction settles\n            individually and immediately, typically in central bank money, which removes that exposure but\n            requires participants to hold more liquidity through the day.<\/p>\n          <p>Neither is better in the abstract. Systems choose different points on this trade for good\n            reasons, and a design that criticises another for its choice is usually ignoring the\n            constraint that produced it.<\/p>\n\n          <h2>Finality is a legal property<\/h2>\n          <p>The most consequential point, and the one most often skipped. Settlement finality is the\n            moment a transfer becomes irrevocable and unconditional \u2014 not reversible by the sender, by a\n            participant&rsquo;s insolvency, or by the operator. It is defined by the rules of the system\n            and by the law governing it.<\/p>\n          <p>A balance that updates instantly on a screen is not therefore final. A business releasing\n            goods against a credit that is not final is carrying a risk it has probably not priced.\n            Whenever a settlement design is presented, the question to ask is: at what point, under whose\n            rules, and under which law, does this become irrevocable?<\/p>\n\n          <h2>Applying the frame<\/h2>\n          <p>Once the five functions are separated, comparisons become tractable. A messaging network and\n            a settlement system are not competitors. A currency conversion service and a clearing system\n            are not substitutes. An orchestration layer that coordinates the sequence is not a settlement\n            system, whatever its marketing says, unless it provides finality \u2014 which requires legal\n            standing, not software.<\/p>\n          <p>The frame is also a useful test of any proposition, including ours. Which of the five does it\n            perform? Which does it depend on others to perform? If the answer is unclear, the design is\n            unclear.<\/p>\n\n          <div class=\"callout callout--gold\">\n            <h3>Disclosure and regulatory note<\/h3>\n            <p>Eko Infrastructure is operated by EKORails LTD, which is developing an orchestration and\n              record layer for cross-border transactions. EKORails LTD has applied to participate in the\n              Central Bank of Nigeria Regulatory Sandbox; participation and all proposed pilot activities\n              remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised,\n              approved, endorsed or supervised by any financial services regulator. Its proposed design\n              \u2014 including which of the five functions it does not perform \u2014 is published at\n              <a href=\"https://ekorails.com/platform#boundary\">ekorails.com/platform<\/a>. This article is\n              general information and is not financial, investment, legal or payment-services advice.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"sources\">\n          <h2>Sources<\/h2>\n          <ol>\n            <li>CPMI\u2013IOSCO, <em>Principles for Financial Market Infrastructures<\/em> \u2014 definitions of clearing, settlement and finality. <span class=\"placeholder\">[CONFIRM \u2014 edition, year, URL]<\/span> <span class=\"source-date\">Retrieved <span class=\"placeholder\">[DATE]<\/span><\/span><\/li>\n            <li>Bank for International Settlements, Committee on Payments and Market Infrastructures \u2014 cross-border payments programme material. <span class=\"placeholder\">[CONFIRM \u2014 publication, year, URL]<\/span><\/li>\n            <li>ISO 20022 \u2014 message standard documentation. <span class=\"placeholder\">[CONFIRM \u2014 URL]<\/span><\/li>\n          <\/ol>\n        <\/div>\n\n        <nav class=\"section--tight\" aria-label=\"Related articles\" style=\"padding-bottom:0\">\n          <h2 style=\"font-size:var(--step-1);margin-bottom:var(--s-3)\">Related<\/h2>\n          <ul class=\"card-list\">\n            <li><a href=\"/research/swift-is-a-messaging-network\">SWIFT is a messaging network: what that means for comparisons<\/a><\/li>\n            <li><a href=\"/research/what-papss-does\">What PAPSS does, where it operates, and where private platforms may complement it<\/a><\/li>\n            <li><a href=\"/settlement-explained\">Settlement explained \u2014 the full topic page<\/a><\/li>\n            <li><a href=\"/glossary\">Glossary: finality, netting, RTGS, nostro and vostro<\/a><\/li>\n          <\/ul>\n        <\/nav>\n      <\/div>\n\n      <aside class=\"sticky-side\">\n        <div class=\"callout\">\n          <h3>In one line<\/h3>\n          <p>Clearing establishes who owes what. Settlement is the transfer that extinguishes the\n            obligation. Everything else is messaging, conversion or payout.<\/p>\n        <\/div>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>On EKORails.com<\/h3>\n          <p><a href=\"https://ekorails.com/platform#lifecycle\">The proposed transaction lifecycle<\/a> \u2014\n            how these functions are sequenced in the EKORails design, and which parties own each.<\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/article>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy
