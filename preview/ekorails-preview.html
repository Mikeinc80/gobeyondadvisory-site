014 settlement infrastructure for African trade.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Pilot and Regulatory Pathway | EKORails LTD\">\n<meta name=\"twitter:description\" content=\"EKORails LTD has applied to the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to approval.\">\n<meta name=\"twitter:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"EKORails \u2014 home\">\n      <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"#08151F\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#08151F\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#14344B\">Rails<\/tspan><\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"pathway_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Pilot and regulatory pathway<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:22ch\">Applied. Under review. Nothing more than that.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">EKORails LTD has applied to\n      participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed\n      pilot activities remain subject to regulatory review and approval.<\/p>\n    <p class=\"hero-status\" style=\"max-width:74ch\">\n      <span aria-hidden=\"true\">\u25b2<\/span>\n      <span>EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central\n        Bank of Nigeria or by any other financial services regulator, and holds no payment services,\n        banking, e-money or money transmission licence in any jurisdiction.<\/span>\n    <\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"pathway_evidence\">\n  <div class=\"shell\">\n    <div class=\"split\">\n      <div>\n        <p class=\"eyebrow\">Our evidence standard<\/p>\n        <h2 style=\"font-size:var(--step-3)\">A stage is complete when we hold the document that proves it.<\/h2>\n      <\/div>\n      <div class=\"prose\">\n        <p>Regulatory status is the single easiest thing for an early-stage infrastructure company to\n          overstate, and the single most damaging thing to get wrong. So we apply one rule to this page.<\/p>\n        <p>A stage moves from pending to complete only when EKORails LTD holds written evidence of it \u2014\n          a certificate, an acknowledgement, a decision letter or an executed agreement \u2014 and the page\n          records the date it changed and what changed it.<\/p>\n        <p>If the Central Bank of Nigeria confirms a status, this page will state the exact status\n          granted, in the regulator&rsquo;s own terms, and nothing beyond it. Until then, this page says\n          applied.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--dark\" data-section=\"pathway_tracker\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Status tracker<\/p>\n      <h2>Six stages. Two started.<\/h2>\n    <\/div>\n    <div class=\"tracker\">\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">01 \u2014 Entity incorporated<\/p>\n        <p class=\"tracker-note\">EKORails LTD is the legal applicant and the operating entity for the\n          proposed platform. Jurisdiction of incorporation, company number, registered office and date:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <span class=\"chip chip-live\">Complete<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">02 \u2014 Sandbox application<\/p>\n        <p class=\"tracker-note\">Application prepared with supporting technical, compliance and\n          operational documentation, and submitted to the Central Bank of Nigeria Regulatory Sandbox.\n          Submission date and reference: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <span class=\"chip chip-progress\">Submitted<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">03 \u2014 Regulatory review<\/p>\n        <p class=\"tracker-note\">The regulator determines whether to admit the application, on what\n          scope and subject to what conditions. No decision, admission, approval or endorsement has been\n          received. EKORails does not publish expected decision dates.<\/p>\n        <span class=\"chip chip-planned\">Pending<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">04 \u2014 Partner integration<\/p>\n        <p class=\"tracker-note\">Technical and contractual integration with the licensed banking,\n          liquidity, settlement and payout partners required for the corridor. Partners are named\n          publicly only with written consent. <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <span class=\"chip chip-planned\">Not started<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">05 \u2014 Controlled pilot<\/p>\n        <p class=\"tracker-note\">A limited test with a defined participant set, value and volume caps,\n          agreed reporting and an agreed exit. Conducted only if and as approved.\n          <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/p>\n        <span class=\"chip chip-planned\">Not started<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">06 \u2014 Post-pilot licensing pathway<\/p>\n        <p class=\"tracker-note\">Any activity beyond an approved test would require the appropriate\n          authorisation or licence in each market of operation, obtained before that activity begins.<\/p>\n        <span class=\"chip chip-planned\">Not started<\/span>\n      <\/div>\n    <\/div>\n    <p class=\"small\" style=\"margin-top:var(--s-5);color:var(--on-dark-2)\">Tracker last reviewed:\n      <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 review date]<\/span>. Reviewed by the named\n      compliance officer under the pre-publication review process described in\n      <a href=\"/regulatory-disclaimer\">the regulatory disclaimer<\/a>.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"pathway_sandbox\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">What a sandbox is<\/p>\n      <h2>A supervised test with limits \u2014 not permission to operate.<\/h2>\n    <\/div>\n    <div class=\"grid grid-2\">\n      <div class=\"callout\">\n        <h3>What sandbox participation would mean<\/h3>\n        <ul class=\"card-list\" style=\"margin-top:.6rem\">\n          <li>Testing a defined proposition with a defined participant group.<\/li>\n          <li>Operating within value, volume and duration caps set by the regulator.<\/li>\n          <li>Reporting to the regulator at an agreed frequency and in an agreed format.<\/li>\n          <li>Supervision of the test, including the power to stop it.<\/li>\n          <li>A defined exit at the end of the test period.<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"callout callout--gold\">\n        <h3>What sandbox participation would not mean<\/h3>\n        <ul class=\"card-list\" style=\"margin-top:.6rem\">\n          <li>It is not a commercial operating licence.<\/li>\n          <li>It is not authorisation to serve the general public.<\/li>\n          <li>It is not an endorsement, approval or recommendation of EKORails by the regulator.<\/li>\n          <li>It is not a guarantee that a licence will follow.<\/li>\n          <li>It does not transfer regulated responsibilities from licensed partners to EKORails.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n    <div class=\"callout\" style=\"margin-top:var(--s-5)\">\n      <h3>How we will describe an outcome<\/h3>\n      <p>If admission is confirmed, this website will be updated to state the exact status granted by\n        the Central Bank of Nigeria, the date it was granted, the scope it covers and the conditions\n        attached, and will continue to state clearly that the status is not a commercial operating\n        licence unless the regulator says otherwise. If the application is unsuccessful or withdrawn,\n        this page will say so.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"pathway_pilot_design\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Proposed pilot design<\/p>\n      <h2>What we have asked to test.<\/h2>\n      <p>The parameters below are those set out in the filing. They are shown here so that partners and\n        reviewers can see the scale we are proposing, which is deliberately small.<\/p>\n    <\/div>\n    <dl class=\"deflist\">\n      <div><dt>Corridor<\/dt><dd>One corridor, originating in Nigeria. Counterparty market: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/dd><\/div>\n      <div><dt>Participants<\/dt><dd>A limited set of onboarded institutions and businesses, named in advance. <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 participant count as filed]<\/span><\/dd><\/div>\n      <div><dt>Transaction types<\/dt><dd>The institutional and business flows described on the <a href=\"/use-cases\">use cases<\/a> page, within the approved scope.<\/dd><\/div>\n      <div><dt>Value and volume caps<\/dt><dd><span class=\"placeholder\">[INSERT VERIFIED FIGURE \u2014 per-transaction, per-participant and aggregate caps as filed]<\/span><\/dd><\/div>\n      <div><dt>Duration<\/dt><dd><span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 proposed test duration]<\/span><\/dd><\/div>\n      <div><dt>Reporting<\/dt><dd>At the frequency and in the format agreed with the regulator, plus incident reporting within agreed timelines.<\/dd><\/div>\n      <div><dt>Success measures<\/dt><dd>Control effectiveness, audit completeness, screening accuracy, exception and repair rates, reconciliation match rate and adherence to reporting \u2014 not transaction volume.<\/dd><\/div>\n      <div><dt>Exit and wind-down<\/dt><dd>A documented plan for orderly termination that leaves no participant with an unresolved transaction.<\/dd><\/div>\n    <\/dl>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"pathway_cta\">\n  <div class=\"shell\">\n    <h2>Regulatory or supervisory enquiry?<\/h2>\n    <p>Enquiries from regulators, supervisors and policy institutions are routed directly to the named\n      compliance officer.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"/partners?type=regulator\" data-cta=\"pathway_regulator\">Regulatory Inquiry<\/a>\n      <a class=\"btn btn-on-dark\" href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy= as applied to participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central Bank of Nigeria or by any other financial services regulator, and does not hold a payment services, banking or money transmission licence in any jurisdiction. See the <a href=\"/regulatory-disclaimer\">Regulatory Disclaimer<\/a>.<\/p>\n    <\/div>\n    <div class=\"footer-legal\">\n      <p class=\"disclaimer\">EKORails LTD is developing financial infrastructure for institutional and enterprise use. Information on this website is provided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \u00b7 Registered office [CONFIRM WITH EKORAILS].<\/p>\n    <\/div>\n  <\/div>\n<\/footer>\n\n\n\n<script>\n(function(){\n  var t=document.querySelector('[data-nav-toggle]'),p=document.querySelector('[data-mobile-nav]');\n  if(t&&p){t.addEventListener('click',function(){var o=t.getAttribute('aria-expanded')==='true';\n    t.setAttribute('aria-expanded',String(!o));p.hidden=o;});}\n  var c=document.querySelector('[data-consent]');\n  if(c){c.hidden=false;c.addEventListener('click',function(e){\n    if(e.target.closest('[data-consent-choice]')) c.hidden=true;});}\n  document.addEventListener('click',function(e){\n    var a=e.target.closest('a'); if(!a) return;\n    var h=a.getAttribute('href')||'';\n    if(h.charAt(0)==='#') return;\n    e.preventDefault();\n    parent.postMessage({eko:'nav',href:h,host:a.hostname||''},'*');\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"},"/platform":{"t":"Platform | EKORails settlement and interoperability architecture","h":"<!DOCTYPE html>\n<html lang=\"en\" class=\"site-ekorails\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Platform | EKORails settlement and interoperability architecture<\/title>\n<meta name=\"description\" content=\"The proposed EKORails architecture: participants, transaction lifecycle, system boundary, integrations, ledger, settlement model, controls and resilience.\">\n<meta name=\"robots\" content=\"index,follow,max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://ekorails.com/platform\">\n<meta name=\"theme-color\" content=\"#08151F\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"EKORails\">\n<meta property=\"og:title\" content=\"Platform | EKORails settlement and interoperability architecture\">\n<meta property=\"og:description\" content=\"The proposed EKORails architecture: participants, transaction lifecycle, system boundary, integrations, ledger, settlement model, controls and resilience.\">\n<meta property=\"og:url\" content=\"https://ekorails.com/platform\">\n<meta property=\"og:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n<meta property=\"og:image:alt\" content=\"EKORails \u2014 settlement infrastructure for African trade.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Platform | EKORails settlement and interoperability architecture\">\n<meta name=\"twitter:description\" content=\"The proposed EKORails architecture: participants, transaction lifecycle, system boundary, integrations, ledger, settlement model, controls and resilience.\">\n<meta name=\"twitter:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"EKORails \u2014 home\">\n      <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"#08151F\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#08151F\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#14344B\">Rails<\/tspan><\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a class=\"is-active\" aria-current=\"page\" href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a class=\"is-active\" aria-current=\"page\" href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"platform_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Platform<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:22ch\">A coordination layer for regulated cross-border transactions.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">EKORails is being designed to\n      sit between the institutions that already hold licences, funds and market access \u2014 orchestrating\n      the sequence, enforcing the controls and holding the record, without taking on the functions that\n      licensed institutions are there to perform.<\/p>\n    <p class=\"hero-status\" style=\"max-width:70ch\">\n      <span aria-hidden=\"true\">\u25b2<\/span>\n      <span>The platform is in development. No component described on this page is operating in\n        production or carrying customer value. Component status labels are applied consistently\n        throughout.<\/span>\n    <\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"platform_overview\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div>\n        <h2 id=\"overview\" style=\"font-size:var(--step-3)\">Platform overview<\/h2>\n        <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n          <p>A cross-border business payment is not one action. It is a sequence of dependent actions\n            performed by different institutions under different rules, where any step can fail and the\n            whole must still be explainable afterwards.<\/p>\n          <p>Most of the difficulty in a corridor is not the movement of value itself. It is holding\n            that sequence together: knowing which party is responsible for the current step, what data\n            they need, what they returned, what the customer should be told, and what the supervisor\n            will later expect to see.<\/p>\n          <p>EKORails is being built as that coordination layer. It orchestrates the steps, enforces the\n            agreed controls before an instruction is routed, and writes an append-only record of every\n            state change. Funds, conversion, settlement finality and payout remain with licensed\n            institutions.<\/p>\n        <\/div>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <nav class=\"toc\" aria-label=\"On this page\">\n          <h2>On this page<\/h2>\n          <ol>\n            <li><a href=\"#overview\">Platform overview<\/a><\/li>\n            <li><a href=\"#participants\">Participants<\/a><\/li>\n            <li><a href=\"#lifecycle\">Transaction lifecycle<\/a><\/li>\n            <li><a href=\"#boundary\">System boundary<\/a><\/li>\n            <li><a href=\"#integration\">Integration options<\/a><\/li>\n            <li><a href=\"#api\">API and messaging layer<\/a><\/li>\n            <li><a href=\"#ledger\">Ledger and record-keeping<\/a><\/li>\n            <li><a href=\"#settlement\">Settlement model<\/a><\/li>\n            <li><a href=\"#controls\">Compliance controls<\/a><\/li>\n            <li><a href=\"#reporting\">Reporting<\/a><\/li>\n            <li><a href=\"#resilience\">Resilience and continuity<\/a><\/li>\n            <li><a href=\"#insolvency\">Insolvency and wind-down<\/a><\/li>\n            <li><a href=\"#data\">Data handling<\/a><\/li>\n            <li><a href=\"#responsibilities\">Partner responsibilities<\/a><\/li>\n          <\/ol>\n        <\/nav>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"platform_participants\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Participants<\/p>\n      <h2 id=\"participants\">Who is in a transaction, and what each one is for.<\/h2>\n    <\/div>\n    <div class=\"table-wrap\">\n      <table>\n        <caption>Proposed participant model. Roles reflect the design filed with the regulator and are subject to partner agreement.<\/caption>\n        <thead><tr><th scope=\"col\">Participant<\/th><th scope=\"col\">Role in the transaction<\/th><th scope=\"col\">Licensing expectation<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td><strong>Originating business or institution<\/strong><\/td><td>Submits the instruction, holds the commercial relationship with the payer, supplies payment references.<\/td><td>Regulated or verified enterprise, onboarded before use.<\/td><\/tr>\n          <tr><td><strong>Originating bank or payment institution<\/strong><\/td><td>Holds the payer&rsquo;s funds, confirms funding, executes the debit.<\/td><td>Licensed in the origination market.<\/td><\/tr>\n          <tr><td><strong>EKORails<\/strong><\/td><td>Orchestration, control enforcement, routing, status, audit record and reporting.<\/td><td>Technology and orchestration provider. No customer funds held. <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/td><\/tr>\n          <tr><td><strong>FX or liquidity counterparty<\/strong><\/td><td>Quotes and executes the conversion leg as principal.<\/td><td>Licensed bank, authorised dealer or equivalent.<\/td><\/tr>\n          <tr><td><strong>Settlement partner<\/strong><\/td><td>Effects settlement between institutions using the mechanism agreed for the corridor.<\/td><td>Licensed and approved for that mechanism.<\/td><\/tr>\n          <tr><td><strong>Payout institution<\/strong><\/td><td>Credits the beneficiary in the receiving market through domestic rails.<\/td><td>Licensed in the receiving market.<\/td><\/tr>\n          <tr><td><strong>Beneficiary business<\/strong><\/td><td>Receives value and the reference data needed to reconcile it.<\/td><td>Verified before first receipt.<\/td><\/tr>\n          <tr><td><strong>Regulator and supervisors<\/strong><\/td><td>Set scope and conditions; receive reporting.<\/td><td>Central Bank of Nigeria and other applicable authorities.<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"platform_lifecycle\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Transaction lifecycle<\/p>\n      <h2 id=\"lifecycle\">Eleven states, each of which can be evidenced.<\/h2>\n      <p>A transaction is only ever in one state. Every transition is written to the audit record with\n        the actor, the timestamp and the reason. Failure states are first-class: a transaction that\n        cannot proceed must resolve to a defined outcome, not disappear.<\/p>\n    <\/div>\n    <div class=\"table-wrap\">\n      <table>\n        <caption>Proposed transaction state model. Under development.<\/caption>\n        <thead><tr><th scope=\"col\">State<\/th><th scope=\"col\">Meaning<\/th><th scope=\"col\">Owner<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td><code>received<\/code><\/td><td>Instruction accepted and structurally valid.<\/td><td>EKORails<\/td><\/tr>\n          <tr><td><code>screening<\/code><\/td><td>Parties and payment data under compliance validation.<\/td><td>EKORails / compliance provider<\/td><\/tr>\n          <tr><td><code>held<\/code><\/td><td>Stopped for review; a case exists and an owner is assigned.<\/td><td>Compliance officer<\/td><\/tr>\n          <tr><td><code>authorised<\/code><\/td><td>Within limits, approved by workflow, funding confirmed.<\/td><td>EKORails / originating institution<\/td><\/tr>\n          <tr><td><code>quoted<\/code><\/td><td>Conversion rate obtained from a licensed counterparty.<\/td><td>FX partner<\/td><\/tr>\n          <tr><td><code>converting<\/code><\/td><td>Conversion executing as principal by that counterparty.<\/td><td>FX partner<\/td><\/tr>\n          <tr><td><code>settling<\/code><\/td><td>Settlement instruction issued to the settlement partner.<\/td><td>Settlement partner<\/td><\/tr>\n          <tr><td><code>settled<\/code><\/td><td>Settlement confirmed by the responsible licensed institution.<\/td><td>Settlement partner<\/td><\/tr>\n          <tr><td><code>paid_out<\/code><\/td><td>Beneficiary credited in the receiving market.<\/td><td>Payout institution<\/td><\/tr>\n          <tr><td><code>returned<\/code><\/td><td>Value returned to the payer after a failed leg, with reason.<\/td><td>Partners / EKORails<\/td><\/tr>\n          <tr><td><code>rejected<\/code><\/td><td>Not routed. Reason recorded and communicated.<\/td><td>EKORails / partners<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"platform_boundary\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">System boundary<\/p>\n      <h2 id=\"boundary\">What sits inside EKORails, and what does not.<\/h2>\n      <p>This is the diagram we expect every bank, regulator and security reviewer to test us against.\n        Anything in the centre column is ours to build and operate. Anything outside it depends on a\n        licensed or specialist third party.<\/p>\n    <\/div>\n    <figure class=\"boundary\">\n      <svg viewBox=\"0 0 960 460\" role=\"img\" aria-labelledby=\"bnd-t bnd-d\" style=\"width:100%;height:auto\">\n        <title id=\"bnd-t\">EKORails proposed system boundary<\/title>\n        <desc id=\"bnd-d\">Three columns. On the left, originating participants and their licensed\n          institutions. In the centre, the EKORails platform: API and messaging, orchestration and state\n          machine, compliance and screening orchestration, routing, ledger and audit record, and\n          reporting. On the right, licensed partners performing conversion, settlement, custody of funds\n          and local payout, plus supervisory reporting recipients. Funds custody, settlement finality,\n          conversion as principal and payout licences all sit outside the EKORails boundary.<\/desc>\n        <g font-family=\"IBM Plex Mono, monospace\" font-size=\"10\" letter-spacing=\"1\" fill=\"#5C6B75\">\n          <text x=\"20\" y=\"26\">ORIGINATION SIDE<\/text>\n          <text x=\"352\" y=\"26\">EKORAILS PLATFORM BOUNDARY<\/text>\n          <text x=\"760\" y=\"26\">LICENSED PARTNERS<\/text>\n        <\/g>\n        <!-- left column -->\n        <g>\n          <rect x=\"20\" y=\"46\" width=\"250\" height=\"64\" rx=\"4\" fill=\"#EFEBE3\" stroke=\"#5C6B75\" stroke-dasharray=\"4 3\"/>\n          <rect x=\"20\" y=\"126\" width=\"250\" height=\"64\" rx=\"4\" fill=\"#EFEBE3\" stroke=\"#5C6B75\" stroke-dasharray=\"4 3\"/>\n          <rect x=\"20\" y=\"206\" width=\"250\" height=\"64\" rx=\"4\" fill=\"#EFEBE3\" stroke=\"#5C6B75\" stroke-dasharray=\"4 3\"/>\n        <\/g>\n        <g font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"13\" fill=\"#14191E\">\n          <text x=\"36\" y=\"74\">Enterprise / institution<\/text>\n          <text x=\"36\" y=\"154\">Originating bank<\/text>\n          <text x=\"36\" y=\"234\">Identity &amp; screening vendors<\/text>\n        <\/g>\n        <g font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"11\" fill=\"#5C6B75\">\n          <text x=\"36\" y=\"92\">Submits instruction &amp; references<\/text>\n          <text x=\"36\" y=\"172\">Holds payer funds, confirms funding<\/text>\n          <text x=\"36\" y=\"252\">Verification, sanctions, watchlists<\/text>\n        <\/g>\n        <!-- centre boundary -->\n        <rect x=\"320\" y=\"40\" width=\"320\" height=\"392\" rx=\"6\" fill=\"rgba(14,107,78,.05)\" stroke=\"#0E6B4E\" stroke-width=\"1.6\"/>\n        <g>\n          <rect x=\"340\" y=\"62\" width=\"280\" height=\"52\" rx=\"4\" fill=\"rgba(14,107,78,.14)\" stroke=\"#0E6B4E\"/>\n          <rect x=\"340\" y=\"126\" width=\"280\" height=\"52\" rx=\"4\" fill=\"rgba(14,107,78,.14)\" stroke=\"#0E6B4E\"/>\n          <rect x=\"340\" y=\"190\" width=\"280\" height=\"52\" rx=\"4\" fill=\"rgba(14,107,78,.14)\" stroke=\"#0E6B4E\"/>\n          <rect x=\"340\" y=\"254\" width=\"280\" height=\"52\" rx=\"4\" fill=\"rgba(14,107,78,.14)\" stroke=\"#0E6B4E\"/>\n          <rect x=\"340\" y=\"318\" width=\"280\" height=\"52\" rx=\"4\" fill=\"rgba(14,107,78,.14)\" stroke=\"#0E6B4E\"/>\n          <rect x=\"340\" y=\"382\" width=\"280\" height=\"38\" rx=\"4\" fill=\"rgba(14,107,78,.08)\" stroke=\"#0E6B4E\" stroke-dasharray=\"4 3\"/>\n        <\/g>\n        <g font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"13\" fill=\"#0B2A20\">\n          <text x=\"356\" y=\"84\">API &amp; messaging layer<\/text>\n          <text x=\"356\" y=\"148\">Orchestration &amp; state machine<\/text>\n          <text x=\"356\" y=\"212\">Control enforcement &amp; case management<\/text>\n          <text x=\"356\" y=\"276\">Corridor routing &amp; partner selection<\/text>\n          <text x=\"356\" y=\"340\">Append-only ledger &amp; audit record<\/text>\n          <text x=\"356\" y=\"406\">Reporting &amp; extract service<\/text>\n        <\/g>\n        <g font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"11\" fill=\"#3B474F\">\n          <text x=\"356\" y=\"102\">REST + webhooks, ISO 20022-aligned messages<\/text>\n          <text x=\"356\" y=\"166\">One state per transaction, all transitions logged<\/text>\n          <text x=\"356\" y=\"230\">Limits, velocity, screening results, holds<\/text>\n          <text x=\"356\" y=\"294\">Approved routes only, selection recorded<\/text>\n          <text x=\"356\" y=\"358\">Immutable record; not a store of customer value<\/text>\n        <\/g>\n        <!-- right column -->\n        <g>\n          <rect x=\"690\" y=\"46\" width=\"250\" height=\"58\" rx=\"4\" fill=\"rgba(168,134,63,.12)\" stroke=\"#A8863F\"/>\n          <rect x=\"690\" y=\"118\" width=\"250\" height=\"58\" rx=\"4\" fill=\"rgba(168,134,63,.12)\" stroke=\"#A8863F\"/>\n          <rect x=\"690\" y=\"190\" width=\"250\" height=\"58\" rx=\"4\" fill=\"rgba(168,134,63,.12)\" stroke=\"#A8863F\"/>\n          <rect x=\"690\" y=\"262\" width=\"250\" height=\"58\" rx=\"4\" fill=\"rgba(168,134,63,.12)\" stroke=\"#A8863F\"/>\n          <rect x=\"690\" y=\"334\" width=\"250\" height=\"58\" rx=\"4\" fill=\"#EFEBE3\" stroke=\"#5C6B75\" stroke-dasharray=\"4 3\"/>\n        <\/g>\n        <g font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"13\" fill=\"#14191E\">\n          <text x=\"706\" y=\"70\">FX / liquidity counterparty<\/text>\n          <text x=\"706\" y=\"142\">Settlement partner<\/text>\n          <text x=\"706\" y=\"214\">Custody of customer funds<\/text>\n          <text x=\"706\" y=\"286\">Payout institution<\/text>\n          <text x=\"706\" y=\"358\">Supervisory reporting<\/text>\n        <\/g>\n        <g font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"11\" fill=\"#5C6B75\">\n          <text x=\"706\" y=\"88\">Executes conversion as principal<\/text>\n          <text x=\"706\" y=\"160\">Provides settlement finality<\/text>\n          <text x=\"706\" y=\"232\">Always a licensed institution<\/text>\n          <text x=\"706\" y=\"304\">Local rails, domestic cut-offs<\/text>\n          <text x=\"706\" y=\"376\">Filings of record by licensed parties<\/text>\n        <\/g>\n        <g stroke=\"#5C6B75\" stroke-width=\"1.2\" fill=\"none\">\n          <path d=\"M270 78 H 320\" marker-end=\"url(#ar)\"/>\n          <path d=\"M270 158 H 320\" marker-end=\"url(#ar)\"/>\n          <path d=\"M270 238 H 320\" marker-end=\"url(#ar)\"/>\n          <path d=\"M640 88 H 690\" marker-end=\"url(#ar)\"/>\n          <path d=\"M640 152 H 690\" marker-end=\"url(#ar)\"/>\n          <path d=\"M640 216 H 690\" marker-end=\"url(#ar)\"/>\n          <path d=\"M640 288 H 690\" marker-end=\"url(#ar)\"/>\n          <path d=\"M640 360 H 690\" marker-end=\"url(#ar)\"/>\n        <\/g>\n        <defs>\n          <marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n            <path d=\"M0 0 L8 4 L0 8 z\" fill=\"#5C6B75\"/>\n          <\/marker>\n        <\/defs>\n      <\/svg>\n      <div class=\"legend\">\n        <span><i class=\"k-eko\"><\/i> Built and operated by EKORails<\/span>\n        <span><i class=\"k-partner\"><\/i> Performed by a licensed partner<\/span>\n        <span><i class=\"k-external\"><\/i> External party or vendor<\/span>\n      <\/div>\n      <figcaption>Proposed system boundary. Every element inside the centre boundary is under\n        development. EKORails does not propose to hold customer funds, act as principal in currency\n        conversion, provide settlement finality or hold a payout licence.<\/figcaption>\n    <\/figure>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"platform_detail\">\n  <div class=\"shell\">\n    <h2 id=\"integration\" style=\"font-size:var(--step-3)\">Integration options<\/h2>\n    <div class=\"grid grid-3\" style=\"margin-top:var(--s-5)\">\n      <article class=\"card\"><span class=\"chip chip-progress\">Under development<\/span><h3>Direct API<\/h3><p>For institutions and enterprises with engineering capacity. Server-to-server, mutually authenticated, with webhooks for status.<\/p><\/article>\n      <article class=\"card\"><span class=\"chip chip-planned\">Planned<\/span><h3>Secure operator portal<\/h3><p>For treasury and operations teams. Instruction entry, approval workflow, case queues, status and extracts, with role-based access.<\/p><\/article>\n      <article class=\"card\"><span class=\"chip chip-planned\">Planned<\/span><h3>File-based batch<\/h3><p>For participants with existing batch processes. Signed file exchange over a secure channel with per-item results returned.<\/p><\/article>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"api\" style=\"font-size:var(--step-3)\">API and messaging layer<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>The interface is designed around a small number of resources \u2014 participants, beneficiaries,\n        instructions, quotes, transactions, cases and reports \u2014 with idempotent submission so that a\n        retried instruction cannot create a duplicate payment.<\/p>\n      <p>Message content is aligned to ISO 20022 semantics so that the data a partner bank needs arrives\n        in the form its systems already expect, rather than in a proprietary shape that has to be mapped\n        by hand. <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 message standard as filed]<\/span><\/p>\n      <p>Status is delivered by signed webhook with a polling fallback, because a partner that misses a\n        callback must still be able to establish the truth of a transaction independently.<\/p>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"ledger\" style=\"font-size:var(--step-3)\">Ledger and record-keeping approach<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>EKORails maintains an append-only record of transaction state. Entries are written once, never\n        edited; a correction is a new entry that references the entry it corrects, so the history of what\n        was known and when remains intact.<\/p>\n      <p>This record is an operational and evidential ledger, not a store of customer value. Balances of\n        customer funds are held and reported by the licensed institutions that hold them.<\/p>\n      <p>Retention periods follow the longest applicable requirement across the markets in the corridor.\n        <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 retention schedule]<\/span><\/p>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"settlement\" style=\"font-size:var(--step-3)\">Settlement model<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>The settlement asset, mechanism and timing proposed for the pilot corridor are those set out in\n        EKORails LTD&rsquo;s regulatory filing.\n        <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 settlement asset and mechanism as filed]<\/span>\n        <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/p>\n      <p>Three commitments hold regardless of the mechanism finally approved. Settlement finality is\n        provided by a licensed institution, not asserted by EKORails. Customer funds sit with licensed\n        institutions throughout. And the settlement leg is recorded with enough detail that both sides\n        and their supervisors can reconstruct it independently.<\/p>\n      <p>EKORails does not issue, offer, promote or sell any token, coin or investment instrument, and no\n        settlement mechanism described here is offered to the public as an asset.<\/p>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"controls\" style=\"font-size:var(--step-3)\">Compliance controls<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>Controls are enforced before routing, not reported after the fact. An instruction that breaches\n        a limit, fails screening or lacks required party data does not proceed to a partner; it becomes\n        a case with an owner and a clock.<\/p>\n      <p>The full framework \u2014 governance, AML and CFT, KYC and KYB, sanctions, monitoring, fraud, data\n        protection, cybersecurity, resilience, third-party risk, retention and complaints \u2014 is set out on\n        the <a href=\"/compliance-and-risk\">Compliance and Risk<\/a> page.<\/p>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"reporting\" style=\"font-size:var(--step-3)\">Reporting<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>Three reporting audiences, three different products: operational reporting for participants\n        (status, exceptions, repair queues); financial reporting for finance teams (matched\n        transactions, fees, timing, reconciliation breaks); and supervisory reporting in the formats and\n        at the frequency agreed with the regulator for any approved pilot.<\/p>\n      <p><span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 reporting formats and frequency as filed]<\/span><\/p>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"resilience\" style=\"font-size:var(--step-3)\">Resilience and business continuity<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>The design assumption is that partners and networks will be unavailable at some point, and that\n        a payment stuck between two institutions is worse than a payment that was never accepted.<\/p>\n      <ul>\n        <li>Defined recovery time and recovery point objectives per component. <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 RTO/RPO targets]<\/span><\/li>\n        <li>Degraded-mode behaviour: stop accepting new instructions for an affected route rather than accept and hold indefinitely.<\/li>\n        <li>Reconciliation-first recovery: establish the true state with each partner before resuming.<\/li>\n        <li>Tested restore procedures and a documented incident and communications plan.<\/li>\n        <li>An exit and wind-down plan so that participants are not stranded if the pilot ends.<\/li>\n      <\/ul>\n      <h3 id=\"insolvency\" style=\"font-size:var(--step-1);margin-top:var(--s-5)\">Insolvency and wind-down<\/h3>\n      <p>Because EKORails does not hold customer funds, an insolvency of EKORails LTD does not put\n        customer money at risk in the design: funds sit with licensed institutions throughout, and the\n        claim a customer holds is against that institution under its own regime, not against EKORails.<\/p>\n      <p>What an EKORails failure would put at risk is coordination and record-keeping. The wind-down\n        plan therefore covers three obligations: stop accepting new instructions immediately; drive every\n        in-flight transaction to a terminal state \u2014 settled, returned or rejected \u2014 with each partner;\n        and hand participants and their supervisors a complete, readable export of the audit record for\n        the full retention period.<\/p>\n      <p>The reverse direction matters equally. If a settlement, conversion or payout partner fails, the\n        platform must be able to establish the true state of every transaction on that route by\n        reconciliation rather than assumption, and to stop routing to it without stranding work already\n        accepted. Concentration on a single partner for any critical function is treated as a risk in its\n        own right.<\/p>\n      <p>Final wind-down documentation, escrow of the audit record, and the treatment of each partner\n        agreement on insolvency: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span>\n        <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/p>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"data\" style=\"font-size:var(--step-3)\">Data handling<\/h2>\n    <div class=\"prose\" style=\"margin-top:var(--s-4)\">\n      <p>Personal and transaction data is collected on a defined lawful basis, minimised to what the\n        transaction and the applicable rules require, encrypted in transit and at rest, segregated\n        between environments, and retained to a published schedule.<\/p>\n      <p>Cross-border transfers within a corridor are assessed against the data protection regimes of\n        both markets, including the Nigeria Data Protection Act 2023 where applicable. Data residency\n        commitments for any pilot: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n      <p>See the <a href=\"/privacy-policy\">privacy policy<\/a> for the full description of processing.<\/p>\n    <\/div>\n\n    <hr class=\"rule\">\n\n    <h2 id=\"responsibilities\" style=\"font-size:var(--step-3)\">Partner responsibilities<\/h2>\n    <div class=\"table-wrap\" style=\"margin-top:var(--s-4)\">\n      <table>\n        <caption>Indicative split of responsibilities. Final allocation is set in each partner agreement.<\/caption>\n        <thead><tr><th scope=\"col\">Function<\/th><th scope=\"col\">EKORails<\/th><th scope=\"col\">Licensed partner<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>Customer due diligence of record<\/td><td>Orchestrates and stores evidence<\/td><td>Performs and owns the regulated decision<\/td><\/tr>\n          <tr><td>Sanctions screening<\/td><td>Triggers screening, records outcome, raises cases<\/td><td>Owns list coverage and final disposition<\/td><\/tr>\n          <tr><td>Custody of customer funds<\/td><td>None<\/td><td>Holds funds under its licence<\/td><\/tr>\n          <tr><td>Currency conversion<\/td><td>Requests quote, records rate and timestamp<\/td><td>Executes as principal<\/td><\/tr>\n          <tr><td>Settlement finality<\/td><td>Records confirmation<\/td><td>Provides finality<\/td><\/tr>\n          <tr><td>Local payout<\/td><td>Instructs and tracks<\/td><td>Credits the beneficiary<\/td><\/tr>\n          <tr><td>Regulatory filings of record<\/td><td>Supplies extracts and evidence<\/td><td>Files under its own authorisation<\/td><\/tr>\n          <tr><td>Complaint handling<\/td><td>Provides transaction evidence and status<\/td><td>Owns the regulated complaints process for its customers<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"platform_cta\">\n  <div class=\"shell\">\n    <h2>Reviewing this architecture on behalf of an institution?<\/h2>\n    <p>We will walk a technical or compliance team through the design, the boundary and the open\n      questions, under NDA where appropriate.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"/partners?type=institution\" data-cta=\"platform_partner\">Discuss a Partnership<\/a>\n      <a class=\"btn btn-on-dark\" href=\"/technology\" data-cta=\"platform_tech\">Technology detail<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/use-cases\">Use cases<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Governance<\/h2><ul><li><a href=\"/pilot-and-regulatory-pathway\">Pilot &amp; regulatory pathway<\/a ref=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section\" data-section=\"privacy\">\n  <div class=\"shell shell-narrow\">\n    <p class=\"eyebrow\">Legal<\/p>\n    <h1 style=\"font-size:var(--step-3)\">Privacy policy<\/h1>\n    <p class=\"small muted\" style=\"margin-top:var(--s-3)\">Last updated:\n      <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 date]<\/span><\/p>\n\n    <div class=\"callout callout--gold\" style=\"margin-top:var(--s-5)\">\n      <h2>Draft for legal review<\/h2>\n      <p>This policy is a drafting framework prepared for EKORails LTD. It must be reviewed and approved\n        by qualified legal counsel in each relevant jurisdiction before publication, and the placeholders\n        completed. It is not legal advice.<\/p>\n    <\/div>\n\n    <div class=\"prose\" style=\"margin-top:var(--s-6)\">\n      <h2>1. Who we are<\/h2>\n      <p>EKORails LTD (&ldquo;EKORails&rdquo;, &ldquo;we&rdquo;) is the data controller for personal data\n        processed through ekorails.com and ekoinfrastructure.com. Registered office and company number:\n        <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span>. Data protection contact:\n        <a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a>. Data protection officer and\n        registration status: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n\n      <h2>2. What we collect<\/h2>\n      <ul>\n        <li><strong>Information you give us in a form.<\/strong> Name, position, organisation, country,\n          work email, organisation type, proposed partnership, licence or regulatory status, expected\n          corridor, expected volume range, your message and your consent record.<\/li>\n        <li><strong>Correspondence.<\/strong> Emails and messages you send us and our replies.<\/li>\n        <li><strong>Measurement data, where you allow it.<\/strong> Pages viewed, referring source,\n          approximate country, device type and interactions such as which calls to action are used.<\/li>\n        <li><strong>Technical data required to serve the site.<\/strong> IP address, request time and user\n          agent, processed by our hosting and security providers to deliver pages and prevent abuse.<\/li>\n      <\/ul>\n      <p>We do not collect payment details, government identity documents or financial account\n        information through these websites. We have no retail customers and do not process consumer\n        payment data.<\/p>\n\n      <h2>3. Why we process it, and on what lawful basis<\/h2>\n      <div class=\"table-wrap\" style=\"margin-top:var(--s-3)\">\n        <table>\n          <thead><tr><th scope=\"col\">Purpose<\/th><th scope=\"col\">Data<\/th><th scope=\"col\">Lawful basis<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td>Responding to a partnership or general enquiry<\/td><td>Form data, correspondence<\/td><td>Consent, and our legitimate interest in responding to business enquiries<\/td><\/tr>\n            <tr><td>Sending institutional updates you asked for<\/td><td>Name, organisation, email<\/td><td>Consent, withdrawable at any time<\/td><\/tr>\n            <tr><td>Preventing spam and abuse of forms<\/td><td>Technical data, submission timing<\/td><td>Legitimate interest in protecting our systems<\/td><\/tr>\n            <tr><td>Understanding which pages are read<\/td><td>Measurement data<\/td><td>Consent, where required<\/td><\/tr>\n            <tr><td>Meeting legal, regulatory and record-keeping obligations<\/td><td>Correspondence, consent records<\/td><td>Legal obligation<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n\n      <h2>4. Who we share it with<\/h2>\n      <p>We share personal data only with providers who process it on our instructions \u2014 website hosting,\n        form processing, email delivery, measurement and security \u2014 and with professional advisers or\n        authorities where we are legally required to do so. Current processors:\n        <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 processor list]<\/span><\/p>\n      <p>We do not sell personal data, do not share it for advertising purposes and do not operate\n        cross-site advertising tracking.<\/p>\n\n      <h2>5. International transfers<\/h2>\n      <p>We operate across markets, so personal data may be transferred outside your country. Where it is,\n        we rely on an approved transfer mechanism and assess the protection available in the destination.\n        Transfer mechanisms relied on, including under the Nigeria Data Protection Act 2023 and, where\n        applicable, the UK and EU regimes: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n\n      <h2>6. How long we keep it<\/h2>\n      <p>Enquiry correspondence is retained for the period needed to handle the enquiry and any resulting\n        relationship, and then to meet record-keeping obligations. Update-list data is retained until you\n        unsubscribe. Measurement data is retained in aggregated form. Retention schedule:\n        <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n\n      <h2>7. Your rights<\/h2>\n      <p>Subject to the law that applies to you, you may request access to your personal data, correction\n        of inaccurate data, deletion, restriction of processing, portability, or object to processing\n        based on legitimate interests. Where processing is based on consent, you may withdraw consent at\n        any time without affecting processing carried out before withdrawal.<\/p>\n      <p>To exercise a right, email <a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a>.\n        We respond within the period required by applicable law. Target response time:\n        <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n      <p>You also have the right to complain to your data protection authority, including the Nigeria\n        Data Protection Commission where applicable.<\/p>\n\n      <h2>8. Cookies and measurement<\/h2>\n      <p>These websites use no advertising cookies and no cross-site tracking. We use a privacy-preserving\n        measurement tool to understand which pages are read, and we ask for your choice before enabling\n        it. Your choice is stored in your browser and can be changed at any time by clearing site data.\n        Measurement provider and cookie table:\n        <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n\n      <h2>9. Security<\/h2>\n      <p>We apply access control, encryption in transit and at rest, logging and vendor assessment to the\n        personal data we hold. No system is perfectly secure; if a breach affects your rights we will\n        notify you and the relevant authority as required by law.<\/p>\n\n      <h2>10. Changes<\/h2>\n      <p>We update this policy when our processing changes. The date at the top shows the current version.\n        Material changes affecting how we use data you have already given us will be notified to you\n        directly where we hold contact details for you.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/use-cases\">Use cases<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Governance<\/h2><ul><li><a href=\"/pilot-and-regulatory-pathway\">Pilot &amp; regulatory pathway<\/a><\/li><li><a s authorisation or any equivalent authorisation.<\/p>\n      <p>EKORails LTD does not accept deposits, does not hold client money, does not provide payment\n        services to the public and does not operate a settlement system.<\/p>\n\n      <h2>2. Regulatory sandbox application<\/h2>\n      <p>EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox.\n        Participation and all proposed pilot activities remain subject to regulatory review and approval.<\/p>\n      <p>An application is not an admission, an approval, a licence or an endorsement. If EKORails LTD is\n        admitted to the sandbox, that admission would be a supervised testing arrangement with a defined\n        scope, defined limits and defined reporting obligations. It would not be a commercial operating\n        licence and would not authorise EKORails LTD to offer services to the public outside the approved\n        test.<\/p>\n      <p>If a status is granted, this website will be updated to state the exact status granted, the date\n        it was granted, the scope it covers and the conditions attached. If the application is refused or\n        withdrawn, this website will say so.<\/p>\n      <p>Nothing on this website should be interpreted as suggesting that the Central Bank of Nigeria has\n        reviewed, approved or endorsed EKORails LTD, its platform, its documentation or any statement\n        made by it.<\/p>\n\n      <h2>3. Development status<\/h2>\n      <p>The platform described on this website is in development. No capability described is operating\n        in production, and no corridor described is operating or carrying live transactions. Capabilities\n        are labelled as proposed, planned or in development, and those labels are applied against\n        documentary evidence.<\/p>\n      <p>References to what the platform is &ldquo;designed to&rdquo; do, is &ldquo;intended to&rdquo; do,\n        or would do &ldquo;subject to regulatory approval&rdquo; describe design intent, not current\n        function.<\/p>\n\n      <h2>4. No offer of investment<\/h2>\n      <p>Nothing on this website constitutes an offer, invitation, solicitation or recommendation to buy,\n        subscribe for or otherwise acquire any security, share, token, digital asset, instrument or\n        interest in EKORails LTD or in any of its activities.<\/p>\n      <p>EKORails LTD does not publish investment terms, equity offers, convertible-note opportunities,\n        governance seats, partner economics or fundraising deadlines on this website, and does not accept\n        investment enquiries through the forms on it.<\/p>\n      <p>EKORails LTD does not issue, offer, promote, sell or facilitate the sale of any token, coin or\n        digital asset to the public.<\/p>\n\n      <h2>5. No guarantee of outcome<\/h2>\n      <p>EKORails LTD makes no guarantee, representation or warranty regarding transaction speed,\n        settlement timing, cost savings, foreign exchange rates, foreign exchange availability, currency\n        stability, elimination or reduction of foreign exchange spreads, service availability or the\n        outcome of any transaction.<\/p>\n      <p>Where costs, timings or benefits are discussed, they describe the problem being addressed or the\n        design intent, and are not a commitment as to what any participant would experience.<\/p>\n      <p>EKORails LTD does not represent that any transaction, participant or activity is or will be\n        compliant with applicable law. Compliance obligations rest with each party according to its own\n        legal and regulatory position, and regulated decisions rest with the licensed institutions that\n        are required to make them.<\/p>\n\n      <h2>6. Forward-looking statements<\/h2>\n      <p>This website contains forward-looking statements about proposed capabilities, pilots, corridors,\n        partners and timelines. These depend on regulatory decisions, partner agreements, technical\n        delivery and market conditions, none of which are within EKORails LTD&rsquo;s sole control.<\/p>\n      <p>Forward-looking statements speak only as at the date of publication. EKORails LTD undertakes no\n        obligation to update them except where a statement about regulatory status has become inaccurate,\n        in which case it will be corrected promptly.<\/p>\n\n      <h2>7. Third parties and named organisations<\/h2>\n      <p>References on this website to PAPSS, SWIFT, domestic payment switches, central bank settlement\n        systems, correspondent banking or any other system or organisation are descriptive and are\n        included to explain market structure. They do not imply any relationship, affiliation,\n        endorsement, integration or approval, and are not comparative marketing claims.<\/p>\n      <p>Partners are named only where that partner has agreed in writing to be named. The absence of a\n        named partner should be taken to mean that no such agreement is in place.<\/p>\n\n      <h2>8. Data, statistics and sources<\/h2>\n      <p>Market statistics used on EKORails websites are attributed to a named source with a date, and\n        are listed in the <a href=\"https://ekoinfrastructure.com/data-and-sources\">source register<\/a>.\n        Where a figure has not been verified against a primary source it is shown as a placeholder rather\n        than published. Corrections may be requested at\n        <a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a>.<\/p>\n\n      <h2>9. Geographic restrictions<\/h2>\n      <p>Nothing on this website is directed at any person in any jurisdiction where publication or\n        availability would be contrary to local law or regulation. Any pilot activity would be limited to\n        the markets, participants and activities expressly approved by the relevant regulators and\n        partners.<\/p>\n\n      <h2>10. Contact<\/h2>\n      <p>Questions about this disclaimer, or about any statement made on this website, should be sent to\n        <a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a>. Statements about regulatory\n        status are reviewed by the named compliance officer before publication and on a defined review\n        cycle.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\
