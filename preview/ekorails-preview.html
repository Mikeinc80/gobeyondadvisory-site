/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"tech_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Technology<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:24ch\">Engineered for evidence, not for demonstration.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">Payment infrastructure is\n      judged on what it can prove after something goes wrong. This page describes how EKORails is being\n      built, at the level of detail that is useful to a reviewer without weakening the controls it\n      describes.<\/p>\n    <p class=\"hero-status\" style=\"max-width:72ch\">\n      <span aria-hidden=\"true\">\u25b2<\/span>\n      <span>Architecture is in development. Nothing described here is running in production or\n        carrying customer value. Specific security configuration is shared with partners and reviewers\n        under NDA rather than published.<\/span>\n    <\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"tech_principles\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Engineering principles<\/p>\n      <h2>Six commitments that shape every decision below.<\/h2>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card\"><p class=\"card-index\">Principle 01<\/p><h3>One state, always knowable<\/h3><p>A transaction is in exactly one state, and that state can be established independently by every party to it. Ambiguity is treated as an incident.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Principle 02<\/p><h3>Idempotent by default<\/h3><p>A retried instruction never creates a second payment. Every write path is safe to repeat, because in a distributed corridor it will be repeated.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Principle 03<\/p><h3>Controls before routing<\/h3><p>Limits, screening and data completeness are enforced before an instruction reaches a partner, not reconciled afterwards.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Principle 04<\/p><h3>Append-only history<\/h3><p>Records are written once. Corrections reference what they correct, so the history of what was known, and when, survives.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Principle 05<\/p><h3>Fail closed<\/h3><p>When a dependency is unavailable or a control cannot be evaluated, the instruction stops. Accepting work that cannot complete is the worse failure.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Principle 06<\/p><h3>Least privilege, least data<\/h3><p>Access is granted narrowly and reviewed; data is collected only where a rule or the transaction requires it.<\/p><\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"tech_architecture\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Architecture<\/p>\n      <h2>Components and their status.<\/h2>\n      <p>Status labels here match those used on the <a href=\"/platform\">Platform<\/a> page and are applied\n        against the same evidence standard.<\/p>\n    <\/div>\n    <div class=\"table-wrap\">\n      <table>\n        <caption>Component register. In development means built and testing in a non-production environment; planned means designed but not built.<\/caption>\n        <thead><tr><th scope=\"col\">Component<\/th><th scope=\"col\">Responsibility<\/th><th scope=\"col\">Status<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>API gateway and authentication<\/td><td>Mutual authentication, request signing, rate limiting, idempotency keys.<\/td><td><span class=\"chip chip-progress\">In development<\/span><\/td><\/tr>\n          <tr><td>Instruction service<\/td><td>Validation, canonical instruction record, duplicate suppression.<\/td><td><span class=\"chip chip-progress\">In development<\/span><\/td><\/tr>\n          <tr><td>Orchestration and state machine<\/td><td>Transitions, retries, timeouts, compensation on failure.<\/td><td><span class=\"chip chip-progress\">In development<\/span><\/td><\/tr>\n          <tr><td>Control engine<\/td><td>Limits, velocity, party-data completeness, routing eligibility.<\/td><td><span class=\"chip chip-progress\">In development<\/span><\/td><\/tr>\n          <tr><td>Screening integration<\/td><td>Sanctions and watchlist calls, result capture, case creation.<\/td><td><span class=\"chip chip-planned\">Planned<\/span><\/td><\/tr>\n          <tr><td>Case management<\/td><td>Ownership, service levels, disposition and rationale capture.<\/td><td><span class=\"chip chip-planned\">Planned<\/span><\/td><\/tr>\n          <tr><td>Partner adapters<\/td><td>Per-partner integration for quotes, settlement and payout.<\/td><td><span class=\"chip chip-planned\">Planned<\/span><\/td><\/tr>\n          <tr><td>Append-only ledger<\/td><td>Immutable state history with hash chaining and time stamps.<\/td><td><span class=\"chip chip-progress\">In development<\/span><\/td><\/tr>\n          <tr><td>Reporting and extracts<\/td><td>Operational, financial and supervisory reporting.<\/td><td><span class=\"chip chip-planned\">Planned<\/span><\/td><\/tr>\n          <tr><td>Operator portal<\/td><td>Instruction entry, approvals, queues, status, role-based access.<\/td><td><span class=\"chip chip-planned\">Planned<\/span><\/td><\/tr>\n          <tr><td>Observability stack<\/td><td>Metrics, tracing, structured logs, alerting on control failure.<\/td><td><span class=\"chip chip-progress\">In development<\/span><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"tech_detail\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div class=\"prose\">\n        <h2 id=\"data-model\" style=\"font-size:var(--step-2)\">Data model<\/h2>\n        <p>A small number of long-lived entities \u2014 participant, user, beneficiary, instruction, quote,\n          transaction, case, report \u2014 with explicit relationships and no implicit shared state between\n          services. Money amounts are stored as integer minor units with an explicit currency, never as\n          floating point.<\/p>\n        <p>Every record carries the identity of the actor that created it, the time it was created and,\n          where applicable, the rule version that was in force. That is what makes a supervisory question\n          about a past date answerable.<\/p>\n\n        <h2 id=\"security\" style=\"font-size:var(--step-2)\">Security posture<\/h2>\n        <p>Authentication between institutions is mutual and certificate-based; human access to\n          operational systems requires multi-factor authentication and is granted by role, reviewed on a\n          defined cycle and revoked on leaving. Production access is not routine and is logged.<\/p>\n        <p>Data is encrypted in transit and at rest with managed keys and a documented rotation policy.\n          Environments are segregated, and production data is not used in development or test.\n          Dependencies are inventoried and patched to a defined schedule; secrets are managed centrally\n          and never held in source control.<\/p>\n        <p>Independent penetration testing is performed before any pilot and on a defined cycle\n          thereafter, with findings tracked to closure. Provider, scope and dates:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <p>Specific configurations, network topology, control thresholds and vendor names are not\n          published on this website, because publishing them would help an attacker more than a reviewer.\n          They are provided to partners, auditors and supervisors under NDA.<\/p>\n\n        <h2 id=\"environments\" style=\"font-size:var(--step-2)\">Environments and testing<\/h2>\n        <p>Separate development, test and production environments, with change moving in one direction\n          through peer review and automated checks. Test coverage focuses where the risk is: state\n          transitions, idempotency, control enforcement, partner failure modes and reconciliation.<\/p>\n        <p>A partner sandbox with representative fixtures is planned so that an integrating institution\n          can test failure paths \u2014 not only the path where everything works.<\/p>\n\n        <h2 id=\"observability\" style=\"font-size:var(--step-2)\">Observability<\/h2>\n        <p>Structured logs, metrics and distributed tracing across the transaction lifecycle, with alerts\n          defined on the things that matter operationally: stuck transactions, control-engine failures,\n          partner latency and error rates, screening backlogs and reconciliation breaks.<\/p>\n        <p>Logs exclude sensitive payload content by design, and access to operational telemetry is\n          itself access-controlled.<\/p>\n\n        <h2 id=\"decisions\" style=\"font-size:var(--step-2)\">Decisions we have deliberately not made<\/h2>\n        <p>Some choices depend on the regulatory outcome and on partner selection, and making them early\n          would be a false signal of progress rather than progress.<\/p>\n        <ul>\n          <li>Final settlement asset and mechanism. <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 as filed]<\/span><\/li>\n          <li>Hosting region and data residency for a pilot. <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/li>\n          <li>Screening, monitoring and identity vendors. <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/li>\n          <li>Whether netting is used between institutions, where permitted.<\/li>\n        <\/ul>\n        <p>We publish these as open rather than describing an architecture as complete. It is not.<\/p>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <nav class=\"toc\" aria-label=\"On this page\">\n          <h2>On this page<\/h2>\n          <ol>\n            <li><a href=\"#data-model\">Data model<\/a><\/li>\n            <li><a href=\"#security\">Security posture<\/a><\/li>\n            <li><a href=\"#environments\">Environments and testing<\/a><\/li>\n            <li><a href=\"#observability\">Observability<\/a><\/li>\n            <li><a href=\"#decisions\">Open decisions<\/a><\/li>\n          <\/ol>\n        <\/nav>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>Security reviewers<\/h3>\n          <p>Architecture documentation, threat model and test reports are available to institutional\n            reviewers under NDA.<\/p>\n          <p style=\"margin-top:var(--s-3)\"><a class=\"link-arrow\" href=\"mailto:compliance@ekorails.com\">Request a review pack<\/a><\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"tech_cta\">\n  <div class=\"shell\">\n    <h2>Technical due diligence welcome.<\/h2>\n    <p>We would rather have the architecture challenged now than defended later.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"/partners?type=technology\" data-cta=\"tech_partner\">Technology partnership<\/a>\n      <a class=\"btn btn-on-dark\" href=\"/platform#boundary\" data-cta=\"tech_boundary\">System boundary<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technol vided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \u00b7 Registered office [CONFIRM WITH EKORAILS].<\/p>\n    <\/div>\n  <\/div>\n<\/footer>\n\n\n\n<script>\n(function(){\n  var t=document.querySelector('[data-nav-toggle]'),p=document.querySelector('[data-mobile-nav]');\n  if(t&&p){t.addEventListener('click',function(){var o=t.getAttribute('aria-expanded')==='true';\n    t.setAttribute('aria-expanded',String(!o));p.hidden=o;});}\n  var c=document.querySelector('[data-consent]');\n  if(c){c.hidden=false;c.addEventListener('click',function(e){\n    if(e.target.closest('[data-consent-choice]')) c.hidden=true;});}\n  document.addEventListener('click',function(e){\n    var a=e.target.closest('a'); if(!a) return;\n    var h=a.getAttribute('href')||'';\n    if(h.charAt(0)==='#') return;\n    e.preventDefault();\n    parent.postMessage({eko:'nav',href:h,host:a.hostname||''},'*');\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"},"/use-cases":{"t":"Use Cases | Institutional settlement flows | EKORails","h":"<!DOCTYPE html>\n<html lang=\"en\" class=\"site-ekorails\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Use Cases | Institutional settlement flows | EKORails<\/title>\n<meta name=\"description\" content=\"The five institutional flows EKORails is designing for \u2014 trade invoice settlement, treasury movement, supplier payments, partner settlement and reconciliation.\">\n<meta name=\"robots\" content=\"index,follow,max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://ekorails.com/use-cases\">\n<meta name=\"theme-color\" content=\"#08151F\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"EKORails\">\n<meta property=\"og:title\" content=\"Use Cases | Institutional settlement flows | EKORails\">\n<meta property=\"og:description\" content=\"The five institutional flows EKORails is designing for \u2014 trade invoice settlement, treasury movement, supplier payments, partner settlement and reconciliation.\">\n<meta property=\"og:url\" content=\"https://ekorails.com/use-cases\">\n<meta property=\"og:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n<meta property=\"og:image:alt\" content=\"EKORails \u2014 settlement infrastructure for African trade.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Use Cases | Institutional settlement flows | EKORails\">\n<meta name=\"twitter:description\" content=\"The five institutional flows EKORails is designing for \u2014 trade invoice settlement, treasury movement, supplier payments, partner settlement and reconciliation.\">\n<meta name=\"twitter:image\" content=\"https://ekorails.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"EKORails \u2014 home\">\n      <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"#08151F\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#08151F\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#14344B\">Rails<\/tspan><\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/contact\">Contact<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"usecases_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Use cases<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:24ch\">Five flows, each one a real reconciliation problem before it is a payment problem.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">The use cases below are the\n      ones set out in EKORails LTD&rsquo;s regulatory filing. Any pilot would be limited to the customer\n      groups, transaction types and value bands agreed with the regulator and with partners.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"usecases_detail\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">In scope<\/p>\n      <h2>What the platform is being designed to carry.<\/h2>\n    <\/div>\n\n    <details class=\"acc\" open>\n      <summary>01 \u2014 B2B trade invoice settlement<\/summary>\n      <div>\n        <p><strong>The situation.<\/strong> An importer in one market owes a supplier in the other against\n          a specific invoice. The payment eventually arrives, but the invoice number does not travel with\n          it. The supplier&rsquo;s finance team cannot match the credit to the invoice, so goods release,\n          credit terms and the next order all wait on an email chain.<\/p>\n        <p><strong>What EKORails is designed to do.<\/strong> Carry the commercial reference \u2014 invoice\n          number, purchase order, and agreed remittance data \u2014 as structured fields through every leg, so\n          the confirmation the beneficiary receives already identifies what was paid and why.<\/p>\n        <p><strong>What partners do.<\/strong> The originating bank debits the payer. A licensed\n          counterparty performs any conversion. A licensed institution in the receiving market credits\n          the beneficiary.<\/p>\n        <p><strong>Controls.<\/strong> Both businesses verified before first use; beneficiary\n          pre-registration; per-relationship value and velocity limits; screening on every instruction.<\/p>\n        <p><strong>Status.<\/strong> <span class=\"chip chip-progress\">In development<\/span>\n          <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details class=\"acc\">\n      <summary>02 \u2014 Institutional treasury movement<\/summary>\n      <div>\n        <p><strong>The situation.<\/strong> A corporate or institutional treasury needs to move its own\n          funds across the corridor on a predictable schedule. The difficulty is rarely the transfer\n          itself; it is not knowing, at the point of instruction, when the value will land and at what\n          rate, and therefore having to hold defensive balances on both sides.<\/p>\n        <p><strong>What EKORails is designed to do.<\/strong> Give the treasury team a single instruction,\n          a recorded rate and executing party, a stated timing window with the corridor&rsquo;s cut-offs\n          made explicit, and one reconciled record per movement.<\/p>\n        <p><strong>What partners do.<\/strong> Hold the accounts on both sides, execute conversion,\n          provide settlement.<\/p>\n        <p><strong>Controls.<\/strong> Same-legal-entity verification, dual approval workflow, scheduled\n          limits, full audit trail.<\/p>\n        <p><strong>Status.<\/strong> <span class=\"chip chip-progress\">In development<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details class=\"acc\">\n      <summary>03 \u2014 Approved supplier and merchant payments<\/summary>\n      <div>\n        <p><strong>The situation.<\/strong> A business pays the same set of suppliers or merchants every\n          month. Each payment is screened as though it were the first, which produces repeated\n          verification work and avoidable holds on relationships that are already well understood.<\/p>\n        <p><strong>What EKORails is designed to do.<\/strong> Support a whitelisted beneficiary model:\n          each beneficiary verified and registered once, with per-relationship limits, so that recurring\n          payments are screened proportionately and exceptions stand out instead of being buried.<\/p>\n        <p><strong>What partners do.<\/strong> Own the regulated due diligence decision on each\n          beneficiary and perform the payout.<\/p>\n        <p><strong>Controls.<\/strong> Beneficiary re-verification on a defined cycle; change-of-detail\n          controls to resist invoice redirection fraud; batch submission with individual results.<\/p>\n        <p><strong>Status.<\/strong> <span class=\"chip chip-planned\">Proposed<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details class=\"acc\">\n      <summary>04 \u2014 Regulated partner settlement<\/summary>\n      <div>\n        <p><strong>The situation.<\/strong> Two licensed institutions with corridor obligations to each\n          other reconcile positions across statements, spreadsheets and email, and discover breaks days\n          after the fact.<\/p>\n        <p><strong>What EKORails is designed to do.<\/strong> Provide both institutions with the same\n          transaction record in the same form at the same time, with exceptions raised as cases rather\n          than discovered in a month-end reconciliation.<\/p>\n        <p><strong>What partners do.<\/strong> Everything that requires a licence: funds, conversion,\n          settlement and the filings of record with their own supervisors.<\/p>\n        <p><strong>Controls.<\/strong> Institution-level access control, segregation of duties,\n          supervisory reporting extracts, netting arrangements where permitted\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span>.<\/p>\n        <p><strong>Status.<\/strong> <span class=\"chip chip-planned\">Proposed<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details class=\"acc\">\n      <summary>05 \u2014 Corridor reconciliation and reporting<\/summary>\n      <div>\n        <p><strong>The situation.<\/strong> No participant has a complete view of the corridor. Each holds\n          a fragment, and assembling the whole is manual work performed after something has already gone\n          wrong.<\/p>\n        <p><strong>What EKORails is designed to do.<\/strong> Maintain one authoritative record per\n          transaction \u2014 instruction, parties, states, timings, executing partners, fees and outcome \u2014\n          available as scheduled extracts to finance, operations and compliance teams.<\/p>\n        <p><strong>What partners do.<\/strong> Confirm their legs; their own books remain their records\n          of account.<\/p>\n        <p><strong>Controls.<\/strong> Append-only audit record, role-based extract permissions, retention\n          to schedule.<\/p>\n        <p><strong>Status.<\/strong> <span class=\"chip chip-progress\">In development<\/span><\/p>\n      <\/div>\n    <\/details>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"usecases_out\">\n  <div class=\"shell\">\n    <div class=\"split\">\n      <div>\n        <p class=\"eyebrow\">Out of scope<\/p>\n        <h2 style=\"font-size:var(--step-3)\">What EKORails is not building, and will not market.<\/h2>\n        <p class=\"lede\" style=\"margin-top:var(--s-4)\">Being specific about exclusions is part of being\n          credible about inclusions. None of the following is in the proposed pilot scope.<\/p>\n      <\/div>\n      <div>\n        <ul class=\"card-list\" style=\"gap:.7rem\">\n          <li>Unrestricted consumer or retail remittance marketed to the public.<\/li>\n          <li>Any token, coin, digital asset offering or investment instrument.<\/li>\n          <li>Deposit taking, savings, interest-bearing accounts or e-money issuance in its own name.<\/li>\n          <li>Lending, credit, trade finance or guarantees.<\/li>\n          <li>Currency conversion as principal.<\/li>\n          <li>Custody of customer funds.<\/li>\n          <li>Card issuing or acquiring.<\/li>\n          <li>Services in any market where the required partner authorisations are not in place.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"usecases_criteria\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Pilot participation<\/p>\n      <h2>What would qualify an organisation to take part.<\/h2>\n      <p>We cannot publish a date, because the sequence depends on a regulatory decision and on partner\n        readiness rather than on us. What we can publish is what qualifies an organisation, and the\n        order in which things would have to happen.<\/p>\n    <\/div>\n    <div class=\"split\">\n      <div>\n        <h3 style=\"font-size:var(--step-1)\">Criteria<\/h3>\n        <ul class=\"card-list\" style=\"margin-top:var(--s-3);gap:.7rem\">\n          <li>A documented, recurring payment obligation on the proposed corridor \u2014 not an intention to\n            have one.<\/li>\n          <li>A banking relationship in at least one of the two markets, with an institution willing to\n            participate.<\/li>\n          <li>A flow that falls inside the approved pilot scope. Anything outside it we will tell you is\n            outside it, at the first conversation.<\/li>\n          <li>Willingness to be a named participant in a supervised test, with the reporting that\n            implies.<\/li>\n          <li>A finance or treasury contact who can commit time to onboarding, reconciliation testing and\n            exception handling.<\/li>\n          <li>Verification of the organisation and its beneficiaries before any transaction.<\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h3 style=\"font-size:var(--step-1)\">The order things happen in<\/h3>\n        <ol class=\"card-list\" style=\"margin-top:var(--s-3);gap:.7rem;counter-reset:none\">\n          <li>Regulatory outcome on the sandbox application.<\/li>\n          <li>Licensed partners contracted on both sides of the corridor.<\/li>\n          <li>Participant set agreed with the regulator and partners.<\/li>\n          <li>Onboarding and verification of each participant.<\/li>\n          <li>Integration and failure-path testing against a partner sandbox.<\/li>\n          <li>Controlled pilot within the agreed caps, with agreed reporting.<\/li>\n        <\/ol>\n        <p class=\"small muted\" style=\"margin-top:var(--s-4)\">Registering interest places no obligation on\n          either side and is not an application for a financial service. We will tell you if a flow is\n          out of scope rather than keep you in a pipeline.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"usecases_cta\">\n  <div class=\"shell\">\n    <h2>Have a corridor flow you would test in a pilot?<\/h2>\n    <p>Enterprise pilot interest is assessed against the approved scope. We would rather tell you early\n      that a flow is out of scope than keep you in a pipeline.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"/partners?type=enterprise\" data-cta=\"usecases_pilot\">Enterprise Pilot Interest<\/a>\n      <a class=\"btn btn-on-dark\" href=\"/corridors\" data-cta=\"usecases_corridor\">See corridor detail<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/use-cases\">Use cases<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Governance<\/h2><ul><li><a href=\"/pilot-and-regulatory-pathway\">Pilot &amp; regulatory pathway<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance &amp; risk<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Engage<\/h2><ul><li><a href=\"/partners\">Institutional partnerships<\/a><\/li><li><a href=\"/contact\">Contact<\/a><\/li><li><a href=\"/news\">News &amp; updates<\/a><\/li><li><a href=\"https://ekoinfrastructure.com\" rel=\"noopener\">Eko Infrastructure research<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Legal<\/h2><ul><li><a href=\"/privacy-policy\">Privacy policy<\/a><\/li><li><a href=\"/terms-of-use\">Terms of use<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/li><\/ul><\/div><\/div>\n    <\/div>\n    <div class=\"footer-status\" role=\"note\">\n      <p><strong>Regulatory status.<\/strong> EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central Bank of Nigeria or by any other financial services regulator, and does not hold a payment services, banking or money transmission licence in any jurisdiction. See the <a href=\"/regulatory-disclaimer\">Regulatory Disclaimer<\/a>.<\/p>\n    <\/div>\n    <div class=\"footer-legal\">\n      <p class=\"disclaimer\">EKORails LTD is developing financial infrastructure for institutional and enterprise use. Information on this website is provided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \u00b7 Registered office [CONFIRM WITH EKORAILS].<\/p>\n    <\/div>\n  <\/div>\n<\/footer>\n\n\n\n<script>\n(function(){\n  var t=document.querySelector('[data-nav-toggle]'),p=document.querySelector('[data-mobile-nav]');\n  if(t&&p){t.addEventListener('click',function(){var o=t.getAttribute('aria-expanded')==='true';\n    t.setAttribute('aria-expanded',String(!o));p.hidden=o;});}\n  var c=document.querySelector('[data-consent]');\n  if(c){c.hidden=false;c.addEventListener('click',function(e){\n    if(e.target.closest('[data-consent-choice]')) c.hidden=true;});}\n  document.addEventListener('click',function(e){\n    var a=e.target.closest('a'); if(!a) return;\n    var h=a.getAttribute('href')||'';\n    if(h.charAt(0)==='#') return;\n    e.preventDefault();\n    parent.postMessage({eko:'nav',href:h,host:a.hostname||''},'*');\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"}}},"inf":{"order":["/","/settlement-explained","/corridor-intelligence","/policy-and-regulation","/technology","/glossary","/data-and-sources","/ekorails","/about","/contact","/search","/research/clearing-versus-settlement","/research/what-papss-does","/research/swift-is-a-messaging-network","/research/reading-a-trade-corridor","/thank-you"],"docs":{"/about":{"t":"About | Editorial standards and disclosure | Eko Infrastructure","h":"<!DOCTYPE html>\n<html lang=\"en\" class=\"site-ekoinfrastructure\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>About | Editorial standards and disclosure | Eko Infrastructure<\/title>\n<meta name=\"description\" content=\"Who publishes Eko Infrastructure, our editorial standards, the four-state review workflow, our disclosure of commercial interest, and corrections.\">\n<meta name=\"robots\" content=\"index,follow,max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://ekoinfrastructure.com/about\">\n<meta name=\"theme-color\" content=\"#F8F6F1\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"Eko Infrastructure\">\n<meta property=\"og:title\" content=\"About | Editorial standards and disclosure | Eko Infrastructure\">\n<meta property=\"og:description\" content=\"Who publishes Eko Infrastructure, our editorial standards, the four-state review workflow, our disclosure of commercial interest, and corrections.\">\n<meta property=\"og:url\" content=\"https://ekoinfrastructure.com/about\">\n<meta property=\"og:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n<meta property=\"og:image:alt\" content=\"Eko Infrastructure \u2014 research and intelligence for African settlement infrastructure.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"About | Editorial standards and disclosure | Eko Infrastructure\">\n<meta name=\"twitter:description\" content=\"Who publishes Eko Infrastructure, our editorial standards, the four-state review workflow, our disclosure of commercial interest, and corrections.\">\n<meta name=\"twitter:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"about_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">About<\/p>\n    <h1>About Eko Infrastructure.<\/h1>\n    <p class=\"hero-lede\">A research and policy platform for African settlement infrastructure, operated\n      by a company that is building in the same market. We think that is workable, provided the interest\n      is disclosed and the method is strict.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"about_body\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div class=\"prose article-body\">\n        <h2 id=\"purpose\">What this platform is for<\/h2>\n        <p>Decisions about payment infrastructure in African markets are made by people who need accurate\n          descriptions of how the existing systems work \u2014 not by people who need to be persuaded that\n          everything is broken. Much of the available commentary does the second.<\/p>\n        <p>Eko Infrastructure publishes the first: careful explanations of clearing, settlement,\n          corridors, compliance and policy, with sources and dates, written for institutions,\n          policymakers and the teams inside them.<\/p>\n\n        <h2 id=\"disclosure\">Disclosure<\/h2>\n        <p>Eko Infrastructure is operated by EKORails LTD, a company developing a settlement and\n          interoperability platform. That is a commercial interest in the subject matter, and it is\n          disclosed on every page of this site rather than buried here.<\/p>\n        <p>EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox.\n          Participation and all proposed pilot activities remain subject to regulatory review and\n          approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by any\n          financial services regulator.<\/p>\n        <p>This platform is not an independent academic body, a standards organisation, an industry\n          association or a regulator, and does not present itself as any of those.<\/p>\n\n        <h2 id=\"editorial\">Editorial standards<\/h2>\n        <p>Six standards govern what appears here.<\/p>\n        <ul>\n          <li><strong>Named authorship.<\/strong> Every article carries a named author. Anonymous\n            institutional voice is not used to lend authority.<\/li>\n          <li><strong>Dates that mean something.<\/strong> Publication date and last-updated date are both\n            shown, and the second changes only when the content changes.<\/li>\n          <li><strong>Sources on every claim.<\/strong> Statistics are cited to a primary source with a\n            period and a retrieval date, and listed in the\n            <a href=\"/data-and-sources\">source register<\/a>.<\/li>\n          <li><strong>Fair description of others.<\/strong> Other systems and organisations are described\n            factually, including what they do well. We do not publish attacks on named industry\n            participants.<\/li>\n          <li><strong>Separation from marketing.<\/strong> Research pages do not carry product calls to\n            action beyond a clearly marked link, and no article is written to support a commercial\n            announcement.<\/li>\n          <li><strong>Visible corrections.<\/strong> Material corrections are noted at the foot of the\n            piece rather than made silently.<\/li>\n        <\/ul>\n\n        <h2 id=\"workflow\">Review workflow<\/h2>\n        <p>Every piece moves through four states before publication, and the state is recorded against\n          the article in the content management system so that an editor can see at a glance what is\n          waiting on what.<\/p>\n        <div class=\"table-wrap\" style=\"margin-top:var(--s-4)\">\n          <table>\n            <caption>Editorial workflow. Market data and regulatory statements can be updated without rebuilding the website.<\/caption>\n            <thead><tr><th scope=\"col\">State<\/th><th scope=\"col\">What happens<\/th><th scope=\"col\">Who<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td>Draft<\/td><td>Written, with sources captured as the piece is drafted rather than added afterwards.<\/td><td>Author<\/td><\/tr>\n              <tr><td>Source check<\/td><td>Every figure verified against its primary source; register entries created or updated; retrieval dates set.<\/td><td>Editor<\/td><\/tr>\n              <tr><td>Regulatory review<\/td><td>Any statement touching regulatory status, licensing, partners or platform capability is reviewed against the evidence standard.<\/td><td>Named compliance officer<\/td><\/tr>\n              <tr><td>Published<\/td><td>Live, with publication and last-updated dates set and a scheduled review date recorded.<\/td><td>Editor<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <p>Pieces containing market data or regulatory statements carry a scheduled review date. When\n          that date passes, the piece is flagged for re-verification, because a correct figure from two\n          years ago is a wrong figure today.<\/p>\n\n        <h2 id=\"corrections\">Corrections<\/h2>\n        <p>Email <a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a> with the\n          page, the statement and the source you believe is authoritative. We would rather be corrected\n          than cited incorrectly.<\/p>\n\n        <h2 id=\"reuse\">Citing and reusing this work<\/h2>\n        <p>You may quote from this site with attribution to Eko Infrastructure and a link to the page.\n          Please cite the last-updated date, since figures and regulatory descriptions change. For\n          permission to reproduce a substantial extract, or to discuss a research partnership, contact\n          <a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a>.<\/p>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <div class=\"callout\">\n          <h3>At a glance<\/h3>\n          <ul class=\"card-list\" style=\"margin-top:.6rem\">\n            <li>Operated by EKORails LTD<\/li>\n            <li>Commercially interested, and says so<\/li>\n            <li>Named authors, dated pieces<\/li>\n            <li>Primary sources, retrieval dates<\/li>\n            <li>Compliance review on regulatory statements<\/li>\n            <li>Visible corrections<\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>Contact<\/h3>\n          <p><a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a><\/p>\n          <p class=\"small muted\" style=\"margin-top:var(--s-2)\">Research, media, data questions and\n            corrections.<\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.35)\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"1 ex,follow,max-image-preview:large\">\n<link rel=\"canonical\" href=\"https://ekoinfrastructure.com/corridor-intelligence\">\n<meta name=\"theme-color\" content=\"#F8F6F1\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"Eko Infrastructure\">\n<meta property=\"og:title\" content=\"Corridor Intelligence | Eko Infrastructure\">\n<meta property=\"og:description\" content=\"A method for assessing a cross-border trade corridor \u2014 participants, flows, cost stack, friction, last mile and perimeter \u2014 and where the data runs out.\">\n<meta property=\"og:url\" content=\"https://ekoinfrastructure.com/corridor-intelligence\">\n<meta property=\"og:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n<meta property=\"og:image:alt\" content=\"Eko Infrastructure \u2014 research and intelligence for African settlement infrastructure.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Corridor Intelligence | Eko Infrastructure\">\n<meta name=\"twitter:description\" content=\"A method for assessing a cross-border trade corridor \u2014 participants, flows, cost stack, friction, last mile and perimeter \u2014 and where the data runs out.\">\n<meta name=\"twitter:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"corridor_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">Corridor intelligence<\/p>\n    <h1>Corridor intelligence.<\/h1>\n    <p class=\"hero-lede\">A corridor is not a market size. It is a set of named participants moving\n      specific value under specific rules, and it can be described precisely if you ask the right\n      questions in the right order.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"corridor_method\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div class=\"prose article-body\">\n        <h2 id=\"method\">The method<\/h2>\n        <p>Most corridor analysis begins with a total addressable market and works down. That produces a\n          number that cannot be acted on. Starting from the participants and working up produces a\n          description that can be tested against reality.<\/p>\n\n        <h3>1. Participants<\/h3>\n        <p>Who actually moves value on this corridor today? Name the banks, the payment institutions, the\n          switches, the aggregators and the informal channels. If a corridor cannot be described in named\n          institutions, the analysis is not yet real.<\/p>\n\n        <h3>2. Flows<\/h3>\n        <p>Separate the flows that get bundled together: trade payments for goods, trade payments for\n          services, intra-group treasury movement, personal remittance, and government or institutional\n          transfers. They have different values, different frequencies, different documentation and\n          different regulatory treatment. A statistic about one is not evidence about another.<\/p>\n\n        <h3>3. The cost stack<\/h3>\n        <p>Cost is rarely a single fee. It is an origination fee, a conversion margin, intermediary\n          charges, a receiving charge, and a set of costs that never appear on an invoice: working\n          capital held against uncertainty, staff time spent reconciling, and delay in releasing goods.\n          The visible fee is often the smaller half.<\/p>\n\n        <h3>4. Friction points<\/h3>\n        <p>Where does a transaction on this corridor actually stop? Common answers include compliance\n          holds on incomplete party data, currency unavailable at the size required, cut-off times\n          missed across time zones, beneficiary details that fail validation at the last hop, and\n          reference data lost between intermediaries.<\/p>\n\n        <h3>5. The last mile<\/h3>\n        <p>How does value reach the beneficiary&rsquo;s account domestically, through which licensed\n          institution, on which rails, within which cut-off? Corridor propositions fail here more often\n          than at settlement, and the last mile is the part that cannot be built remotely.<\/p>\n\n        <h3>6. The regulatory perimeter<\/h3>\n        <p>Which activities on this corridor require authorisation, in which market, and who holds it?\n          Which reporting obligations attach, and to whom? A corridor design that is elegant and\n          unlicensable is not a design.<\/p>\n\n        <h2 id=\"data\">What the data will and will not tell you<\/h2>\n        <div class=\"table-wrap\" style=\"margin-top:var(--s-4)\">\n          <table class=\"compare\">\n            <caption>Data availability for corridor analysis. Being explicit about the limits is part of the method.<\/caption>\n            <thead><tr><th scope=\"col\">Question<\/th><th scope=\"col\">Data quality<\/th><th scope=\"col\">Caution<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td>Cost of sending personal remittances<\/td><td><strong>Reasonable.<\/strong> The World Bank&rsquo;s Remittance Prices Worldwide publishes corridor-level pricing quarterly.<\/td><td>It covers remittance products, not business payments. Applying it to B2B flows overstates or understates depending on size band.<\/td><\/tr>\n              <tr><td>Value of recorded bilateral trade<\/td><td><strong>Reasonable.<\/strong> National statistics and UN Comtrade give recorded merchandise trade.<\/td><td>Recorded trade is not payment volume: netting, financing, informal channels and re-exports all break the link.<\/td><\/tr>\n              <tr><td>Value of business cross-border payments on a corridor<\/td><td><strong>Poor.<\/strong> Rarely published at corridor level.<\/td><td>Most published figures are estimates built on assumptions that are seldom stated. Treat as modelling, not measurement.<\/td><\/tr>\n              <tr><td>Time to settle<\/td><td><strong>Poor.<\/strong> Varies by route, size, currency, time of day and compliance outcome.<\/td><td>Any single &ldquo;X days&rdquo; claim about an entire network is a generalisation. Distributions matter more than averages.<\/td><\/tr>\n              <tr><td>Informal and unrecorded flows<\/td><td><strong>Very poor.<\/strong> By definition unmeasured.<\/td><td>Estimates vary by multiples between sources. Cite the source and the method, or do not use the number.<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <p>Eko Infrastructure does not publish market-size headlines without a transparent calculation.\n          Where we model, we show the inputs, the assumptions and the arithmetic, and label the result an\n          estimate.<\/p>\n\n        <h2 id=\"corridors-we-follow\">Corridors we follow<\/h2>\n        <p>We publish corridor notes as they are researched and reviewed. Each note follows the method\n          above and states its data quality explicitly.<\/p>\n        <div class=\"grid grid-2\" style=\"margin-top:var(--s-4)\">\n          <article class=\"card\"><h3>West African intra-regional corridors<\/h3><p>Trade and payment flows between ECOWAS markets, the role of domestic switches, and the effect of multiple currencies on regional settlement.<\/p><p class=\"small muted\">Status: in research. <span class=\"placeholder\">[CONFIRM \u2014 publication date]<\/span><\/p><\/article>\n          <article class=\"card\"><h3>Nigeria outbound trade payments<\/h3><p>Business payment flows from Nigeria to major trading partners, the cost stack, and where compliance friction concentrates.<\/p><p class=\"small muted\">Status: in research. <span class=\"placeholder\">[CONFIRM \u2014 publication date]<\/span><\/p><\/article>\n          <article class=\"card\"><h3>Africa\u2013GCC trade settlement<\/h3><p>Trade between African markets and the Gulf: what is recorded, how it is currently paid for, and which institutions carry it.<\/p><p class=\"small muted\">Status: in research. <span class=\"placeholder\">[CONFIRM \u2014 publication date]<\/span><\/p><\/article>\n          <article class=\"card\"><h3>Diaspora corridors<\/h3><p>Personal remittance corridors into Sub-Saharan Africa, using the published pricing data, and how they differ from business flows.<\/p><p class=\"small muted\">Status: in research. <span class=\"placeholder\">[CONFIRM \u2014 publication date]<\/span><\/p><\/article>\n        <\/div>\n        <div class=\"callout callout--gold\" style=\"margin-top:var(--s-5)\">\n          <h3>On corridor superlatives<\/h3>\n          <p>Claims that a particular corridor is the largest of its kind, or carries some multiple of\n            another, are common and are usually unsourced. Where we make a comparative claim we cite the\n            dataset, the year and the definition being used \u2014 because &ldquo;largest&rdquo; changes\n            answer depending on whether you count value, volume, recorded flows or estimates.<\/p>\n        <\/div>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <nav class=\"toc\" aria-label=\"On this page\">\n          <h2>On this page<\/h2>\n          <ol>\n            <li><a href=\"#method\">The method<\/a><\/li>\n            <li><a href=\"#data\">Data limits<\/a><\/li>\n            <li><a href=\"#corridors-we-follow\">Corridors we follow<\/a><\/li>\n          <\/ol>\n        <\/nav>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>Related<\/h3>\n          <ul class=\"card-list\" style=\"margin-top:.6rem\">\n            <li><a href=\"/research/reading-a-trade-corridor\">Full method explainer<\/a><\/li>\n            <li><a href=\"/settlement-explained\">Settlement explained<\/a><\/li>\n            <li><a href=\"/data-and-sources\">Data and sources<\/a><\/li>\n          <\/ul>\n        <\/div>\n      <\/aside>\n    <\/div>\n\n    <div class=\"sources\">\n      <h2>Sources<\/h2>\n      <ol>\n        <li>World Bank, Remittance Prices Worldwide. <span class=\"placeholder\">[CONFIRM \u2014 quarter and URL]<\/span><\/li>\n        <li>UN Comtrade, bilateral merchandise trade statistics. <span class=\"placeholder\">[CONFIRM \u2014 year and URL]<\/span><\/li>\n        <li>African Export-Import Bank, African Trade Report. <span class=\"placeholder\">[CONFIRM \u2014 edition and URL]<\/span><\/li>\n        <li>Bank for International Settlements, cross-border payments programme publications. <span class=\"placeholder\">[CONFIRM \u2014 publication and URL]<\/span><\/li>\n      <\/ol>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.35)\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#6FC3A2\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#6FC3A2\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#6FC3A2\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#FFFFFF\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#C2CDD5\">Infrastru
