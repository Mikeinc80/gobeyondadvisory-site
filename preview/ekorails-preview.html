ink\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<article class=\"section\" data-section=\"article\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div>\n        <header class=\"article-header\">\n          <p class=\"eyebrow\">Corridors \u00b7 Method<\/p>\n          <h1>How to read a trade corridor: a method, and what the data will not tell you<\/h1>\n          <p class=\"lede\">Corridor analysis usually starts with a market-size number and works down. That\n            produces a figure nobody can act on. Starting from named participants and working up produces\n            a description that can be tested.<\/p>\n          <p class=\"byline\">\n            <span>By <strong>Eko Infrastructure editorial team<\/strong><\/span>\n            <span>Published <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>Last updated <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>11 min read<\/span>\n            <span class=\"review-badge\">Source-checked<\/span>\n          <\/p>\n        <\/header>\n\n        <div class=\"prose article-body\">\n          <h2>Why market-size analysis fails here<\/h2>\n          <p>A headline like &ldquo;a two-hundred-billion-dollar market&rdquo; is usually built by taking\n            a broad trade or payments aggregate, applying a share, and applying a fee assumption. Each\n            step is defensible on its own and the product is unusable, because the aggregate includes\n            flows that are not addressable, the share is an assumption, and the fee varies by an order of\n            magnitude across size bands.<\/p>\n          <p>Worse, the number cannot be falsified. Nothing you observe on a real corridor will confirm or\n            refute it, so it cannot guide a decision. Any market figure worth publishing shows its\n            inputs, its assumptions and its arithmetic, and calls itself an estimate.<\/p>\n\n          <h2>The method<\/h2>\n          <h3>Step 1 \u2014 Name the participants<\/h3>\n          <p>List the institutions that actually move value on this corridor: banks on both sides, payment\n            institutions, switches, aggregators, and the informal channels that carry real volume whether\n            or not anyone likes it. If you cannot name them, you do not yet have a corridor description.<\/p>\n\n          <h3>Step 2 \u2014 Separate the flows<\/h3>\n          <p>Trade payments for goods, trade payments for services, intra-group treasury movement,\n            personal remittance and institutional transfers behave differently in value, frequency,\n            documentation and regulatory treatment. Statistics about one are not evidence about another,\n            and conflating them is the most common error in corridor decks.<\/p>\n\n          <h3>Step 3 \u2014 Build the cost stack<\/h3>\n          <p>Origination fee, conversion margin, intermediary charges, receiving charge \u2014 then the costs\n            that never appear on an invoice: working capital held against timing uncertainty, staff time\n            spent reconciling unmatched credits, and delay in releasing goods. For many businesses the\n            invisible half is larger than the visible one, which is why fee-only comparisons mislead.<\/p>\n\n          <h3>Step 4 \u2014 Locate the friction<\/h3>\n          <p>Ask where transactions actually stop. Compliance holds from incomplete party data. Currency\n            unavailable at size. Cut-offs missed across time zones. Beneficiary details failing validation\n            at the last hop. Reference data lost between intermediaries. Each has a different remedy, and\n            a proposition that does not name which one it addresses is not a proposition.<\/p>\n\n          <h3>Step 5 \u2014 Test the last mile<\/h3>\n          <p>How does value reach the beneficiary domestically \u2014 through which licensed institution, on\n            which rails, within which window? This is where corridor propositions most often fail,\n            because it cannot be built remotely and cannot be assumed.<\/p>\n\n          <h3>Step 6 \u2014 Draw the regulatory perimeter<\/h3>\n          <p>Which activities require authorisation, in which market, and who holds it? Which reporting\n            obligations attach, and to whom? What data must remain in-market? A design that is elegant and\n            unlicensable is not a design.<\/p>\n\n          <h2>What the data will not tell you<\/h2>\n          <p>Being explicit about limits is part of the method, not an apology for it.<\/p>\n          <ul>\n            <li><strong>Corridor-level business payment volume is generally not published.<\/strong> Most\n              circulating figures are estimates whose assumptions are not stated.<\/li>\n            <li><strong>Recorded trade is not payment volume.<\/strong> Netting, financing, re-exports and\n              informal channels all break the link.<\/li>\n            <li><strong>Remittance pricing data does not describe business payments.<\/strong> It is\n              carefully collected and it measures a different product.<\/li>\n            <li><strong>Time-to-settle has no single value.<\/strong> It is a distribution that depends on\n              route, size, currency, time and compliance outcome.<\/li>\n            <li><strong>Informal flows are unmeasured by definition.<\/strong> Estimates differ by\n              multiples between sources.<\/li>\n          <\/ul>\n          <p>None of this makes corridor analysis impossible. It makes it qualitative in places, and the\n            honest response is to say which parts are measured, which are estimated and which are\n            judgement.<\/p>\n\n          <h2>A worked template<\/h2>\n          <div class=\"table-wrap\" style=\"margin-top:var(--s-4)\">\n            <table>\n              <caption>Corridor assessment template. Every published Eko Infrastructure corridor note follows this structure.<\/caption>\n              <thead><tr><th scope=\"col\">Section<\/th><th scope=\"col\">What to record<\/th><th scope=\"col\">Evidence type<\/th><\/tr><\/thead>\n              <tbody>\n                <tr><td>Participants<\/td><td>Named institutions on both sides and their connectivity<\/td><td>Public registers, regulator lists, institution disclosures<\/td><\/tr>\n                <tr><td>Flows<\/td><td>Flow types, indicative sizes, documentation involved<\/td><td>Trade statistics plus interviews; label estimates<\/td><\/tr>\n                <tr><td>Cost stack<\/td><td>Each visible charge, plus the invisible costs, per size band<\/td><td>Published tariffs, quotes, participant interviews<\/td><\/tr>\n                <tr><td>Friction<\/td><td>Where transactions stop, and how often<\/td><td>Interviews; operational data where shared<\/td><\/tr>\n                <tr><td>Last mile<\/td><td>Payout institutions, rails, cut-offs<\/td><td>Institution documentation and regulator material<\/td><\/tr>\n                <tr><td>Perimeter<\/td><td>Required authorisations, reporting, data rules<\/td><td>Regulator publications, legal review<\/td><\/tr>\n                <tr><td>Data quality<\/td><td>What is measured, estimated or judgement, per section<\/td><td>Declared explicitly<\/td><\/tr>\n              <\/tbody>\n            <\/table>\n          <\/div>\n\n          <div class=\"callout callout--gold\">\n            <h3>Disclosure and regulatory note<\/h3>\n            <p>Eko Infrastructure is operated by EKORails LTD, which is developing a settlement and\n              interoperability platform and has proposed one initial corridor in its regulatory filing.\n              EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox;\n              participation and all proposed pilot activities remain subject to regulatory review and\n              approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by any\n              financial services regulator, and no corridor it describes is operating. See\n              <a href=\"https://ekorails.com/corridors\">the EKORails corridor page<\/a>. This article is\n              general information and is not financial, investment, legal or payment-services advice.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"sources\">\n          <h2>Sources<\/h2>\n          <ol>\n            <li>World Bank, Remittance Prices Worldwide \u2014 corridor pricing methodology and data. <span class=\"placeholder\">[CONFIRM \u2014 quarter and URL]<\/span> <span class=\"source-date\">Retrieved <span class=\"placeholder\">[DATE]<\/span><\/span><\/li>\n            <li>UN Comtrade \u2014 bilateral merchandise trade statistics and their documented limitations. <span class=\"placeholder\">[CONFIRM \u2014 year and URL]<\/span><\/li>\n            <li>African Export-Import Bank, African Trade Report. <span class=\"placeholder\">[CONFIRM \u2014 edition and URL]<\/span><\/li>\n            <li>Bank for International Settlements, CPMI \u2014 cross-border payments frictions analysis. <span class=\"placeholder\">[CONFIRM \u2014 publication and URL]<\/span><\/li>\n          <\/ol>\n        <\/div>\n\n        <nav aria-label=\"Related articles\" style=\"margin-top:var(--s-6)\">\n          <h2 style=\"font-size:var(--step-1);margin-bottom:var(--s-3)\">Related<\/h2>\n          <ul class=\"card-list\">\n            <li><a href=\"/corridor-intelligence\">Corridor intelligence \u2014 topic page<\/a><\/li>\n            <li><a href=\"/research/clearing-versus-settlement\">Clearing versus settlement<\/a><\/li>\n            <li><a href=\"/data-and-sources\">Data and sources: our sourcing rules<\/a><\/li>\n            <li><a href=\"/policy-and-regulation\">Policy and regulation<\/a><\/li>\n          <\/ul>\n        <\/nav>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <div class=\"callout\">\n          <h3>In one line<\/h3>\n          <p>Start from named participants and real flows, not from a market-size number. Then say\n            explicitly which parts of your description are measured, estimated or judged.<\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/article>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">  stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<article class=\"section\" data-section=\"article\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div>\n        <header class=\"article-header\">\n          <p class=\"eyebrow\">Technology \u00b7 Explainer<\/p>\n          <h1>SWIFT is a messaging network: what that means for anyone comparing payment systems<\/h1>\n          <p class=\"lede\">&ldquo;SWIFT takes three to five days&rdquo; is one of the most repeated\n            statements in fintech marketing, and one of the least examined. The network carries\n            instructions. What happens to the value is a different question with a different answer for\n            every route.<\/p>\n          <p class=\"byline\">\n            <span>By <strong>Eko Infrastructure editorial team<\/strong><\/span>\n            <span>Published <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>Last updated <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>9 min read<\/span>\n            <span class=\"review-badge\">Source-checked<\/span>\n          <\/p>\n        <\/header>\n\n        <div class=\"prose article-body\">\n          <h2>What the network actually does<\/h2>\n          <p>SWIFT is a cooperative that operates a secure messaging network used by financial\n            institutions to exchange standardised instructions. When a bank sends a payment instruction\n            over it, what travels is a message: parties, identifiers, amount, currency, charges, purpose\n            and references.<\/p>\n          <p>Value does not travel over the network. Value moves through accounts the institutions hold\n            with one another, with a shared correspondent, or with a central bank. The message tells the\n            other institution what to do; the accounts are where it happens.<\/p>\n\n          <h2>Why the &ldquo;three to five days&rdquo; claim fails<\/h2>\n          <p>Once messaging and settlement are separated, the generalisation collapses. Between two banks\n            with a direct relationship and aligned cut-offs, a payment may complete the same day. Through\n            a chain of intermediaries, across time zones, with a compliance hold at one hop, it may take\n            considerably longer. The determinants are the route, the currencies, the size, the time of\n            day, the completeness of the data and the compliance outcome \u2014 not the messaging network.<\/p>\n          <p>Presenting a worst case as a universal property of the network is a marketing device rather\n            than an analysis. Eko Infrastructure does not publish it, and treats its use elsewhere as a\n            signal about the publisher.<\/p>\n          <p>It is also worth noting that the industry has invested substantially in tracking and speed\n            for cross-border payments over the last decade, and that measured performance has changed as\n            a result. Any claim about timing needs a date attached to it.\n            <span class=\"placeholder\">[CONFIRM \u2014 current published performance data, with source and date]<\/span><\/p>\n\n          <h2>What actually causes delay<\/h2>\n          <ul>\n            <li><strong>Incomplete party data.<\/strong> Missing or malformed originator and beneficiary\n              information triggers holds at downstream institutions, which is a data problem rather than a\n              network problem.<\/li>\n            <li><strong>Screening review.<\/strong> A potential sanctions match requires human\n              disposition, and correctly so.<\/li>\n            <li><strong>Cut-off times.<\/strong> An instruction arriving after a domestic cut-off waits for\n              the next processing window, however fast it travelled.<\/li>\n            <li><strong>Currency availability.<\/strong> Conversion cannot complete if the currency is not\n              obtainable at the required size.<\/li>\n            <li><strong>Chain length.<\/strong> Each additional intermediary adds its own checks, fees and\n              windows.<\/li>\n          <\/ul>\n          <p>Four of these five persist regardless of which messaging or settlement technology is used.\n            That is the point that matters for anyone evaluating a proposition: the proposition has to\n            address the causes, not the symptom.<\/p>\n\n          <h2>The ISO 20022 point<\/h2>\n          <p>The migration towards ISO 20022 messaging matters here because it targets the first cause\n            directly. Structured party and remittance fields carry more of the data that downstream\n            institutions need, which reduces holds and improves reconciliation. Coexistence with older\n            formats is the normal state across markets, and the practical question for any route is which\n            fields survive each hop.<\/p>\n\n          <h2>How to compare systems honestly<\/h2>\n          <p>A defensible comparison names the function under discussion. Comparing a messaging network to\n            a settlement system is a category error. Comparing two settlement arrangements requires\n            stating the settlement asset, the finality rules and the governing law. Comparing costs\n            requires stating the size band, the currency pair, the direction and the date.<\/p>\n          <p>Applied to our own operator: EKORails does not replace SWIFT, because it is not a messaging\n            network, and it does not replace a settlement system, because it does not provide finality.\n            It is being designed as an orchestration and record layer that depends on both. Any material\n            from us that suggests otherwise should be reported as an error.<\/p>\n\n          <div class=\"callout callout--gold\">\n            <h3>Disclosure and regulatory note<\/h3>\n            <p>Eko Infrastructure is operated by EKORails LTD. EKORails LTD has applied to participate in\n              the Central Bank of Nigeria Regulatory Sandbox; participation and all proposed pilot\n              activities remain subject to regulatory review and approval. EKORails LTD is not licensed,\n              authorised, approved, endorsed or supervised by any financial services regulator, and has\n              no relationship with, affiliation to or endorsement from SWIFT. References to SWIFT are\n              descriptive. This article is general information and is not financial, investment, legal or\n              payment-services advice. See\n              <a href=\"https://ekorails.com/platform#api\">how EKORails proposes to align to ISO 20022\n              semantics<\/a>.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"sources\">\n          <h2>Sources<\/h2>\n          <ol>\n            <li>SWIFT \u2014 official documentation on the network, message standards and tracking. <span class=\"placeholder\">[CONFIRM \u2014 URL and date]<\/span> <span class=\"source-date\">Retrieved <span class=\"placeholder\">[DATE]<\/span><\/span><\/li>\n            <li>ISO 20022 \u2014 standard and migration documentation. <span class=\"placeholder\">[CONFIRM \u2014 URL]<\/span><\/li>\n            <li>FATF Recommendation 16 \u2014 information required to accompany wire transfers. <span class=\"placeholder\">[CONFIRM \u2014 edition and URL]<\/span><\/li>\n            <li>Bank for International Settlements, CPMI \u2014 cross-border payments programme reporting. <span class=\"placeholder\">[CONFIRM \u2014 publication and URL]<\/span><\/li>\n          <\/ol>\n        <\/div>\n\n        <nav aria-label=\"Related articles\" style=\"margin-top:var(--s-6)\">\n          <h2 style=\"font-size:var(--step-1);margin-bottom:var(--s-3)\">Related<\/h2>\n          <ul class=\"card-list\">\n            <li><a href=\"/research/clearing-versus-settlement\">Clearing versus settlement<\/a><\/li>\n            <li><a href=\"/technology\">Technology: messaging, monitoring and auditability<\/a><\/li>\n            <li><a href=\"/research/what-papss-does\">What PAPSS does<\/a><\/li>\n            <li><a href=\"/glossary\">Glossary: ISO 20022, travel rule, cut-off time<\/a><\/li>\n          <\/ul>\n        <\/nav>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <div class=\"callout\">\n          <h3>In one line<\/h3>\n          <p>SWIFT carries instructions. Accounts carry value. Timing depends on the route, the data and\n            the compliance outcome \u2014 not on the network alone.<\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/article>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.35)\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#6FC  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<article class=\"section\" data-section=\"article\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div>\n        <header class=\"article-header\">\n          <p class=\"eyebrow\">Policy \u00b7 Explainer<\/p>\n          <h1>What PAPSS does, where it operates, and where private platforms may complement it<\/h1>\n          <p class=\"lede\">The Pan-African Payment and Settlement System is frequently invoked in market\n            commentary and rarely described accurately. This is what it is, what it does, and what it\n            does not attempt.<\/p>\n          <p class=\"byline\">\n            <span>By <strong>Eko Infrastructure editorial team<\/strong><\/span>\n            <span>Published <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>Last updated <strong><span class=\"placeholder\">[DATE]<\/span><\/strong><\/span>\n            <span>10 min read<\/span>\n            <span class=\"review-badge\">Source-checked<\/span>\n          <\/p>\n        <\/header>\n\n        <div class=\"prose article-body\">\n          <div class=\"callout\">\n            <h2>Editorial position<\/h2>\n            <p>Eko Infrastructure is operated by a company building in the same market. We therefore hold\n              ourselves to a specific standard on this subject: we describe PAPSS as its operators\n              describe it, we do not characterise its adoption without a cited figure, and we do not\n              present any product as a replacement for it. Where we make a judgement, we mark it as a\n              judgement.<\/p>\n          <\/div>\n\n          <h2>What it is<\/h2>\n          <p>The Pan-African Payment and Settlement System is a payment and settlement infrastructure\n            developed with the African Export-Import Bank and African central banks. Its purpose is to\n            enable payments between participating institutions across African markets in local\n            currencies, with settlement arrangements involving participating central banks, rather than\n            requiring every transaction to route through a currency and a correspondent outside the\n            continent.<\/p>\n          <p>The distinguishing idea is the settlement arrangement. If two institutions in different\n            African markets can transact with each other in their own currencies, and the resulting\n            positions are settled through an arrangement involving their central banks, the transaction\n            does not require the traditional chain of foreign correspondents.\n            <span class=\"placeholder\">[CONFIRM \u2014 precise operating model, from PAPSS official documentation]<\/span><\/p>\n\n          <h2>Who participates<\/h2>\n          <p>Participation runs through central banks and, beneath them, commercial banks and payment\n            service providers in each participating market. A business does not use PAPSS directly; it\n            uses its bank, which may or may not be connected.<\/p>\n          <p>That structure has a direct consequence for anyone assessing a corridor: whether PAPSS is\n            available for a given payment depends on whether both institutions in that specific\n            transaction participate, not on whether their countries do.\n            <span class=\"placeholder\">[CONFIRM \u2014 current participating central banks and institution counts, with source and date]<\/span><\/p>\n\n          <h2>What we do not say about it<\/h2>\n          <p>Commentary about PAPSS frequently asserts that adoption is negligible, or that a\n            private-sector product is a &ldquo;replacement play&rdquo;. We do not publish either claim.<\/p>\n          <p>The first requires a figure with a source, a period and a definition of what is being\n            counted \u2014 instructions, value, connected institutions, active corridors. Those are different\n            measures that give different answers, and a system built through central banks scales on a\n            timeline that is not comparable to a consumer product.<\/p>\n          <p>The second misdescribes the architecture. A system operating with central banks in an\n            official capacity is not in the same category as a private orchestration layer, and framing\n            it as a competitor tells you more about the person framing it than about the market.<\/p>\n\n          <h2>Where private platforms may complement it<\/h2>\n          <p>This is the part that requires care, because it is where our own interest lies. Stated\n            plainly as a judgement rather than a fact:<\/p>\n          <ul>\n            <li><strong>Reach beyond participants.<\/strong> A specific corridor may involve institutions\n              where one side is not connected. Something has to serve that transaction today.<\/li>\n            <li><strong>Non-African counterparties.<\/strong> A continental system addresses payments\n              within the continent. Trade with counterparties outside it involves different\n              arrangements.<\/li>\n            <li><strong>Data and reconciliation.<\/strong> Carrying commercial reference data end to end,\n              and producing a single evidenced record for both sides, is a distinct problem from moving\n              value, and it persists whichever settlement route is used.<\/li>\n            <li><strong>Corridor-specific compliance orchestration.<\/strong> Screening, limits, case\n              management and reporting tuned to one corridor sit above settlement rather than inside it.<\/li>\n          <\/ul>\n          <p>Note what is not on that list: any suggestion that a private platform settles better, faster\n            or more cheaply than an arrangement operating with central banks. We have no evidence for\n            such a claim and would not publish it without any.<\/p>\n\n          <h2>How to assess it for a specific corridor<\/h2>\n          <ol>\n            <li>Are both institutions in this transaction connected?<\/li>\n            <li>Is the currency pair supported for this direction?<\/li>\n            <li>What is the effective timing, including domestic cut-offs at both ends?<\/li>\n            <li>What reference data survives to the beneficiary&rsquo;s statement?<\/li>\n            <li>What does the payer&rsquo;s bank actually charge for this route?<\/li>\n          <\/ol>\n          <p>If the answers work, that is the route. A corridor proposition that cannot say when the\n            incumbent option is the better one is not analysis.<\/p>\n\n          <div class=\"callout callout--gold\">\n            <h3>Disclosure and regulatory note<\/h3>\n            <p>This platform is operated by EKORails LTD, which is developing a settlement and\n              interoperability platform and therefore has a commercial interest in this subject. EKORails\n              LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox;\n              participation and all proposed pilot activities remain subject to regulatory review and\n              approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by any\n              financial services regulator, and has no relationship with, affiliation to, or endorsement\n              from PAPSS or the African Export-Import Bank. See\n              <a href=\"https://ekorails.com/corridors\">how EKORails describes its relationship to existing\n              systems<\/a>. This article is general information and is not financial, investment, legal or\n              payment-services advice.<\/p>\n          <\/div>\n        <\/div>\n\n        <div class=\"sources\">\n          <h2>Sources<\/h2>\n          <ol>\n            <li>PAPSS \u2014 official documentation on the system, participants and operating model. <span class=\"placeholder\">[CONFIRM \u2014 URL and date]<\/span> <span class=\"source-date\">Retrieved <span class=\"placeholder\">[DATE]<\/span><\/span><\/li>\n            <li>African Export-Import Bank \u2014 publications on PAPSS and intra-African trade. <span class=\"placeholder\">[CONFIRM \u2014 publication, year, URL]<\/span><\/li>\n            <li>Participating central banks \u2014 official announcements of connection. <span class=\"placeholder\">[CONFIRM \u2014 list, dates, URLs]<\/span><\/li>\n          <\/ol>\n        <\/div>\n\n        <nav aria-label=\"Related articles\" style=\"margin-top:var(--s-6)\">\n          <h2 style=\"font-size:var(--step-1);margin-bottom:var(--s-3)\">Related<\/h2>\n          <ul class=\"card-list\">\n            <li><a href=\"/research/clearing-versus-settlement\">Clearing versus settlement<\/a><\/li>\n            <li><a href=\"/research/swift-is-a-messaging-network\">SWIFT is a messaging network<\/a><\/li>\n            <li><a href=\"/policy-and-regulation\">Policy and regulation<\/a><\/li>\n            <li><a href=\"/corridor-intelligence\">Corridor intelligence<\/a><\/li>\n          <\/ul>\n        <\/nav>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <div class=\"callout\">\n          <h3>In one line<\/h3>\n          <p>PAPSS enables payments between participating African institutions in local currencies with\n            settlement involving central banks. Whether it serves a given transaction depends on whether\n            both institutions participate.<\/p>\n        <\/div>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>On EKORails.com<\/h3>\n          <p><a href=\"https://ekorails.com/corridors#complement\">Where EKORails sits relative to PAPSS,\n            SWIFT, domestic switches and central bank systems<\/a>.<\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/article>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No adverti elligence for African settlement infrastructure.\">\n<meta property=\"og:locale\" content=\"en_GB\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Settlement Explained | Eko Infrastructure\">\n<meta name=\"twitter:description\" content=\"What settlement means, how clearing differs from settlement, correspondent banking, FX liquidity, settlement finality and stable-value settlement models.\">\n<meta name=\"twitter:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"settlement_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">Settlement explained<\/p>\n    <h1>Settlement, explained.<\/h1>\n    <p class=\"hero-lede\">Six concepts that account for most of the confusion in cross-border payments.\n      Each one is explained on its own terms, before any argument is made about what should be built.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"settlement_body\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div class=\"prose article-body\">\n        <h2 id=\"what-settlement-means\">What settlement means<\/h2>\n        <p>Settlement is the discharge of an obligation between two parties by an actual transfer of\n          value. When a bank in one country owes value to a bank in another, that obligation is settled\n          when value moves between accounts the two institutions can each recognise as theirs \u2014 typically\n          accounts held with each other, with a shared correspondent, or with a central bank.<\/p>\n        <p>Everything else in a payment \u2014 the instruction, the compliance checks, the conversion, the\n          statement entry the customer eventually sees \u2014 surrounds that moment. Confusing the surrounding\n          activity with settlement itself is the most common error in market commentary, and it makes\n          systems look like competitors when they are in fact doing different jobs.<\/p>\n\n        <h2 id=\"clearing-versus-settlement\">Clearing versus settlement<\/h2>\n        <p>Clearing is the transmission, reconciliation and confirmation of instructions, and the\n          calculation of the resulting obligations. Settlement is the transfer of value that discharges\n          them.<\/p>\n        <p>A clearing process may net many instructions into a single obligation per participant per\n          cycle, which reduces the value that must actually move. Settlement then happens once, for the\n          net figure, in central bank money or another agreed settlement asset. A real-time gross\n          settlement system takes the opposite approach: each instruction settles individually and\n          immediately, removing netting risk at the cost of requiring more liquidity.<\/p>\n        <p>Neither approach is better in the abstract. They trade liquidity efficiency against risk, and\n          different systems choose different points on that trade.<\/p>\n        <p><a class=\"link-arrow\" href=\"/research/clearing-versus-settlement\">Full explainer: clearing versus settlement<\/a><\/p>\n\n        <h2 id=\"correspondent-banking\">Correspondent banking<\/h2>\n        <p>A bank that has no presence in a market reaches it through a bank that does. The local bank\n          holds an account for the foreign bank, and value moves between institutions by adjusting the\n          balances on those accounts. The account the foreign bank holds abroad is its nostro; the same\n          account, seen from the local bank&rsquo;s side, is a vostro.<\/p>\n        <p>The model works, and it carries an enormous share of world trade. Its costs are structural\n          rather than incidental: each institution in a chain applies its own compliance requirements,\n          holds its own liquidity, charges its own fees and provides its own cut-off times, and the\n          originating customer sees the sum of all of them.<\/p>\n        <p>Since the 2010s the number of correspondent relationships has declined in several regions as\n          banks reassessed the risk and cost of maintaining them \u2014 a trend documented in work by the\n          Financial Stability Board and the Bank for International Settlements. The consequence for\n          affected corridors is fewer routes, not necessarily worse ones.\n          <span class=\"placeholder\">[INSERT VERIFIED FIGURE \u2014 de-risking trend data, with citation]<\/span><\/p>\n\n        <h2 id=\"fx-liquidity\">FX and liquidity<\/h2>\n        <p>A cross-border payment that changes currency requires someone to hold both currencies and to\n          be willing to exchange them at a price, at a size, at a moment. That party takes a position and\n          is compensated for it.<\/p>\n        <p>Two things are often conflated here. Price is the rate obtained relative to a reference rate,\n          plus any margin. Availability is whether the currency can be obtained at all, at the size and\n          time needed. In several African corridors, availability rather than price has been the binding\n          constraint for businesses at various times \u2014 which is why a narrative built only around\n          &ldquo;spreads&rdquo; misdescribes the problem.\n          <span class=\"placeholder\">[INSERT VERIFIED FIGURE \u2014 corridor FX availability evidence]<\/span><\/p>\n        <p>No settlement design removes the need for someone to hold and price currency risk. A design\n          can change who holds it, how it is priced, and how visible that price is. It cannot make it\n          free, and any claim that it does should be treated as a red flag.<\/p>\n\n        <h2 id=\"settlement-finality\">Settlement finality<\/h2>\n        <p>Finality is the point after which a transfer cannot be revoked \u2014 not by the sender, not by the\n          insolvency of a participant, and not by the system operator. It is a legal property as much as\n          a technical one, defined by the rules of the system and by the law governing it.<\/p>\n        <p>This matters commercially. A payment that appears in a beneficiary&rsquo;s account but is not\n          final can still be reversed, and a business that releases goods against it is exposed. When\n          assessing any settlement proposal, the question is not how fast the balance updates but at what\n          point, under whose rules and under which law, the transfer became irrevocable.<\/p>\n\n        <h2 id=\"stable-value\">Stable-value settlement models<\/h2>\n        <p>A recurring proposal is to settle between institutions using a stable-value instrument \u2014\n          typically a token intended to hold a constant value against a reference currency \u2014 rather than\n          through correspondent balances.<\/p>\n        <p>The arguments in favour are that transfers can be effected outside domestic banking hours and\n          that the record of transfer is shared rather than reconciled. The arguments against are that\n          the instrument introduces its own credit, custody, redemption and legal risks; that finality\n          depends on the legal treatment of the instrument in each relevant jurisdiction; and that\n          somebody must still convert to and from local currency at each end, which is where much of the\n          cost sits.<\/p>\n        <p>Regulatory treatment differs sharply by jurisdiction and continues to change. Any claim that a\n          stable-value model removes foreign exchange cost, eliminates spread or guarantees value\n          stability is not supported by the mechanics: conversion still happens, and the party performing\n          it is still compensated.<\/p>\n        <p>Eko Infrastructure does not take the position that stable-value settlement is either the answer\n          or a distraction. It is one design among several, and its suitability is corridor-specific,\n          regulator-specific and legally contingent.\n          <span class=\"placeholder\">[CONFIRM \u2014 current regulatory treatment by jurisdiction, with citation and date]<\/span><\/p>\n\n        <h2 id=\"the-five-things\">The five things people call &ldquo;a payment&rdquo;<\/h2>\n        <div class=\"table-wrap\" style=\"margin-top:var(--s-4)\">\n          <table class=\"compare\">\n            <caption>Separating the five functions makes most system comparisons tractable.<\/caption>\n            <thead><tr><th scope=\"col\">Function<\/th><th scope=\"col\">What happens<\/th><th scope=\"col\">Typically performed by<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td><strong>Messaging<\/strong><\/td><td>A standardised instruction travels between institutions.<\/td><td>Messaging networks such as SWIFT; domestic message formats; APIs.<\/td><\/tr>\n              <tr><td><strong>Clearing<\/strong><\/td><td>Instructions are reconciled and obligations calculated, sometimes netted.<\/td><td>Clearing houses, switches, regional systems.<\/td><\/tr>\n              <tr><td><strong>Conversion<\/strong><\/td><td>One currency is exchanged for another at a price.<\/td><td>Banks, authorised dealers, liquidity providers.<\/td><\/tr>\n              <tr><td><strong>Settlement<\/strong><\/td><td>Value transfers between institutions and becomes final.<\/td><td>Central bank systems, correspondent accounts, agreed settlement assets.<\/td><\/tr>\n              <tr><td><strong>Payout<\/strong><\/td><td>The beneficiary&rsquo;s account is credited domestically.<\/td><td>Licensed institutions on domestic rails.<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <p>A system that is excellent at one of these is not therefore a competitor to a system that\n          performs another. Most usable comparisons start by naming which of the five is under\n          discussion.<\/p>\n\n        <div class=\"callout\" style=\"margin-top:var(--s-6)\">\n          <h3>Where EKORails fits<\/h3>\n          <p>EKORails LTD, which operates this platform, is developing an orchestration and record layer\n            intended to sit across these functions rather than replace any of them. Its proposed design,\n            including what it explicitly does not do, is published on\n            <a href=\"https://ekorails.com/platform\">ekorails.com/platform<\/a>. It is in development and\n            not operating.<\/p>\n        <\/div>\n      <\/div>\n\n      <aside class=\"sticky-side\">\n        <nav class=\"toc\" aria-label=\"On this page\">\n          <h2>On this page<\/h2>\n          <ol>\n            <li><a href=\"#what-settlement-means\">What settlement means<\/a><\/li>\n            <li><a href=\"#clearing-versus-settlement\">Clearing versus settlement<\/a><\/li>\n            <li><a href=\"#correspondent-banking\">Correspondent banking<\/a><\/li>\n            <li><a href=\"#fx-liquidity\">FX and liquidity<\/a><\/li>\n            <li><a href=\"#settlement-finality\">Settlement finality<\/a><\/li>\n            <li><a href=\"#stable-value\">Stable-value models<\/a><\/li>\n            <li><a href=\"#the-five-things\">The five functions<\/a><\/li>\n          <\/ol>\n        <\/nav>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>Related<\/h3>\n          <ul class=\"card-list\" style=\"margin-top:.6rem\">\n            <li><a href=\"/research/what-papss-does\">What PAPSS does<\/a><\/li>\n            <li><a href=\"/research/swift-is-a-messaging-network\">SWIFT as a messaging network<\/a><\/li>\n            <li><a href=\"/glossary\">Glossary<\/a><\/li>\n            <li><a href=\"/data-and-sources\">Data and sources<\/a><\/li>\n          <\/ul>\n        <\/div>\n      <\/aside>\n    <\/div>\n\n    <div class=\"sources\">\n      <h2>Sources<\/h2>\n      <ol>\n        <li>Bank for International Settlements, Committee on Payments and Market Infrastructures \u2014 publications on correspondent banking and cross-border payments. <span class=\"placeholder\">[CONFIRM \u2014 exact publication, year and URL]<\/span><\/li>\n        <li>Financial Stability Board \u2014 reporting on correspondent banking relationships. <span class=\"placeholder\">[CONFIRM \u2014 exact publication, year and URL]<\/span><\/li>\n        <li>World Bank, Remittance Prices Worldwide \u2014 cost of sending money by region and corridor. <span class=\"placeholder\">[CONFIRM \u2014 quarter, table and URL]<\/span><\/li>\n        <li>CPMI Principles for Financial Market Infrastructures \u2014 settlement finality definitions. <span class=\"placeholder\">[CONFIRM \u2014 edition and URL]<\/span><\/li>\n      <\/ol>\n      <p class=\"small muted\" style=\"margin-top:var(--s-3)\">Every source is listed with a retrieval date in\n        the <a href=\"/data-and-sources\">source register<\/a>. Corrections:\n        <a href=\"mailto:media@ekoinfrastructure.com\">media@ekoinfrastructure.com<\/a>.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.35)\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#6FC3A2\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#6FC3A2\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#6FC3A2\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\  auditability and data sovereignty.\">\n<meta name=\"twitter:image\" content=\"https://ekoinfrastructure.com/assets/img/og-default.png\">\n\n\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" media=\"print\" onload=\"this.media='all'\">\n<noscript><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\"><\/noscript>\n__CSS__\n\n<\/head>\n<body class=\"\">\n<a class=\"skip-link\" href=\"#main\">Skip to main content<\/a>\n<header class=\"site-header\" data-header>\n  <div class=\"shell header-inner\">\n    <a class=\"wordmark\" href=\"/\" aria-label=\"Eko Infrastructure \u2014 home\">\n      <svg width=\"196\" height=\"30\" viewBox=\"0 0 196 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eko Infrastructure\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"#08151F\" stroke-width=\"1.2\"/>\n  <line x1=\"7\" y1=\"10\" x2=\"23\" y2=\"10\" stroke=\"#14344B\" stroke-width=\"1.3\"/>\n  <line x1=\"7\" y1=\"15\" x2=\"23\" y2=\"15\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.6\"/>\n  <line x1=\"7\" y1=\"20\" x2=\"17\" y2=\"20\" stroke=\"#14344B\" stroke-width=\"1.3\" opacity=\"0.35\"/>\n  <circle cx=\"21.5\" cy=\"20\" r=\"2.4\" fill=\"#A8863F\"/>\n  <text x=\"39\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"600\" fill=\"#08151F\">Eko<\/text>\n  <text x=\"76\" y=\"21\" font-family=\"Georgia, 'Times New Roman', serif\" font-size=\"17.5\" font-weight=\"400\" fill=\"#14344B\">Infrastructure<\/text>\n<\/svg>\n    <\/a>\n    <nav class=\"primary-nav\" aria-label=\"Primary\">\n      <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <\/nav>\n    <div class=\"header-actions\">\n      <a class=\"btn btn-sm btn-solid\" href=\"/search\">Search<\/a>\n      <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"mobile-nav\"\n              data-nav-toggle><span class=\"nav-toggle-bars\" aria-hidden=\"true\"><\/span>\n        <span class=\"sr-only\">Open menu<\/span><\/button>\n    <\/div>\n  <\/div>\n  <div class=\"mobile-nav\" id=\"mobile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/\">Research<\/a><\/li><li><a href=\"/settlement-explained\">Settlement<\/a><\/li><li><a href=\"/corridor-intelligence\">Corridors<\/a><\/li><li><a href=\"/policy-and-regulation\">Policy<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/technology\">Technology<\/a><\/li><li><a href=\"/glossary\">Glossary<\/a><\/li><li><a href=\"/data-and-sources\">Sources<\/a><\/li><li><a href=\"/about\">About<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/search\">Search<\/a>\n    <p class=\"mobile-nav-note\">Published by EKORails LTD. Not independent academic research.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"hero hero--research\" data-section=\"tech_hero\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\">Technology<\/p>\n    <h1>Technology.<\/h1>\n    <p class=\"hero-lede\">Standards, architecture and evidence. The engineering questions that determine\n      whether a settlement design can actually be supervised.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"tech_body\">\n  <div class=\"shell\">\n    <div class=\"split split--sidebar\">\n      <div class=\"prose article-body\">\n        <h2 id=\"messaging\">Messaging standards<\/h2>\n        <p>Payment messages carry more than an amount. They carry the parties, their identifiers, the\n          purpose, the charges and the references that let a beneficiary work out what the payment is\n          for. When those fields are lost or truncated between systems, the consequences appear later as\n          compliance holds and manual reconciliation.<\/p>\n        <p>ISO 20022 is the standard the industry has converged on, and its value is precisely that it\n          carries structured, extensible party and remittance data rather than free text. Migration\n          across markets and systems has been staged over years, and coexistence with older formats is\n          the normal condition rather than an exception.<\/p>\n        <p>For anyone designing a corridor product, the practical question is not whether to support\n          ISO 20022 but which fields survive each hop on the actual route, and what happens to a payment\n          when one of them does not.\n          <span class=\"placeholder\">[CONFIRM \u2014 current migration status by market and system, with source]<\/span><\/p>\n\n        <h2 id=\"compliance-architecture\">Compliance architecture<\/h2>\n        <p>Compliance is an architectural property, not a department. Three design decisions determine\n          whether a system can be supervised.<\/p>\n        <ul>\n          <li><strong>Where controls run.<\/strong> Controls enforced before routing prevent bad\n            instructions from entering the chain. Controls applied after the fact produce reports about\n            payments that already left.<\/li>\n          <li><strong>What is recorded.<\/strong> Recording an outcome is not enough. Recording the rule\n            version, the input data and the decision-maker is what allows a supervisor to ask about a\n            past date and get an answer.<\/li>\n          <li><strong>Who owns the decision.<\/strong> In a chain of institutions, exactly one party must\n            own each regulated decision. Designs that leave this ambiguous fail their first serious\n            review.<\/li>\n        <\/ul>\n\n        <h2 id=\"monitoring\">Transaction monitoring<\/h2>\n        <p>Monitoring compares activity against an expected pattern and raises alerts on deviation. Its\n          engineering difficulties are well known: rules produce large numbers of false positives;\n          thresholds that are too tight bury analysts and too loose miss activity; and tuning without\n          versioning destroys the ability to explain past behaviour.<\/p>\n        <p>Two claims should always be treated sceptically. First, that a monitoring system detects all\n          illicit activity \u2014 none does. Second, that machine learning removes the need for explainability\n          \u2014 supervisors ask why an alert was or was not raised, and a model that cannot answer creates a\n          regulatory problem rather than solving one.<\/p>\n\n        <h2 id=\"auditability\">Auditability<\/h2>\n        <p>An auditable system can answer, for any transaction and any date: what was known, what rule\n          applied, who decided, when, and what happened next. That requires append-only records,\n          versioned rules, time stamps from a trusted source, and retention for the longest applicable\n          period across the markets involved.<\/p>\n        <p>Auditability is also what makes disputes tractable. When two institutions disagree about a\n          payment, the party that can reconstruct the sequence with evidence resolves the matter; the\n          party that cannot absorbs the loss.<\/p>\n\n        <h2 id=\"dlt\">What distributed ledger designs change<\/h2>\n        <p>Shared-ledger architectures change one thing genuinely: participants can read from a common\n          record rather than reconciling separate ones. That is a real reduction in a real cost.<\/p>\n        <p>Several things they do not change. Somebody must still convert currency and be compensated for\n          it. Somebody must still hold customer funds under a licence. Legal finality still depends on\n          the law and the system rules, not on the data structure. Compliance obligations still attach to\n          the institutions in the chain. And the last mile still runs through a licensed institution on\n          domestic rails.<\/p>\n        <p>Eko Infrastructure takes no position for or against these designs. The useful question is\n          always which of the five payment functions a proposal addresses, and what it leaves untouched.<\/p>\n\n        <h2 id=\"data-sovereignty\">Data sovereignty<\/h2>\n        <p>Several markets have introduced requirements about where payment and personal data is stored\n          and processed, and about the conditions for transferring it abroad. For corridor designs this\n          is not a hosting preference; it determines architecture, because both markets&rsquo;\n          requirements apply at once and can conflict.<\/p>\n        <p>The practical questions are: which data must remain in-market, which may be transferred under\n          which mechanism, who can access it from where, and how that is evidenced.\n          <span class=\"placeholder\">[CONFIRM \u2014 current residency requirements by market, with source and date]<\/span><\/p>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <nav class=\"toc\" aria-label=\"On this page\">\n          <h2>On this page<\/h2>\n          <ol>\n            <li><a href=\"#messaging\">Messaging standards<\/a><\/li>\n            <li><a href=\"#compliance-architecture\">Compliance architecture<\/a><\/li>\n            <li><a href=\"#monitoring\">Transaction monitoring<\/a><\/li>\n            <li><a href=\"#auditability\">Auditability<\/a><\/li>\n            <li><a href=\"#dlt\">Distributed ledgers<\/a><\/li>\n            <li><a href=\"#data-sovereignty\">Data sovereignty<\/a><\/li>\n          <\/ol>\n        <\/nav>\n        <div class=\"callout\" style=\"margin-top:var(--s-4)\">\n          <h3>Related<\/h3>\n          <ul class=\"card-list\" style=\"margin-top:.6rem\">\n            <li><a href=\"/research/swift-is-a-messaging-network\">SWIFT as a messaging network<\/a><\/li>\n            <li><a href=\"https://ekorails.com/technology\">EKORails engineering approach<\/a><\/li>\n            <li><a href=\"/glossary\">Glossary<\/a><\/li>\n          <\/ul>\n        <\/div>\n      <\/aside>\n    <\/div>\n    <div class=\"sources\">\n      <h2>Sources<\/h2>\n      <ol>\n        <li>ISO 20022 \u2014 standard documentation and migration material. <span class=\"placeholder\">[CONFIRM \u2014 URL and date]<\/span><\/li>\n        <li>Committee on Payments and Market Infrastructures \u2014 Principles for Financial Market Infrastructures. <span class=\"placeholder\">[CONFIRM \u2014 edition and URL]<\/span><\/li>\n        <li>FATF Recommendation 16 \u2014 wire transfer information requirements. <span class=\"placeholder\">[CONFIRM \u2014 edition and URL]<\/span><\/li>\n      <\/ol>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"https://ekorails.com/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow mea 4, 1fr); }\n}\n.card {\n  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);\n  padding: var(--s-4); display: flex; flex-direction: column; gap: .6rem;\n  box-shadow: var(--shadow-sm);\n}\n.card :is(h2, h3) { font-size: var(--step-1); }\n.card p { font-size: var(--step--1); color: var(--text-2); }\n.card--flat { box-shadow: none; background: transparent; }\n.card--dark { background: rgba(243,241,236,.04); border-color: var(--line-dark); box-shadow: none; }\n.card-icon { color: var(--emerald); }\n.card-index {\n  font: 500 .6875rem/1 var(--font-mono); letter-spacing: .12em;\n  color: var(--muted); text-transform: uppercase;\n}\n.card-list { list-style: none; padding: 0; margin-top: .35rem; display: grid; gap: .35rem; }\n.card-list li { position: relative; padding-left: 1.1rem; font-size: var(--step--1); color: var(--text-2); }\n.card-list li::before {\n  content: \"\"; position: absolute; left: 0; top: .62em; width: 6px; height: 1.5px; background: var(--emerald);\n}\n\n/* ---------------------------------------------------------------- 10. Status chips */\n.chip {\n  display: inline-flex; align-items: center; gap: .4rem; align-self: flex-start;\n  font: 600 .6875rem/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase;\n  padding: .3rem .55rem; border-radius: 2px; border: 1px solid;\n}\n.chip::before { content: \"\"; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }\n.chip-live      { color: var(--state-done);    border-color: rgba(14,107,78,.35);  background: rgba(14,107,78,.07); }\n.chip-progress  { color: var(--state-active);  border-color: rgba(122,95,34,.35);  background: rgba(122,95,34,.07); }\n.chip-planned   { color: var(--state-planned); border-color: rgba(92,107,117,.35); background: rgba(92,107,117,.07); }\n.chip-dark      { color: var(--emerald-300);   border-color: rgba(111,195,162,.4); background: rgba(111,195,162,.08); }\n\n/* -----------------------------------------------------
