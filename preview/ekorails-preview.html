cting a specific pair of markets, with a specific pair of institutions,\n          under a specific set of rules, and evidencing the whole flow to a regulator&rsquo;s standard.<\/p>\n      <\/article>\n    <\/div>\n    <p class=\"small muted\" style=\"margin-top:var(--s-5);max-width:80ch\">Every market statistic used on\n      this website is sourced, dated and listed in the\n      <a href=\"https://ekoinfrastructure.com/data-and-sources\">Eko Infrastructure source register<\/a>.\n      Where a figure has not yet been verified against a primary source, it is shown as a placeholder\n      rather than published.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section section--dark\" id=\"building\" data-section=\"capabilities\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">What EKORails is building<\/p>\n      <h2>Six capabilities, built in the order a regulated transaction actually needs them.<\/h2>\n      <p>Each capability below is described exactly as it appears in EKORails LTD&rsquo;s regulatory\n        filing and supporting technical documentation. Nothing here is offered as a live service.\n        Status labels are applied consistently across this website.<\/p>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card card--dark\">\n        <div class=\"cap-icon\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M3 6h14M3 10h9M3 14h11\"/><circle cx=\"16\" cy=\"14\" r=\"2\"/><\/svg>\n        <\/div>\n        <span class=\"chip chip-dark\">In development<\/span>\n        <h3>Transaction orchestration<\/h3>\n        <p>A single instruction model that sequences validation, authorisation, conversion, settlement\n          and confirmation across the parties to a transaction, and holds the state of that transaction\n          until every leg is either complete or unwound.<\/p>\n      <\/article>\n      <article class=\"card card--dark\">\n        <div class=\"cap-icon\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M10 2.5 3.5 5.2v5c0 4 2.8 6.4 6.5 7.3 3.7-.9 6.5-3.3 6.5-7.3v-5z\"/><path d=\"m7.4 10 1.9 1.9 3.4-3.6\"/><\/svg>\n        <\/div>\n        <span class=\"chip chip-dark\">In development<\/span>\n        <h3>Compliance and identity controls<\/h3>\n        <p>Verification of the originating and receiving parties, sanctions and watchlist screening,\n          risk scoring and the transmission of required originator and beneficiary information with each\n          instruction, so that partners receive complete data rather than partial data.<\/p>\n      <\/article>\n      <article class=\"card card--dark\">\n        <div class=\"cap-icon\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M3 13.5h14M14 10.5l3 3-3 3\"/><path d=\"M17 6.5H3M6 3.5l-3 3 3 3\"/><\/svg>\n        <\/div>\n        <span class=\"chip chip-dark\">Proposed<\/span>\n        <h3>FX and liquidity coordination<\/h3>\n        <p>Coordination with licensed banks, authorised dealers and liquidity providers so that the\n          conversion leg of a transaction is quoted, reserved and executed by an appropriately licensed\n          counterparty. EKORails does not propose to act as a principal in currency conversion.<\/p>\n      <\/article>\n      <article class=\"card card--dark\">\n        <div class=\"cap-icon\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><circle cx=\"4.5\" cy=\"10\" r=\"2\"/><circle cx=\"15.5\" cy=\"5\" r=\"2\"/><circle cx=\"15.5\" cy=\"15\" r=\"2\"/><path d=\"M6.5 9.2 13.6 5.8M6.5 10.8l7.1 3.4\"/><\/svg>\n        <\/div>\n        <span class=\"chip chip-dark\">Proposed<\/span>\n        <h3>Corridor routing<\/h3>\n        <p>Selection of an approved route for a given corridor, currency pair and value band from the\n          set of partners that are licensed and operationally available for that route, with the\n          selection recorded and reportable.<\/p>\n      <\/article>\n      <article class=\"card card--dark\">\n        <div class=\"cap-icon\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><rect x=\"2.5\" y=\"4.5\" width=\"15\" height=\"11\" rx=\"1.5\"/><path d=\"M2.5 8.5h15M6.5 12h3\"/><\/svg>\n        <\/div>\n        <span class=\"chip chip-dark\">In development<\/span>\n        <h3>Settlement confirmation<\/h3>\n        <p>Confirmation that the settlement leg has been completed by the licensed partner responsible\n          for it, matched to the original instruction, and returned to both sides with the reference\n          data needed to reconcile against an invoice or purchase order.<\/p>\n      <\/article>\n      <article class=\"card card--dark\">\n        <div class=\"cap-icon\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M5 2.5h7l3.5 3.5v11H5z\"/><path d=\"M12 2.5V6h3.5M7.5 10.5h5M7.5 13.5h5\"/><\/svg>\n        <\/div>\n        <span class=\"chip chip-dark\">In development<\/span>\n        <h3>Audit and regulatory reporting<\/h3>\n        <p>An immutable, time-stamped record of every state change in a transaction, retained under a\n          defined schedule, and reporting formats designed to meet the requirements agreed with the\n          relevant regulator and partners for any approved pilot.<\/p>\n      <\/article>\n    <\/div>\n    <div class=\"callout callout--dark\" style=\"margin-top:var(--s-6)\">\n      <h3>How to read our status labels<\/h3>\n      <p><strong>In development<\/strong> means the component is being built and tested in a\n        non-production environment. <strong>Proposed<\/strong> means the design is documented and filed\n        but implementation depends on partner or regulatory outcomes. Nothing on this website is\n        described as live, in production, or carrying real customer value. The same labels are used on\n        the <a href=\"/platform\">Platform<\/a> and <a href=\"/technology\">Technology<\/a> pages.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" id=\"use-cases\" data-section=\"use_cases\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Initial use cases<\/p>\n      <h2>Designed for institutional and business flows, within an approved pilot scope.<\/h2>\n      <p>The customer groups and transaction types that would be included in any pilot are limited to\n        those set out in EKORails LTD&rsquo;s regulatory filing and agreed with partners. EKORails does\n        not promote unrestricted retail remittance.<\/p>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card usecase\">\n        <p class=\"card-index\">Use case 01<\/p>\n        <h3>B2B trade invoice settlement<\/h3>\n        <p>An importer settles a supplier invoice across the corridor with the invoice reference carried\n          through to the beneficiary&rsquo;s bank statement, so that goods release is not delayed by\n          manual matching.<\/p>\n        <ul class=\"card-list\">\n          <li>Verified business counterparties on both sides<\/li>\n          <li>Invoice and purchase-order references preserved end to end<\/li>\n          <li>Settlement executed by licensed partners<\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"card usecase\">\n        <p class=\"card-index\">Use case 02<\/p>\n        <h3>Institutional treasury movement<\/h3>\n        <p>A corporate or institutional treasury moves funds between its own accounts across the\n          corridor on a scheduled basis, with predictable timing windows and a single reconciled\n          record of each movement.<\/p>\n        <ul class=\"card-list\">\n          <li>Same-legal-entity transfers within agreed limits<\/li>\n          <li>Scheduled and evidenced cut-off handling<\/li>\n          <li>Position and status reporting to the treasury team<\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"card usecase\">\n        <p class=\"card-index\">Use case 03<\/p>\n        <h3>Approved supplier and merchant payments<\/h3>\n        <p>A business pays a defined list of onboarded suppliers or merchants, where each beneficiary\n          has been verified in advance and the payment relationship is recurring rather than ad hoc.<\/p>\n        <ul class=\"card-list\">\n          <li>Beneficiary whitelisting and pre-verification<\/li>\n          <li>Velocity and value limits per relationship<\/li>\n          <li>Batch instruction with individual confirmations<\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"card usecase\">\n        <p class=\"card-index\">Use case 04<\/p>\n        <h3>Regulated partner settlement<\/h3>\n        <p>A licensed bank or payment institution uses the platform to settle its own corridor\n          obligations with a counterparty institution, with the reconciliation and reporting that its\n          own supervisor expects.<\/p>\n        <ul class=\"card-list\">\n          <li>Institution-to-institution flows<\/li>\n          <li>Netting and position visibility <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/li>\n          <li>Supervisory reporting extracts<\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"card usecase\">\n        <p class=\"card-index\">Use case 05<\/p>\n        <h3>Corridor reconciliation and reporting<\/h3>\n        <p>Participants receive a single, consistent view of every transaction on the corridor \u2014\n          instruction, status, timing, parties, fees and outcome \u2014 rather than assembling that view from\n          several partial statements.<\/p>\n        <ul class=\"card-list\">\n          <li>Per-transaction audit trail<\/li>\n          <li>Exception and repair queues<\/li>\n          <li>Scheduled extracts for finance and compliance<\/li>\n        <\/ul>\n      <\/article>\n      <article class=\"card usecase card--flat\" style=\"justify-content:center\">\n        <p class=\"card-index\">Out of scope<\/p>\n        <h3>What we are not building for<\/h3>\n        <p>No unrestricted consumer remittance product, no investment or savings product, no token\n          offering, no lending, and no service marketed directly to retail customers outside an\n          approved pilot scope.<\/p>\n        <p><a class=\"link-arrow\" href=\"/use-cases\">See full use-case detail<\/a><\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" id=\"how-it-works\" data-section=\"transaction_flow\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">How a transaction would work<\/p>\n      <h2>Six steps \u2014 and a clear line between what EKORails does and what licensed partners do.<\/h2>\n      <p>The description below is a design, not a live service. It is shown so that banks, regulators\n        and enterprise reviewers can see exactly where responsibility sits at every step.<\/p>\n    <\/div>\n    <div class=\"split split--sidebar\">\n      <div class=\"flow\">\n        <div class=\"flow-step\">\n          <span class=\"flow-num\" aria-hidden=\"true\"><\/span>\n          <div class=\"flow-body\">\n            <h3>Initiation<\/h3>\n            <p>An onboarded institution or business submits a payment instruction through an API or a\n              secure portal, carrying the payer, the beneficiary, the amount, the currency pair, the\n              corridor and the commercial reference for the payment.<\/p>\n            <p class=\"flow-meta\"><span class=\"flow-owner\">EKORails: instruction capture, validation, state<\/span>\n              <span class=\"flow-dep\">Partner: originating account relationship<\/span><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"flow-step\">\n          <span class=\"flow-num\" aria-hidden=\"true\"><\/span>\n          <div class=\"flow-body\">\n            <h3>Identity and compliance validation<\/h3>\n            <p>The parties are checked against the verification records held for them, screened against\n              applicable sanctions and watchlists, and scored against the corridor&rsquo;s risk rules.\n              Instructions that fail or require review are held, not routed.<\/p>\n            <p class=\"flow-meta\"><span class=\"flow-owner\">EKORails: screening orchestration, risk rules, case creation<\/span>\n              <span class=\"flow-dep\">Partner: regulated customer due diligence, final AML decisioning<\/span><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"flow-step\">\n          <span class=\"flow-num\" aria-hidden=\"true\"><\/span>\n          <div class=\"flow-body\">\n            <h3>Transaction authorisation<\/h3>\n            <p>The instruction is authorised against the limits, velocity rules and approval workflows\n              agreed for that participant, and the funding leg is confirmed with the institution that\n              holds the customer&rsquo;s funds.<\/p>\n            <p class=\"flow-meta\"><span class=\"flow-owner\">EKORails: limit and workflow enforcement<\/span>\n              <span class=\"flow-dep\">Partner: funds confirmation and debit authority<\/span><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"flow-step\">\n          <span class=\"flow-num\" aria-hidden=\"true\"><\/span>\n          <div class=\"flow-body\">\n            <h3>FX or value conversion<\/h3>\n            <p>Where the corridor requires a currency conversion, that conversion is quoted and executed\n              by a licensed bank, authorised dealer or liquidity partner. EKORails records the rate, the\n              timestamp, the executing party and the resulting amounts.<\/p>\n            <p class=\"flow-meta\"><span class=\"flow-owner\">EKORails: quote request, rate capture, record<\/span>\n              <span class=\"flow-dep\">Partner: execution as principal, rate provision, licensing<\/span><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"flow-step\">\n          <span class=\"flow-num\" aria-hidden=\"true\"><\/span>\n          <div class=\"flow-body\">\n            <h3>Partner settlement<\/h3>\n            <p>The settlement leg is completed by the licensed institution responsible for the receiving\n              market, through the settlement mechanism agreed for the corridor. Customer funds are held\n              by licensed institutions, not by EKORails.<\/p>\n            <p class=\"flow-meta\"><span class=\"flow-owner\">EKORails: instruction, status tracking, exception handling<\/span>\n              <span class=\"flow-dep\">Partner: custody of funds, settlement finality, local payout<\/span><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"flow-step\">\n          <span class=\"flow-num\" aria-hidden=\"true\"><\/span>\n          <div class=\"flow-body\">\n            <h3>Confirmation and audit reporting<\/h3>\n            <p>Both sides receive confirmation matched to the original commercial reference, and the\n              full sequence of states is written to an append-only audit record available for\n              reconciliation, supervisory reporting and dispute handling.<\/p>\n            <p class=\"flow-meta\"><span class=\"flow-owner\">EKORails: confirmation, audit record, reporting extracts<\/span>\n              <span class=\"flow-dep\">Partner: statement entry, regulatory filings of record<\/span><\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n      <aside class=\"sticky-side\">\n        <div class=\"callout\">\n          <h3>Where the boundary sits<\/h3>\n          <p>EKORails is being designed as an orchestration, compliance and record-keeping layer.\n            In the model above it does not hold customer funds, does not act as principal in currency\n            conversion, does not provide settlement finality and does not operate a payout licence.\n            Those functions sit with licensed banks, payment institutions, custodians and liquidity\n            partners.<\/p>\n          <p style=\"margin-top:var(--s-3)\"><a class=\"link-arrow\" href=\"/platform#boundary\">See the system boundary diagram<\/a><\/p>\n        <\/div>\n        <div class=\"callout callout--gold\" style=\"margin-top:var(--s-4)\">\n          <h3>Settlement asset and mechanism<\/h3>\n          <p>The settlement asset and mechanism proposed for the pilot corridor are those set out in\n            EKORails LTD&rsquo;s regulatory filing and are subject to regulatory review.\n            <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 settlement asset as filed]<\/span>\n            <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/p>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--dark\" id=\"regulatory-pathway\" data-section=\"regulatory_pathway\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Regulatory pathway<\/p>\n      <h2>Where we actually are \u2014 stated plainly, and updated only when a stage is evidenced.<\/h2>\n      <p>This tracker is maintained against documentary evidence. A stage is only marked complete when\n        EKORails LTD holds a document confirming it. No stage is ever shown ahead of its evidence.<\/p>\n    <\/div>\n    <div class=\"tracker\">\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">Entity incorporated<\/p>\n        <p class=\"tracker-note\">EKORails LTD is incorporated as the legal applicant and operating\n          entity. Company number and registered office: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <span class=\"chip chip-live\">Complete<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">Sandbox application<\/p>\n        <p class=\"tracker-note\">EKORails LTD has applied to participate in the Central Bank of Nigeria\n          Regulatory Sandbox. Date of submission and reference:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <span class=\"chip chip-progress\">Submitted<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">Regulatory review<\/p>\n        <p class=\"tracker-note\">Participation, scope and conditions are determined by the regulator.\n          EKORails LTD has received no decision, admission, approval or endorsement, and will publish\n          the exact status granted if and when it is confirmed in writing.<\/p>\n        <span class=\"chip chip-planned\">Pending<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">Partner integration<\/p>\n        <p class=\"tracker-note\">Integration with licensed banking, liquidity and payout partners for the\n          proposed corridor. Partner names are not published until each partner has agreed in writing to\n          be named. <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n        <span class=\"chip chip-planned\">Not started<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">Controlled pilot<\/p>\n        <p class=\"tracker-note\">A limited pilot with a defined participant set, value caps, transaction\n          caps and reporting obligations, conducted only if and as approved.\n          <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/p>\n        <span class=\"chip chip-planned\">Not started<\/span>\n      <\/div>\n      <div class=\"tracker-row\">\n        <p class=\"tracker-stage\">Post-pilot licensing pathway<\/p>\n        <p class=\"tracker-note\">Any move beyond a pilot would require the appropriate authorisation or\n          licence in each market of operation. EKORails LTD holds no such licence today.<\/p>\n        <span class=\"chip chip-planned\">Not started<\/span>\n      <\/div>\n    <\/div>\n    <p class=\"small\" style=\"margin-top:var(--s-5)\"><a class=\"link-arrow\" href=\"/pilot-and-regulatory-pathway\">Read the full regulatory pathway<\/a><\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" id=\"corridor\" data-section=\"corridor\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Initial corridor<\/p>\n      <h2>One corridor, chosen deliberately, before any question of scale.<\/h2>\n      <p>EKORails is not launching a network. The proposed pilot addresses a single corridor with a\n        defined institutional user group, so that the compliance model, the partner model and the\n        settlement model can be tested and evidenced before anything else is considered.<\/p>\n    <\/div>\n    <dl class=\"deflist\">\n      <div>\n        <dt>The corridor<\/dt>\n        <dd>The origination market is Nigeria. The counterparty market, currency pair and value bands\n          are those set out in the regulatory filing and will be published once the filing status\n          permits. <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 corridor as filed]<\/span><\/dd>\n      <\/div>\n      <div>\n        <dt>Why it was selected<\/dt>\n        <dd>Selection criteria are documented in the filing: existing trade volume between the two\n          markets, the availability of licensed partners on both sides, the clarity of the regulatory\n          pathway, and the concentration of business payments that are currently difficult to reconcile.\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 selection rationale as filed]<\/span><\/dd>\n      <\/div>\n      <div>\n        <dt>Intended institutional users<\/dt>\n        <dd>Licensed banks and payment institutions, enterprises with recurring corridor obligations,\n          and approved trade counterparties \u2014 limited in the pilot to the participant set agreed with\n          the regulator and partners.<\/dd>\n      <\/div>\n      <div>\n        <dt>Required partners<\/dt>\n        <dd>At minimum: an originating institution, a licensed conversion or liquidity counterparty, a\n          settlement partner and a licensed payout institution in the receiving market. Partner names\n          are published only with written consent.<\/dd>\n      <\/div>\n      <div>\n        <dt>Regulatory dependencies<\/dt>\n        <dd>Sandbox participation and scope, partner authorisations in both markets, data protection\n          obligations in both markets, and any conditions attached to an approval.\n          <span class=\"placeholder\">[SUBJECT TO REGULATORY APPROVAL]<\/span><\/dd>\n      <\/div>\n      <div>\n        <dt>Pilot success measures<\/dt>\n        <dd>Success is defined by control effectiveness rather than volume: completeness of the audit\n          record, screening accuracy and false-positive rate, exception and repair rates, reconciliation\n          match rate, and adherence to agreed reporting. Target values:\n          <span class=\"placeholder\">[INSERT VERIFIED FIGURE \u2014 pilot success thresholds as filed]<\/span><\/dd>\n      <\/div>\n    <\/dl>\n    <p class=\"small\" style=\"margin-top:var(--s-5)\"><a class=\"link-arrow\" href=\"/corridors\">Corridor detail and expansion criteria<\/a><\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" id=\"compliance\" data-section=\"compliance\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Compliance by design<\/p>\n      <h2>The control framework is the product, not a layer added after it.<\/h2>\n      <p>The controls below are the framework EKORails LTD is building and would operate under an\n        approved pilot. EKORails LTD does not hold any compliance or security certification, and does\n        not claim one. Where an audit or certification is completed, it will be named and dated.<\/p>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card\"><h3>Customer and business verification<\/h3><p>Identity and entity verification, beneficial ownership, and documented onboarding for every participating institution and business.<\/p><\/article>\n      <article class=\"card\"><h3>AML and CFT controls<\/h3><p>A written programme covering risk assessment, policies, training, independent testing and a named compliance officer.<\/p><\/article>\n      <article class=\"card\"><h3>Sanctions screening<\/h3><p>Screening of parties and payment data against applicable lists at onboarding and at transaction time, with recorded outcomes.<\/p><\/article>\n      <article class=\"card\"><h3>Transaction monitoring<\/h3><p>Rules and thresholds applied to corridor activity, with alerts routed into a case-managed queue rather than cleared automatically.<\/p><\/article>\n      <article class=\"card\"><h3>Limits and velocity controls<\/h3><p>Per-participant, per-beneficiary and per-corridor value and frequency caps, enforced before an instruction is routed.<\/p><\/article>\n      <article class=\"card\"><h3>Suspicious activity escalation<\/h3><p>Defined escalation paths and timelines to the responsible compliance officer and, where required, to the relevant authority through the licensed partner of record.<\/p><\/article>\n      <article class=\"card\"><h3>Data protection<\/h3><p>Lawful basis, minimisation, retention schedules and cross-border transfer controls under the Nigeria Data Protection Act and other applicable regimes.<\/p><\/article>\n      <article class=\"card\"><h3>Cybersecurity<\/h3><p>Access control, encryption in transit and at rest, segregation of environments, logging, vulnerability management and independent testing.<\/p><\/article>\n      <article class=\"card\"><h3>Audit trails and reporting<\/h3><p>Append-only records of every state change, retained to schedule, with extracts formatted for supervisory and partner reporting.<\/p><\/article>\n    <\/div>\n    <div class=\"btn-row\" style=\"margin-top:var(--s-6)\">\n      <a class=\"btn btn-ghost\" href=\"/compliance-and-risk\" data-cta=\"home_compliance\">Read the compliance and risk framework<\/a>\n      <a class=\"btn btn-ghost\" href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" id=\"partnerships\" data-section=\"partnerships\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Institutional partnerships<\/p>\n      <h2>Infrastructure of this kind is built with institutions, not around them.<\/h2>\n      <p>EKORails is looking for partners in seven categories. Each conversation starts with scope,\n        licensing and control expectations \u2014 not with commercial terms.<\/p>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card\"><p class=\"card-index\">Category 01<\/p><h3>Banks and licensed payment institutions<\/h3><p>Institutions that can hold funds, execute conversion and provide settlement or payout in either market of the corridor.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Category 02<\/p><h3>Enterprise and trade partners<\/h3><p>Businesses with recurring, documented corridor obligations that are willing to participate in a controlled pilot.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Category 03<\/p><h3>FX and liquidity providers<\/h3><p>Licensed counterparties able to quote and execute the conversion leg at the sizes and times the corridor requires.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Category 04<\/p><h3>Technology and cybersecurity providers<\/h3><p>Infrastructure, resilience, testing and assurance partners supporting a platform intended for institutional use.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Category 05<\/p><h3>Identity and compliance providers<\/h3><p>Verification, screening, monitoring and case-management capabilities that meet institutional standards in both markets.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Category 06<\/p><h3>Regulators and policy institutions<\/h3><p>Supervisors, policy bodies and development institutions engaging on interoperability, corridor economics and controls.<\/p><\/article>\n      <article class=\"card\"><p class=\"card-index\">Category 07<\/p><h3>Research and development partners<\/h3><p>Institutions collaborating on corridor data, settlement research and market analysis through Eko Infrastructure.<\/p><\/article>\n      <article class=\"card card--flat\" style=\"justify-content:center\">\n        <h3>Discuss a partnership<\/h3>\n        <p>Partnership enquiries are handled by named people, under NDA where appropriate, and are not\n          used for marketing.<\/p>\n        <p><a class=\"btn btn-emerald\" href=\"/partners\" data-cta=\"home_partner\">Discuss a Partnership<\/a><\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--dark\" id=\"leadership\" data-section=\"leadership\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Leadership<\/p>\n      <h2>Named people, with responsibilities that can be checked.<\/h2>\n      <p>Governance responsibility for compliance, technology and corridor delivery sits with named\n        individuals. Full biographies, photographs and appointments are on the leadership page.<\/p>\n    <\/div>\n    <div class=\"grid grid-3\">\n      <article class=\"card card--dark\">\n        <h3>Mike Ogbebor<\/h3>\n        <p class=\"person-role\" style=\"color:var(--emerald-300)\">Founder \u2014 EKORails LTD<\/p>\n        <p>Cross-border infrastructure and capital strategy across Houston, West Africa and the Gulf.\n          Responsible for corridor strategy, partner development and the regulatory engagement\n          programme. Formal title and appointment date:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n      <\/article>\n      <article class=\"card card--dark\">\n        <h3>Compliance leadership<\/h3>\n        <p class=\"person-role\" style=\"color:var(--emerald-300)\">Named compliance officer<\/p>\n        <p>Accountable for the AML and CFT programme, sanctions, monitoring and regulatory reporting.\n          Name, qualifications and appointment date:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n      <\/article>\n      <article class=\"card card--dark\">\n        <h3>Technology leadership<\/h3>\n        <p class=\"person-role\" style=\"color:var(--emerald-300)\">Named technology lead<\/p>\n        <p>Accountable for platform architecture, security engineering and operational resilience.\n          Name, qualifications and appointment date:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n      <\/article>\n    <\/div>\n    <p class=\"small\" style=\"margin-top:var(--s-5)\"><a class=\"link-arrow\" href=\"/leadership\">Leadership and governance<\/a><\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"research_bridge\">\n  <div class=\"shell\">\n    <div class=\"bridge\">\n      <div>\n        <p class=\"eyebrow\">Eko Infrastructure<\/p>\n        <h2>The research platform behind the thesis.<\/h2>\n        <p>Eko Infrastructure is the research, policy and market-intelligence platform operated by\n          EKORails LTD. It explains clearing, settlement, corridors and compliance in plain terms, with\n          sources, dates and named authors \u2014 including where existing systems already work well.<\/p>\n      <\/div>\n      <div class=\"btn-row\">\n        <a class=\"btn btn-solid\" href=\"https://ekoinfrastructure.com\" data-cta=\"home_research_bridge\">Visit Eko Infrastructure<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"final_cta\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"justify-content:center\">Get involved<\/p>\n    <h2>Help build the infrastructure behind African trade.<\/h2>\n    <p>Whether you supervise this market, operate in it, or depend on it, we would rather have a\n      precise conversation than a promotional one.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"/partners?type=institution\" data-cta=\"final_partnership\">Institutional Partnership<\/a>\n      <a class=\"btn btn-on-dark\" href=\"/partners?type=regulator\" data-cta=\"final_regulatory\">Regulatory Inquiry<\/a>\n      <a class=\"btn btn-on-dark\" href=\"/partners?type=enterprise\" data-cta=\"final_enterprise\">Enterprise Pilot Interest<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\ koinfrastructure.com\" rel=\"noopener\">Eko Infrastructure research<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Legal<\/h2><ul><li><a href=\"/privacy-policy\">Privacy policy<\/a><\/li><li><a href=\"/terms-of-use\">Terms of use<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/li><\/ul><\/div><\/div>\n    <\/div>\n    <div class=\"footer-status\" role=\"note\">\n      <p><strong>Regulatory status.<\/strong> EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central Bank of Nigeria or by any other financial services regulator, and does not hold a payment services, banking or money transmission licence in any jurisdiction. See the <a href=\"/regulatory-disclaimer\">Regulatory Disclaimer<\/a>.<\/p>\n    <\/div>\n    <div class=\"footer-legal\">\n      <p class=\"disclaimer\">EKORails LTD is developing financial infrastructure for institutional and enterprise use. Information on this website is provided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \u00b7 Registered office [CONFIRM WITH EKORAILS].<\/p>\n    <\/div>\n  <\/div>\n<\/footer>\n\n\n\n<script>\n(function(){\n  var t=document.querySelector('[data-nav-toggle]'),p=document.querySelector('[data-mobile-nav]');\n  if(t&&p){t.addEventListener('click',function(){var o=t.getAttribute('aria-expanded')==='true';\n    t.setAttribute('aria-expan atory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"leadership_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Leadership<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:24ch\">Named people, named responsibilities.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">Institutions do not partner\n      with a company; they partner with the people who will be accountable when something goes wrong.\n      Every role on this page carries a named individual or is shown, honestly, as not yet appointed.<\/p>\n    <p class=\"hero-status\" style=\"max-width:74ch\">\n      <span aria-hidden=\"true\">\u25b2<\/span>\n      <span>EKORails does not describe relationships with regulators, officials or institutions as a\n        qualification. Where an individual has held a regulated role, it is stated with the institution\n        and the dates so that it can be verified.<\/span>\n    <\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"leadership_people\">\n  <div class=\"shell\">\n    <div class=\"grid grid-3\">\n      <article class=\"person\">\n        <img class=\"person-photo\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0ODAgNjAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlBvcnRyYWl0IHBob3RvZ3JhcGggdG8gYmUgc3VwcGxpZWQiPgogIDxyZWN0IHdpZHRoPSI0ODAiIGhlaWdodD0iNjAwIiBmaWxsPSIjRTRERUQyIi8+CiAgPGNpcmNsZSBjeD0iMjQwIiBjeT0iMjM4IiByPSI3MiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjQzZCRUFFIiBzdHJva2Utd2lkdGg9IjIiLz4KICA8cGF0aCBkPSJNMTMyIDQyMGMwLTYwIDQ4LTEwNCAxMDgtMTA0czEwOCA0NCAxMDggMTA0IiBmaWxsPSJub25lIiBzdHJva2U9IiNDNkJFQUUiIHN0cm9rZS13aWR0aD0iMiIvPgogIDx0ZXh0IHg9IjI0MCIgeT0iNTAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iSUJNIFBsZXggTW9ubywgbW9ub3NwYWNlIiBmb250LXN \/dt><dd>The compliance officer reports to the board, has direct access to it, and can stop activity without requiring executive agreement.<\/dd><\/div>\n      <div><dt>Risk review cadence<\/dt><dd>Risk register, incidents, open regulatory matters and control exceptions reviewed on a defined cycle. Cadence: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/dd><\/div>\n      <div><dt>Advisers<\/dt><dd>Legal, regulatory and technical advisers are named only where the adviser has consented in writing to be named, and their role is described accurately rather than as endorsement.<\/dd><\/div>\n      <div><dt>GoBeyond Advisory<\/dt><dd>GoBeyond Advisory&rsquo;s role in relation to EKORails LTD \u2014 whether as strategic development partner, adviser or otherwise \u2014 is described only where it is legally and factually accurate. EKORails LTD is the legal applicant and the operating entity. Exact relationship and any contractual basis for describing it: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/dd><\/div>\n      <div><dt>Conflicts of interest<\/dt><dd>Declared, recorded and managed under a written policy. Directors and officers declare outside interests that could affect corridor, partner or vendor decisions.<\/dd><\/div>\n    <\/dl>\n  <\/div>\n<\/section>\n\n<section class=\"cta-band\" data-section=\"leadership_cta\">\n  <div class=\"shell\">\n    <h2>Want to meet the people accountable for this?<\/h2>\n    <p>Partner and regulator conversations are held with the named individuals responsible, not with a\n      sales function.<\/p>\n    <div class=\"btn-row\">\n      <a class=\"btn btn-emerald\" href=\"/partners\" data-cta=\"leadership_partner\">Discuss a Partnership<\/a>\n      <a class=\"btn btn-on-dark\" href=\"/contact\" data-cta=\"leadership_contact\">Contact<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform< bile-nav\" data-mobile-nav hidden>\n    <ul><li><a href=\"/platform\">Platform<\/a><\/li><li><a href=\"/use-cases\">Use Cases<\/a><\/li><li><a href=\"/pilot-and-regulatory-pathway\">Regulatory Pathway<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"news_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">News and updates<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:22ch\">What changed, when, and what proves it.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">This page is deliberately\n      quiet. We publish an update when something has actually changed \u2014 an incorporation, a filing, an\n      executed agreement, a completed test, a published research piece \u2014 and not to maintain momentum.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"news_list\">\n  <div class=\"shell\">\n    <div class=\"callout\" style=\"margin-bottom:var(--s-6)\">\n      <h2>Publication standard<\/h2>\n      <p>Any update that touches regulatory status, partner relationships or platform capability is\n        reviewed by the named compliance officer before publication, against the same evidence standard\n        used for the <a href=\"/pilot-and-regulatory-pathway\">regulatory pathway tracker<\/a>. We do not\n        announce intentions as achievements, and we do not name a partner before that partner has agreed\n        in writing to be named.<\/p>\n    <\/div>\n\n    <article class=\"news-item\">\n      <p class=\"news-date\"><span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 date]<\/span><\/p>\n      <div>\n        <h3>EKORails LTD applies to the Central Bank of Nigeria Regulatory Sandbox<\/h3>\n        <p class=\"muted small\">Category: Regulatory<\/p>\n        <p style=\"margin-top:.6rem\">EKORails LTD has applied to participate in the Central Bank of\n          Nigeria Regulatory Sandbox with a proposal for a compliance-first settlement and\n          interoperability layer serving a single initial corridor. Participation and all proposed pilot\n          activities remain subject to regulatory review and approval. No decision, admission or approval\n          has been received.<\/p>\n        <p style=\"margin-top:.6rem\"><a class=\"link-arrow\" href=\"/pilot-and-regulatory-pathway\">Regulatory pathway<\/a><\/p>\n      <\/div>\n    <\/article>\n\n    <article class=\"news-item\">\n      <p class=\"news-date\"><span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 date]<\/span><\/p>\n      <div>\n        <h3>EKORails LTD incorporated as the operating entity<\/h3>\n        <p class=\"muted small\">Category: Company<\/p>\n        <p style=\"margin-top:.6rem\">EKORails LTD is incorporated as the legal applicant and operating\n          entity for the proposed settlement platform. Jurisdiction, company number and date:\n          <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/p>\n      <\/div>\n    <\/article>\n\n    <article class=\"news-item\">\n      <p class=\"news-date\"><span class=\"placeholder\">[CONFIRM WITH EKORAILS \u2014 date]<\/span><\/p>\n      <div>\n        <h3>Eko Infrastructure research platform published<\/h3>\n        <p class=\"muted small\">Category: Research<\/p>\n        <p style=\"margin-top:.6rem\">Eko Infrastructure, the research, policy and market-intelligence\n          platform operated by EKORails LTD, publishes explanatory and corridor research with named\n          authors, publication and revision dates, and a public source register.<\/p>\n        <p style=\"margin-top:.6rem\"><a class=\"link-arrow\" href=\"https://ekoinfrastructure.com\">Visit Eko Infrastructure<\/a><\/p>\n      <\/div>\n    <\/article>\n\n    <div class=\"callout callout--gold\" style=\"margin-top:var(--s-6)\">\n      <h3>Editorial note<\/h3>\n      <p>The three entries above are the complete set of company updates at the time of publication.\n        Each carries a placeholder where a verified date is required. Nothing is listed here that has not\n        happened, and no forward-looking milestone is presented as an update.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" data-section=\"news_subscribe\">\n  <div class=\"shell shell-narrow\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Updates<\/p>\n      <h2>Institutional update list.<\/h2>\n      <p>Occasional updates for institutions following the regulatory pathway and corridor research. No\n        marketing sequences, no investment communications, unsubscribe in one click.<\/p>\n    <\/div>\n    <form class=\"form\" data-form=\"updates\" name=\"updates\" method=\"POST\" action=\"/thank-you\"\n          data-netlify=\"true\" netlify-honeypot=\"company_website\" novalidate>\n      <input type=\"hidden\" name=\"form-name\" value=\"updates\">\n      <input type=\"hidden\" name=\"form_render_ts\" value=\"\">\n      <p class=\"hp\" aria-hidden=\"true\"><label>Company website<input type=\"text\" id=\"company_website\" name=\"company_website\" tabindex=\"-1\" autocomplete=\"off\" aria-label=\"Leave this field empty\"><\/label><\/p>\n      <div class=\"form-grid\">\n        <div class=\"field\">\n          <label for=\"u_name\">Full name <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n          <input id=\"u_name\" name=\"full_name\" type=\"text\" autocomplete=\"name\" required maxlength=\"120\">\n          <span class=\"error\">Please enter your full name.<\/span>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"u_org\">Organisation <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n          <input id=\"u_org\" name=\"organization\" type=\"text\" autocomplete=\"organization\" required maxlength=\"160\">\n          <span class=\"error\">Please enter your organisation.<\/span>\n        <\/div>\n        <div class=\"field span-2\">\n          <label for=\"u_email\">Work email <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n          <input id=\"u_email\" name=\"work_email\" type=\"email\" autocomplete=\"email\" required maxlength=\"180\">\n          <span class=\"error\">Please enter a valid work email address.<\/span>\n        <\/div>\n      <\/div>\n      <div class=\"checkbox\">\n        <input id=\"u_consent\" name=\"consent\" type=\"checkbox\" required value=\"yes\">\n        <label for=\"u_consent\">I consent to receiving occasional updates from EKORails LTD and to my\n          details being processed as described in the <a href=\"/privacy-policy\">privacy policy<\/a>.\n          <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n      <\/div>\n      <div class=\"btn-row\"><button class=\"btn btn-emerald\" type=\"submit\">Subscribe to updates<\/button><\/div>\n    <\/form>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data- iance<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a class=\"is-active\" aria-current=\"page\" href=\"/partners\">Partners<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><li><a href=\"/news\">News<\/a><\/li><\/ul>\n    <a class=\"btn btn-solid btn-block\" href=\"/contact\">Contact<\/a>\n    <p class=\"mobile-nav-note\">Proposed pilot activities remain subject to regulatory and partner approval.<\/p>\n  <\/div>\n<\/header>\n<main id=\"main\" tabindex=\"-1\">\n<section class=\"section section--tight\" style=\"background:var(--navy-900);color:var(--on-dark)\" data-section=\"partners_intro\">\n  <div class=\"shell\">\n    <p class=\"eyebrow\" style=\"color:var(--emerald-300)\">Institutional partnerships<\/p>\n    <h1 style=\"font-size:var(--step-4);color:var(--white);max-width:24ch\">Built with institutions, or not built at all.<\/h1>\n    <p class=\"lede\" style=\"color:var(--on-dark-2);margin-top:var(--s-4)\">Every function in a corridor\n      that requires a licence is performed by an institution that holds one. That makes partnership the\n      whole strategy rather than a channel within it.<\/p>\n    <p class=\"hero-status\" style=\"max-width:74ch\">\n      <span aria-hidden=\"true\">\u25b2<\/span>\n      <span>This page is for institutional, enterprise, technology, regulatory and research\n        partnerships only. EKORails does not solicit investment through this website, does not publish\n        investment terms and does not accept investment enquiries through this form.<\/span>\n    <\/p>\n  <\/div>\n<\/section>\n\n<section class=\"section\" data-section=\"partners_categories\">\n  <div class=\"shell\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Partner categories<\/p>\n      <h2>Seven kinds of partner, each with a different first conversation.<\/h2>\n    <\/div>\n    <div class=\"partner-cat\">\n      <h3>Banks and licensed payment institutions<\/h3>\n      <p>Institutions that can hold customer funds, execute conversion, provide settlement or effect\n        payout in either market of the corridor. First conversation: scope, licensing, control\n        expectations, data sharing and the split of regulated responsibilities.<\/p>\n    <\/div>\n    <div class=\"partner-cat\">\n      <h3>Enterprise and trade partners<\/h3>\n      <p>Businesses with recurring, documented corridor obligations who are willing to participate in a\n        controlled pilot within the approved scope. First conversation: your actual flows, your current\n        reconciliation problem and whether it is in scope.<\/p>\n    <\/div>\n    <div class=\"partner-cat\">\n      <h3>FX and liquidity providers<\/h3>\n      <p>Licensed counterparties able to quote and execute the conversion leg at the sizes and times the\n        corridor requires. First conversation: currency pairs, size bands, quote mechanics and settlement\n        arrangements.<\/p>\n    <\/div>\n    <div class=\"partner-cat\">\n      <h3>Technology and cybersecurity providers<\/h3>\n      <p>Infrastructure, resilience, testing and assurance partners supporting a platform intended for\n        institutional use. First conversation: scope of engagement, security requirements and\n        subcontracting.<\/p>\n    <\/div>\n    <div class=\"partner-cat\">\n      <h3>Identity and compliance providers<\/h3>\n      <p>Verification, screening, monitoring and case-management capabilities meeting institutional\n        standards in both markets of a corridor. First conversation: coverage, list sources, latency,\n        accuracy and evidence retention.<\/p>\n    <\/div>\n    <div class=\"partner-cat\">\n      <h3>Regulators and policy institutions<\/h3>\n      <p>Supervisors, policy bodies, development finance institutions and trade organisations engaging on\n        interoperability, corridor economics, controls and market structure. Enquiries route directly to\n        the named compliance officer.<\/p>\n    <\/div>\n    <div class=\"partner-cat\">\n      <h3>Research and development partners<\/h3>\n      <p>Institutions collaborating on corridor data, settlement research and market analysis, published\n        through <a href=\"https://ekoinfrastructure.com\">Eko Infrastructure<\/a> with sources and named\n        authors.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section section--ivory2\" id=\"enquiry\" data-section=\"partners_form\">\n  <div class=\"shell shell-narrow\">\n    <div class=\"section-head\">\n      <p class=\"eyebrow\">Partnership enquiry<\/p>\n      <h2>Discuss a partnership.<\/h2>\n      <p>One form, routed by organisation type to the right person. Bank, payment institution and\n        regulator enquiries go to the named compliance officer; enterprise and technology enquiries go\n        to the partnerships team.<\/p>\n    <\/div>\n\n    <form class=\"form\" data-form=\"partnership\" name=\"partnership\" method=\"POST\"\n          action=\"/thank-you\" data-netlify=\"true\" netlify-honeypot=\"company_website\" novalidate>\n      <input type=\"hidden\" name=\"form-name\" value=\"partnership\">\n      <input type=\"hidden\" name=\"form_render_ts\" value=\"\">\n      <input type=\"hidden\" name=\"source_page\" value=\"/partners\">\n      <p class=\"hp\" aria-hidden=\"true\">\n        <label>Company website<input type=\"text\" id=\"company_website\" name=\"company_website\" tabindex=\"-1\" autocomplete=\"off\" aria-label=\"Leave this field empty\"><\/label>\n      <\/p>\n\n      <fieldset>\n        <legend>About you<\/legend>\n        <div class=\"form-grid\" style=\"margin-top:var(--s-4)\">\n          <div class=\"field\">\n            <label for=\"full_name\">Full name <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <input id=\"full_name\" name=\"full_name\" type=\"text\" autocomplete=\"name\" required maxlength=\"120\">\n            <span class=\"error\">Please enter your full name.<\/span>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"position\">Position <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <input id=\"position\" name=\"position\" type=\"text\" autocomplete=\"organization-title\" required maxlength=\"120\">\n            <span class=\"error\">Please enter your position.<\/span>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"organization\">Organisation <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <input id=\"organization\" name=\"organization\" type=\"text\" autocomplete=\"organization\" required maxlength=\"160\">\n            <span class=\"error\">Please enter your organisation.<\/span>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"country\">Country <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <input id=\"country\" name=\"country\" type=\"text\" autocomplete=\"country-name\" required maxlength=\"80\">\n            <span class=\"error\">Please enter the country your organisation operates from.<\/span>\n          <\/div>\n          <div class=\"field span-2\">\n            <label for=\"work_email\">Work email <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <input id=\"work_email\" name=\"work_email\" type=\"email\" autocomplete=\"email\" required\n                   maxlength=\"180\" pattern=\"[^@\\s]+@[^@\\s.]+\\.[^@\\s]{2,}\">\n            <span class=\"hint\">Please use an organisational email address. Free webmail addresses are\n              accepted but slow down verification.<\/span>\n            <span class=\"error\">Please enter a valid work email address.<\/span>\n          <\/div>\n        <\/div>\n      <\/fieldset>\n\n      <fieldset>\n        <legend>About the partnership<\/legend>\n        <div class=\"form-grid\" style=\"margin-top:var(--s-4)\">\n          <div class=\"field span-2\">\n            <label for=\"organization_type\">Organisation type <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <select id=\"organization_type\" name=\"organization_type\" required>\n              <option value=\"\">Select organisation type\u2026<\/option>\n              <option value=\"bank_or_payment_institution\">Bank or licensed payment institution<\/option>\n              <option value=\"enterprise_or_trade\">Enterprise or trade organisation<\/option>\n              <option value=\"fx_or_liquidity\">FX or liquidity provider<\/option>\n              <option value=\"technology_provider\">Technology or cybersecurity provider<\/option>\n              <option value=\"compliance_provider\">Identity or compliance provider<\/option>\n              <option value=\"regulator_or_government\">Government, regulator or policy institution<\/option>\n              <option value=\"research_organization\">Research organisation<\/option>\n              <option value=\"general\">General institutional enquiry<\/option>\n            <\/select>\n            <span class=\"error\">Please select an organisation type.<\/span>\n          <\/div>\n          <div class=\"field span-2\">\n            <label for=\"proposed_partnership\">Proposed partnership <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <input id=\"proposed_partnership\" name=\"proposed_partnership\" type=\"text\" required maxlength=\"200\">\n            <span class=\"hint\">In one line \u2014 for example &ldquo;settlement partner for the receiving market&rdquo; or &ldquo;sanctions screening provider&rdquo;.<\/span>\n            <span class=\"error\">Please describe the partnership you are proposing.<\/span>\n          <\/div>\n          <div class=\"field span-2\" data-if-regulated>\n            <label for=\"licence_status\">Relevant licence or regulatory status<\/label>\n            <input id=\"licence_status\" name=\"licence_status\" type=\"text\" maxlength=\"200\">\n            <span class=\"hint\">Licence type, issuing authority and licence number where applicable. Leave blank if not applicable.<\/span>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"expected_corridor\">Expected transaction corridor<\/label>\n            <input id=\"expected_corridor\" name=\"expected_corridor\" type=\"text\" maxlength=\"120\">\n            <span class=\"hint\">For example &ldquo;Nigeria to [market]&rdquo;. Leave blank if not applicable.<\/span>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"volume_range\">Expected transaction volume range<\/label>\n            <select id=\"volume_range\" name=\"volume_range\">\n              <option value=\"\">Not applicable / unknown<\/option>\n              <option value=\"under_100k_month\">Under US$100,000 per month<\/option>\n              <option value=\"100k_1m_month\">US$100,000 \u2013 US$1m per month<\/option>\n              <option value=\"1m_10m_month\">US$1m \u2013 US$10m per month<\/option>\n              <option value=\"10m_50m_month\">US$10m \u2013 US$50m per month<\/option>\n              <option value=\"over_50m_month\">Over US$50m per month<\/option>\n            <\/select>\n            <span class=\"hint\">Indicative only. Nothing here is a commitment by either party.<\/span>\n          <\/div>\n          <div class=\"field span-2\">\n            <label for=\"message\">Message <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n            <textarea id=\"message\" name=\"message\" required maxlength=\"4000\"><\/textarea>\n            <span class=\"hint\">Please do not include confidential information in a first message. We will\n              put an NDA in place before that conversation.<\/span>\n            <span class=\"error\">Please tell us what you would like to discuss.<\/span>\n          <\/div>\n        <\/div>\n      <\/fieldset>\n\n      <div class=\"checkbox\">\n        <input id=\"consent\" name=\"consent\" type=\"checkbox\" required value=\"yes\">\n        <label for=\"consent\">I consent to EKORails LTD storing and processing the information in this\n          form in order to respond to my enquiry, as described in the\n          <a href=\"/privacy-policy\">privacy policy<\/a>. I understand this is not an application for a\n          financial service and does not create any obligation on either party.\n          <span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n      <\/div>\n\n      <div class=\"callout callout--gold\">\n        <p><strong>Please note.<\/strong> This form is not for investment enquiries. EKORails LTD does not\n          publish investment terms, equity offers, convertible-note opportunities, governance seats,\n          partner economics or fundraising deadlines on this website, and does not accept investment\n          enquiries here.<\/p>\n      <\/div>\n\n      <div class=\"btn-row\">\n        <button class=\"btn btn-emerald\" type=\"submit\">Send partnership enquiry<\/button>\n        <span class=\"small muted\">Typical response time: <span class=\"placeholder\">[CONFIRM WITH EKORAILS]<\/span><\/span>\n      <\/div>\n    <\/form>\n  <\/div>\n<\/section>\n<\/main>\n<div class=\"consent\" data-consent role=\"region\" aria-label=\"Cookie choices\" hidden>\n  <div class=\"shell consent-inner\">\n    <p>We use a privacy-preserving measurement tool to understand which pages institutional visitors\n      read. No advertising cookies, no cross-site tracking and no sale of data. Read the\n      <a href=\"/privacy-policy\">privacy policy<\/a>.<\/p>\n    <div class=\"consent-actions\">\n      <button class=\"btn btn-sm btn-ghost\" type=\"button\" data-consent-choice=\"denied\">Essential only<\/button>\n      <button class=\"btn btn-sm btn-solid\" type=\"button\" data-consent-choice=\"granted\">Allow measurement<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n<footer class=\"site-footer\" id=\"footer\">\n  <div class=\"shell\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <svg width=\"132\" height=\"30\" viewBox=\"0 0 132 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"EKORails\">\n  <rect x=\"0.6\" y=\"0.6\" width=\"28.8\" height=\"28.8\" rx=\"3\" fill=\"none\" stroke=\"rgba(243,241,236,0.3)\"/>\n  <path d=\"M7 21.5 L23 8.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n  <path d=\"M7 24.5 L23 11.5\" stroke=\"#6FC3A2\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n  <path d=\"M9.4 22.9 L10.6 21.2 M13.4 19.6 L14.6 17.9 M17.4 16.3 L18.6 14.6\" stroke=\"#6FC3A2\" stroke-width=\"1.2\" stroke-linecap=\"round\" opacity=\"0.8\"/>\n  <circle cx=\"22.6\" cy=\"8.2\" r=\"2.6\" fill=\"#A8863F\"/>\n  <text x=\"38\" y=\"21\" font-family=\"Inter, Helvetica, Arial, sans-serif\" font-size=\"17\" letter-spacing=\"0.2\"><tspan font-weight=\"700\" fill=\"#FFFFFF\">EKO<\/tspan><tspan font-weight=\"400\" fill=\"#C2CDD5\">Rails<\/tspan><\/text>\n<\/svg>\n        <p class=\"footer-tag\">Settlement infrastructure for African trade.<\/p>\n        <p class=\"footer-sub\">Connecting regulated institutions, businesses and markets across African and global trade corridors.<\/p>\n      <\/div>\n      <div class=\"footer-cols\"><div class=\"footer-col\"><h2 class=\"footer-h\">Platform<\/h2><ul><li><a href=\"/platform\">Platform overview<\/a><\/li><li><a href=\"/technology\">Technology<\/a><\/li><li><a href=\"/use-cases\">Use cases<\/a><\/li><li><a href=\"/corridors\">Corridors<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Governance<\/h2><ul><li><a href=\"/pilot-and-regulatory-pathway\">Pilot &amp; regulatory pathway<\/a><\/li><li><a href=\"/compliance-and-risk\">Compliance &amp; risk<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"/leadership\">Leadership<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Engage<\/h2><ul><li><a href=\"/partners\">Institutional partnerships<\/a><\/li><li><a href=\"/contact\">Contact<\/a><\/li><li><a href=\"/news\">News &amp; updates<\/a><\/li><li><a href=\"https://ekoinfrastructure.com\" rel=\"noopener\">Eko Infrastructure research<\/a><\/li><\/ul><\/div><div class=\"footer-col\"><h2 class=\"footer-h\">Legal<\/h2><ul><li><a href=\"/privacy-policy\">Privacy policy<\/a><\/li><li><a href=\"/terms-of-use\">Terms of use<\/a><\/li><li><a href=\"/regulatory-disclaimer\">Regulatory disclaimer<\/a><\/li><li><a href=\"mailto:compliance@ekorails.com\">compliance@ekorails.com<\/a><\/li><\/ul><\/div><\/div>\n    <\/div>\n    <div class=\"footer-status\" role=\"note\">\n      <p><strong>Regulatory status.<\/strong> EKORails LTD has applied to participate in the Central Bank of Nigeria Regulatory Sandbox. Participation and all proposed pilot activities remain subject to regulatory review and approval. EKORails LTD is not licensed, authorised, approved, endorsed or supervised by the Central Bank of Nigeria or by any other financial services regulator, and does not hold a payment services, banking or money transmission licence in any jurisdiction. See the <a href=\"/regulatory-disclaimer\">Regulatory Disclaimer<\/a>.<\/p>\n    <\/div>\n    <div class=\"footer-legal\">\n      <p class=\"disclaimer\">EKORails LTD is developing financial infrastructure for institutional and enterprise use. Information on this website is provided for general and partnership purposes and does not constitute financial, investment, legal or payment-services advice. Products, pilot activities and services described may be subject to regulatory review, licensing, partner approval and geographic restrictions.<\/p>\n      <p class=\"colophon\">&copy; 2026 EKORails LTD. Registered company. Company number [CONFIRM WITH EKORAILS] \u00b7 Registered office [CONFIRM WITH EKORAILS].<\/p>\n    <\/div>\n  <\/div>\n<\/footer>\n\n\n\n<script>\n(function(){\n  var t=document.querySelector('[data-nav-toggle]'),p=document.querySelector('[data-mobile-nav]');\n  if(t&&p){t.addEventListener('click',function(){var o=t.getAttribute('a
